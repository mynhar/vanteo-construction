<script>
/* ==========================================================================
   BO · Opportunités : pipeline commercial (kanban par étape)
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, addDays, diffDays } = U;
  const STAGES = [['Prospect', .1, '#9fb3b0'], ['Appel d’offres', .2, '#5b6bd6'], ['Chiffrage', .35, '#7b61d9'], ['Offre envoyée', .5, '#3b82f6'], ['Négociation', .75, '#e8930c'], ['Gagnée', 1, '#1f9d55'], ['Perdue', 0, '#e5484d']];
  const PROB = Object.fromEntries(STAGES.map(([s, p]) => [s, p]));
  const st = { owner: '', showClosed: true };

  BO.dealForm = (id, pre = {}) => {
    const d = id ? VX.S.deals.find(x => x.id === id) : null;
    BO.formModal({
      title: d ? 'Opportunité' : 'Nouvelle opportunité',
      fields: [
        { k: 'title', label: 'Projet', req: true, full: true, ph: 'ex. Immeuble 12 logements – Bussigny' },
        { k: 'clientId', label: 'Client / maître d’ouvrage', type: 'select', opts: BO.optClients(), req: true, empty: '— choisir —' },
        { k: 'amount', label: 'Montant estimé HT (CHF)', type: 'number', min: 0, step: 1000, req: true },
        { k: 'stage', label: 'Étape', type: 'select', opts: STAGES.map(s => s[0]) },
        { k: 'owner', label: 'Responsable', type: 'select', opts: BO.optEmps(e => VX.ROLES[e.role].hq) },
        { k: 'next', label: 'Prochaine action le', type: 'date', req: true },
        { k: 'nextLabel', label: 'Prochaine action', ph: 'ex. visite du terrain, remise d’offre…' },
        { k: 'source', label: 'Origine', type: 'select', opts: ['Client existant', 'Appel d’offres public (simap.ch)', 'Recommandation', 'Architecte / bureau d’ingénieurs', 'Site web', 'Salon / réseau'] },
        { k: 'notes', label: 'Notes', type: 'textarea', full: true, rows: 3 },
      ],
      values: d || Object.assign({ stage: 'Prospect', owner: VX.S.meId, next: addDays(today(), 7), source: 'Client existant' }, pre),
      danger: d ? { title: 'Supprimer l’opportunité ?', text: '« ' + esc(d.title) + ' » sera retirée du pipeline.', run: () => { VX.remove('deals', d.id, 'deals'); UI.toast('Opportunité supprimée', d.title, 'ok'); } } : null,
      after: d ? `<div class="row mt"><button class="btn" data-mkq>${UI.icon('quote', 16)}${d.quoteId ? 'Ouvrir l’offre liée' : 'Créer l’offre à partir de l’opportunité'}</button></div>` : '',
      onMount: (el, close) => { const b = el.querySelector('[data-mkq]'); if (b) b.onclick = () => { close(); dealToQuote(d.id); }; },
      onSubmit: v => {
        const o = Object.assign({ id: d ? d.id : U.uid('p') }, v);
        VX.upsert('deals', o, 'deals');
        if (!d) { VX.log('Nouvelle opportunité : ' + v.title + ' (' + chfK(v.amount) + ')', 'quote'); VX.save(); }
        UI.toast(d ? 'Opportunité mise à jour' : 'Opportunité créée', v.title, 'ok', 'target');
      },
    });
  };
  const dealToQuote = id => {
    const d = VX.S.deals.find(x => x.id === id);
    if (d.quoteId && VX.S.quotes.find(q => q.id === d.quoteId)) { APP.open('quotes', { id: d.quoteId }); return; }
    const q = BO.newQuote({ clientId: d.clientId, title: d.title });
    VX.upsert('deals', { id: d.id, quoteId: q.id, stage: STAGES.findIndex(s => s[0] === d.stage) < 2 ? 'Chiffrage' : d.stage }, 'deals');
  };
  const setStage = (id, stage) => {
    const d = VX.S.deals.find(x => x.id === id); if (!d || d.stage === stage) return;
    VX.upsert('deals', { id, stage }, 'deals');
    VX.log('Opportunité « ' + d.title + ' » → ' + stage, 'quote'); VX.save();
    if (stage === 'Gagnée') { UI.toast('Affaire gagnée !', d.title + ' · ' + chfK(d.amount), 'ok', 'trophy'); VX.emit('victory', { kind: 'deal', label: d.title }); }
    else UI.toast('Étape mise à jour', d.title + ' → ' + stage, 'ok', 'check');
  };

  function render(el, p) {
    const S = VX.S, t0 = today();
    if (p.id && S.deals.find(d => d.id === p.id)) { const id = p.id; p.id = null; setTimeout(() => BO.dealForm(id), 40); }
    let deals = S.deals.slice();
    if (st.owner) deals = deals.filter(d => d.owner === st.owner);
    const open = deals.filter(d => !/Gagn|Perdu/.test(d.stage));
    const total = open.reduce((a, d) => a + d.amount, 0), weighted = open.reduce((a, d) => a + d.amount * (PROB[d.stage] ?? .3), 0);
    const won = deals.filter(d => d.stage === 'Gagnée'), due = open.filter(d => d.next && d.next <= t0);
    const stages = STAGES.filter(s => st.showClosed || !/Gagn|Perdu/.test(s[0]));
    el.innerHTML = `<div class="bo-page">${BO.head('Opportunités', 'Pipeline commercial · glissez une carte pour changer d’étape', `<select class="inp" data-owner style="height:38px;width:auto">${BO.opts(BO.optEmps(e => S.deals.some(d => d.owner === e.id)), st.owner, 'Tous les responsables')}</select><label class="chk" style="padding:4px 8px"><input type="checkbox" data-closed ${st.showClosed ? 'checked' : ''}> Gagnées / perdues</label><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouvelle opportunité</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Pipeline ouvert', v: chfK(total), s: `${open.length} opportunités`, icon: 'target', cls: 'hero' })}
        ${BO.kpi({ lb: 'Pondéré', v: chfK(weighted), s: 'montant × probabilité d’étape', icon: 'percent' })}
        ${BO.kpi({ lb: 'Gagnées', v: chfK(won.reduce((a, d) => a + d.amount, 0)), s: `${won.length} affaire${won.length > 1 ? 's' : ''}`, icon: 'trophy', cls: 'green' })}
        ${BO.kpi({ lb: 'Actions à faire', v: due.length, s: due.length ? 'prochaines actions échues' : 'rien en retard', icon: 'bell', cls: due.length ? 'amber' : 'green' })}
      </div>
      <div class="kanban" style="grid-auto-columns:minmax(232px,1fr)">${stages.map(([s, pr, col]) => {
        const ds = deals.filter(d => d.stage === s).sort((a, b) => (a.next || '').localeCompare(b.next || ''));
        return `<div class="kcol" data-col="${esc(s)}"><div class="kcol-h"><i class="dot-s" style="background:${col}"></i>${esc(s)}<span class="n">${ds.length}</span></div><div class="xs-t muted b" style="padding:0 6px 4px">${chfK(ds.reduce((a, d) => a + d.amount, 0))}${pr > 0 && pr < 1 ? ' · pondéré ' + chfK(ds.reduce((a, d) => a + d.amount, 0) * pr) : ''}</div>
          ${ds.length ? ds.map(d => { const late = d.next && d.next < t0 && !/Gagn|Perdu/.test(d.stage), o = VX.emp(d.owner); return `<div class="kcard" draggable="true" data-id="${d.id}" style="border-left-color:${col}"><div class="kt">${esc(d.title)}</div><div class="km">${esc(BO.clientName(d.clientId))}</div><div class="row" style="margin-top:9px"><b style="font-size:15px">${chfK(d.amount)}</b><span class="sp"></span>${o ? UI.avatar(o, 24) : ''}</div>${!/Gagn|Perdu/.test(d.stage) ? `<div class="km"><span class="${late ? 'bad-t b' : d.next === t0 ? 'warn-t b' : ''}">${UI.icon('calendar', 13)} ${BO.inDays(d.next)}</span>${d.nextLabel ? `<span>· ${esc(d.nextLabel)}</span>` : ''}</div>` : ''}${d.quoteId ? `<div class="km"><span class="tag">${UI.icon('quote', 12)}&nbsp;${esc((S.quotes.find(q => q.id === d.quoteId) || {}).no || 'offre')}</span></div>` : ''}</div>`; }).join('') : '<div class="kempty">Aucune opportunité</div>'}</div>`;
      }).join('')}</div></div>`;
    let drag = null;
    el.querySelectorAll('.kcard').forEach(c => {
      c.addEventListener('dragstart', e => { drag = c.dataset.id; BO.dragging = true; c.classList.add('dragging'); e.dataTransfer.setData('text/plain', drag); });
      c.addEventListener('dragend', () => { BO.dragging = false; c.classList.remove('dragging'); el.querySelectorAll('.kcol').forEach(k => k.classList.remove('over')); });
      c.addEventListener('click', () => BO.dealForm(c.dataset.id));
    });
    el.querySelectorAll('.kcol').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
      col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); BO.dragging = false; const id = e.dataTransfer.getData('text/plain') || drag; if (id) setStage(id, col.dataset.col); BO.now(); });
    });
    el.querySelector('[data-new]').addEventListener('click', () => BO.dealForm());
    el.querySelector('[data-owner]').addEventListener('change', e => { st.owner = e.target.value; APP.refresh(); });
    el.querySelector('[data-closed]').addEventListener('change', e => { st.showClosed = e.target.checked; APP.refresh(); });
  }
  APP.register({ id: 'pipeline', label: 'Opportunités', icon: 'target', group: 'Commercial & finance', order: 31, render, badge: () => VX.S.deals.filter(d => !/Gagn|Perdu/.test(d.stage) && d.next && d.next <= today()).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Offres / devis : liste + éditeur CFC + aperçu imprimable
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chf2, chfK, today, addDays, diffDays, round5 } = U;
  const STATUSES = ['Brouillon', 'Envoyée', 'Négociation', 'Acceptée', 'Refusée'];
  const ST_COL = { Brouillon: '#9fb3b0', Envoyée: '#7b61d9', Négociation: '#e8930c', Acceptée: '#1f9d55', Refusée: '#e5484d' };
  const UNITS = ['m³', 'm²', 'ml', 'm', 't', 'kg', 'pce', 'forfait', 'h', 'j', 'mois'];
  const CATALOG = [
    ['112', 'Installation de chantier (baraques, clôtures, raccordements)', 'forfait', 24500],
    ['112', 'Démolition maçonnerie / béton', 'm³', 85], ['112', 'Démolition ancien couvert / annexe', 'forfait', 18500],
    ['201', 'Fouilles en pleine masse', 'm³', 38], ['201', 'Évacuation matériaux en décharge type B', 'm³', 46], ['201', 'Remblayage compacté', 'm³', 32],
    ['211.5', 'Coffrage dalles', 'm²', 58], ['211.5', 'Coffrage murs 2 faces', 'm²', 66], ['211.6', 'Armatures B500B posées', 't', 2250],
    ['211.4', 'Béton C25/30 mis en place', 'm³', 235], ['211.4', 'Béton C30/37 mis en place', 'm³', 245], ['211.4', 'Dalle industrielle quartzée', 'm²', 128],
    ['211', 'Maçonnerie brique terre cuite 17,5 cm', 'm²', 118], ['211', 'Maçonnerie béton cellulaire', 'm²', 104], ['211', 'Grue à tour – location et montage', 'mois', 14800],
    ['151', 'Canalisation PVC Ø 160 posée', 'ml', 145], ['151', 'Regard de visite Ø 800', 'pce', 2400], ['151', 'Collecteur béton Ø 600', 'ml', 420],
    ['213', 'Charpente métallique S355 posée', 'kg', 6.4], ['224', 'Étanchéité toiture plate bicouche', 'm²', 92],
    ['285', 'Crépi de façade', 'm²', 58], ['421', 'Dallage béton lavé', 'm²', 145], ['421', 'Engazonnement', 'm²', 14],
    ['461', 'Fondation grave GNT 0/45', 'm³', 62], ['461', 'Enrobé AC 11 – 4 cm', 'm²', 38], ['461', 'Bordures granit posées', 'ml', 96], ['461', 'Pavés granit îlot', 'm²', 210],
    ['481', 'Béton précontraint ouvrage d’art', 'm³', 420], ['—', 'Régie – ouvrier qualifié', 'h', 78], ['—', 'Régie – pelle 20 t avec machiniste', 'h', 165],
  ];
  const st = { status: '', q: '', tbl: { sort: 'date', dir: 'desc' } };
  const drafts = {};

  BO.quoteTotals = q => {
    const sub = (q.lines || []).reduce((a, l) => a + (+l.qty || 0) * (+l.price || 0), 0);
    const disc = sub * (q.discount || 0) / 100, ht = sub - disc, tva = ht * BO.tva(), ttc = round5(ht + tva);
    const margin = q.margin || 0, cost = ht * (1 - margin);
    return { sub, disc, ht, tva, ttc, cost, marginAmt: ht - cost };
  };
  const clone = o => JSON.parse(JSON.stringify(o));

  BO.newQuote = (pre = {}) => {
    const q = Object.assign({ id: U.uid('q'), no: BO.nextNo('quotes', 'OF'), clientId: VX.S.clients[0].id, title: 'Nouvelle offre', date: today(), validity: addDays(today(), 30), status: 'Brouillon', probability: .4, margin: .12, discount: 0, lines: [], conditions: 'Selon norme SIA 118. Prix fermes jusqu’au terme de validité. Paiement à 30 jours net sur situations mensuelles. Retenue de garantie 5 % jusqu’à la réception.' }, pre);
    VX.upsert('quotes', q, 'quote');
    VX.log('Offre ' + q.no + ' créée – ' + q.title, 'quote'); VX.save();
    APP.open('quotes', { id: q.id });
    return q;
  };
  const duplicate = id => {
    const src = VX.S.quotes.find(x => x.id === id), q = clone(src);
    Object.assign(q, { id: U.uid('q'), no: BO.nextNo('quotes', 'OF'), title: src.title + ' (copie)', date: today(), validity: addDays(today(), 30), status: 'Brouillon', probability: .4, siteId: null });
    q.lines.forEach(l => l.id = U.uid('l'));
    VX.upsert('quotes', q, 'quote'); UI.toast('Offre dupliquée', q.no + ' créée en brouillon', 'ok', 'copy');
    APP.open('quotes', { id: q.id });
  };
  BO.quoteFollowUp = id => {
    const q = VX.S.quotes.find(x => x.id === id), c = VX.client(q.clientId) || {}, t = BO.quoteTotals(q), me = VX.emp(VX.S.meId);
    BO.compose({
      title: 'Relance offre ' + q.no, to: c.email, subject: I18N.t('Votre projet « {title} » – offre {no}', { title: q.title, no: q.no }),
      note: 'Relance pré-rédigée à partir de l’offre. Relisez, ajustez, envoyez.',
      body: I18N.t('Bonjour {contact},\n\nNous revenons vers vous concernant notre offre {no} du {date} pour « {title} », d’un montant de {amount} TTC.\n\nCette offre est valable jusqu’au {validity}. Nous restons volontiers à votre disposition pour une séance afin de passer en revue les variantes ou d’ajuster le phasage selon vos contraintes.\n\nNos équipes peuvent démarrer {weeks} semaines après signature.\n\nAvec nos meilleures salutations,\n\n{sign}', {
        contact: c.contact || I18N.t('Madame, Monsieur'), no: q.no, date: U.fmtDate(q.date, { day: 'numeric', month: 'long' }), title: q.title, amount: chf2(t.ttc),
        validity: U.fmtDate(q.validity, { day: 'numeric', month: 'long', year: 'numeric' }), weeks: BO.num(3), sign: `${me.name}\n${me.title || ''}\n${VX.S.company.name} · ${VX.S.company.phone}` }),
      onSend: () => { q.followUps = (q.followUps || []).concat([{ date: today() }]); if (q.status === 'Envoyée') q.status = 'Négociation'; VX.log('Relance envoyée pour l’offre ' + q.no, 'quote'); VX.save(); VX.emit('quote', { qId: q.id }); UI.toast('Relance enregistrée', q.no + ' · ' + (c.name || ''), 'ok', 'send'); },
    });
  };
  const sendQuote = id => {
    const q = VX.S.quotes.find(x => x.id === id), c = VX.client(q.clientId) || {}, t = BO.quoteTotals(q), me = VX.emp(VX.S.meId);
    if (!q.lines.length) { UI.toast('Offre vide', 'Ajoutez au moins une ligne avant l’envoi.', 'warn'); return; }
    BO.compose({
      title: 'Envoyer l’offre ' + q.no, to: c.email, subject: I18N.t('Offre {no} – {title}', { no: q.no, title: q.title }), okLabel: 'Envoyer et passer en « Envoyée »',
      note: 'L’offre PDF est jointe automatiquement (aperçu disponible via « Aperçu / PDF »).',
      body: I18N.t('Bonjour,\n\nSuite à notre visite et à vos documents d’appel d’offres, nous avons le plaisir de vous transmettre notre offre {no} pour « {title} ».\n\nMontant total : {amount} TTC (TVA {tva} incluse)\nValidité : {validity}\n\nNous restons à votre disposition pour tout complément.\n\nMeilleures salutations,\n\n{sign}', {
        no: q.no, title: q.title, amount: chf2(t.ttc), tva: BO.tvaLbl(), validity: U.fmtDate(q.validity, { day: 'numeric', month: 'long', year: 'numeric' }), sign: `${me.name}\n${VX.S.company.name}` }),
      onSend: () => { VX.setQuoteStatus(q.id, 'Envoyée'); UI.toast('Offre envoyée', q.no + ' → ' + (c.name || ''), 'ok', 'send'); },
    });
  };
  const accept = id => {
    const q = VX.S.quotes.find(x => x.id === id);
    VX.setQuoteStatus(id, 'Acceptée');
    const d = VX.S.deals.find(x => x.quoteId === id || (x.clientId === q.clientId && !/Gagn|Perdu/.test(x.stage) && x.title.split(' ')[0] === q.title.split(' ')[0]));
    if (d) VX.upsert('deals', { id: d.id, stage: 'Gagnée', quoteId: id }, 'deals');
    UI.toast('Offre signée !', q.no + ' · ' + BO.clientName(q.clientId), 'ok', 'trophy');
    const t = BO.quoteTotals(q), c = VX.client(q.clientId) || {};
    UI.modal({
      title: '🎉 Offre acceptée',
      body: `<div class="form-note">${BO.icon('trophy', 18)}<div><b>${esc(q.title)}</b> — ${chf(t.ht)} HT signés par ${esc(c.name || '')}.</div></div><p class="mt" style="line-height:1.5;color:var(--ink2)">Voulez-vous ouvrir le chantier maintenant ? Le contrat, le budget de coûts (selon la marge prévue de ${BO.pct(q.margin)}) et la répartition CFC sont pré-remplis, et le chantier apparaîtra sur la carte.</p>`,
      foot: `<button class="btn" data-close>Plus tard</button><button class="btn pri" data-go>${UI.icon('crane', 16)}Créer le chantier</button>`,
      onMount: (el, close) => el.querySelector('[data-go]').addEventListener('click', () => { close(); createSite(q); }),
    });
  };
  const createSite = q => {
    const t = BO.quoteTotals(q), c = VX.client(q.clientId) || {};
    const words = q.title.replace(/[–-].*$/, '').trim();
    BO.siteForm(null, { name: q.title, code: (words.normalize('NFD').replace(/[^A-Za-z]/g, '').slice(0, 3) || 'NEW').toUpperCase(), city: c.city || '', clientId: q.clientId, contract: Math.round(t.ht), budget: Math.round(t.cost / 1000) * 1000, desc: 'Issu de l’offre ' + q.no + '. ' + (q.lines || []).slice(0, 3).map(l => l.label).join(', ') + '.' }, ns => {
      VX.upsert('quotes', { id: q.id, siteId: ns.id }, 'quote');
      APP.open('sites', { id: ns.id });
    });
  };

  /* ---------------- aperçu imprimable ---------------- */
  BO.printHtml = (title, inner) => `<!doctype html><html lang="${I18N.htmlLang}"><head><meta charset="utf-8"><title>${esc(title)}</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet"><style>
    @page{size:A4;margin:16mm 15mm}*{box-sizing:border-box}body{font-family:Outfit,Arial,sans-serif;color:#0d1f1e;font-size:10.5pt;margin:0;padding:24px}
    .hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #0fb5ab;padding-bottom:14px;margin-bottom:22px}
    .brand{display:flex;gap:10px;align-items:center}.brand b{font-size:20pt;font-weight:900;letter-spacing:.06em;color:#076b65}.brand small{display:block;font-size:7.5pt;letter-spacing:.25em;font-weight:600;color:#0a8f87}
    .co{font-size:8.5pt;text-align:right;color:#3f5452;line-height:1.45}.addr{margin:6px 0 24px auto;width:45%;line-height:1.45}
    h1{font-size:17pt;font-weight:900;margin:0 0 4px}.meta{color:#3f5452;font-size:9pt;margin-bottom:16px}
    table{width:100%;border-collapse:collapse;font-size:9.5pt}th{background:#e3f8f6;color:#076b65;text-align:left;padding:7px 8px;font-size:8pt;text-transform:uppercase;letter-spacing:.06em}
    td{padding:6px 8px;border-bottom:1px solid #e6eeed}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}tr.grp td{background:#f7fbfa;font-weight:800;font-size:9pt}
    .tot{margin:14px 0 0 auto;width:52%}.tot td{border:0;padding:4px 8px}.tot .big td{font-size:13pt;font-weight:900;color:#076b65;border-top:2px solid #0fb5ab;padding-top:8px}
    .cond{margin-top:24px;font-size:8.5pt;color:#3f5452;line-height:1.5;border-top:1px solid #e6eeed;padding-top:12px}.sig{display:flex;gap:40px;margin-top:34px}.sig div{flex:1;border-top:1px solid #7d908e;padding-top:6px;font-size:8.5pt;color:#7d908e}
    .stamp{display:inline-block;font-size:8pt;font-weight:800;color:#a96200;background:#fff2dc;padding:3px 8px;border-radius:6px;letter-spacing:.08em;text-transform:uppercase}
    @media print{body{padding:0}.noprint{display:none}}</style></head><body>${inner}</body></html>`;
  BO.printHeader = () => { const co = VX.S.company; return `<div class="hd"><div class="brand">${UI.logo(44).replace('fill="#fff"', 'fill="#0fb5ab"').replace('fill="#0fb5ab"/>', 'fill="#fff"/>')}<div><b>VANTEO</b><small>CONSTRUCTION</small></div></div><div class="co">${esc(co.name)}<br>${esc(co.address)}<br>${esc(co.phone)} · ${esc(co.email)}<br>IDE ${esc(co.ide)} TVA</div></div>`; };
  BO.preview = (title, html, file) => UI.modal({
    title: esc(title), wide: true, body: `<iframe class="print-frame" data-pf></iframe>`,
    foot: `<span class="muted sm-t" style="margin-right:auto">Aperçu au format A4 – utilisez « Imprimer » puis « Enregistrer en PDF ».</span><button class="btn" data-dl>${UI.icon('download', 16)}Télécharger (.html)</button><button class="btn pri" data-pr>${BO.xi('print', 16)}Imprimer / PDF</button>`,
    onMount: el => {
      const f = el.querySelector('[data-pf]'); f.addEventListener('load', () => { try { I18N.translateTree(f.contentDocument); } catch (e) {} }); f.srcdoc = html;
      el.querySelector('[data-pr]').addEventListener('click', () => { try { f.contentWindow.focus(); f.contentWindow.print(); } catch (e) { UI.toast('Impression', 'Impossible d’ouvrir la boîte d’impression.', 'warn'); } });
      el.querySelector('[data-dl]').addEventListener('click', () => BO.download(file || 'document.html', html, 'text/html;charset=utf-8'));
    },
  });
  const printQuote = q => {
    const c = VX.client(q.clientId) || {}, t = BO.quoteTotals(q), me = VX.emp(VX.S.meId);
    const groups = {}; (q.lines || []).forEach(l => (groups[l.cfc] = groups[l.cfc] || []).push(l));
    const body = Object.keys(groups).sort().map(k => `<tr class="grp"><td colspan="5">CFC ${esc(k)} – ${esc(BO.cfcLabel(k))}</td></tr>` + groups[k].map(l => `<tr><td>${esc(l.label)}</td><td>${esc(l.unit)}</td><td class="n">${BO.num(l.qty, l.qty % 1 ? 2 : 0)}</td><td class="n">${chf2(l.price).replace('CHF ', '')}</td><td class="n">${chf2(l.qty * l.price).replace('CHF ', '')}</td></tr>`).join('')).join('');
    const inner = `${BO.printHeader()}<div class="addr"><b>${esc(c.name || '')}</b><br>${esc(c.contact || '')}${c.role ? ', ' + esc(c.role) : ''}<br>${esc(c.city || '')}</div>
      <h1>Offre ${esc(q.no)}</h1><div class="meta">${esc(q.title)} · ${esc(U.fmtDate(q.date, { day: 'numeric', month: 'long', year: 'numeric' }))} · valable jusqu’au ${esc(U.fmtDate(q.validity, { day: 'numeric', month: 'long', year: 'numeric' }))} ${q.status === 'Brouillon' ? '<span class="stamp">Projet</span>' : ''}</div>
      <table><thead><tr><th>Désignation</th><th>Unité</th><th class="n">Quantité</th><th class="n">Prix unit.</th><th class="n">Montant CHF</th></tr></thead><tbody>${body || '<tr><td colspan="5">—</td></tr>'}</tbody></table>
      <table class="tot"><tr><td>Sous-total</td><td class="n">${chf2(t.sub)}</td></tr>${t.disc ? `<tr><td>Rabais ${BO.num(q.discount, 1)} %</td><td class="n">− ${chf2(t.disc)}</td></tr>` : ''}<tr><td>Total HT</td><td class="n">${chf2(t.ht)}</td></tr><tr><td>TVA ${BO.tvaLbl()}</td><td class="n">${chf2(t.tva)}</td></tr><tr class="big"><td>Total TTC (arrondi 5 ct)</td><td class="n">${chf2(t.ttc)}</td></tr></table>
      <div class="cond"><b>Conditions</b><br>${esc(q.conditions || '')}</div>
      <div class="sig"><div>Pour ${esc(VX.S.company.name)}<br><br>${esc(me.name)}, ${esc(me.title || '')}</div><div>Bon pour accord – ${esc(c.name || 'le maître d’ouvrage')}<br><br>Lieu, date et signature</div></div>`;
    BO.preview('Aperçu – offre ' + q.no, BO.printHtml('Offre ' + q.no, inner), 'Offre-' + q.no + '.html');
  };

  /* ---------------- liste ---------------- */
  function renderList(el) {
    const S = VX.S, all = S.quotes;
    let rows = all.slice();
    if (st.status) rows = rows.filter(q => q.status === st.status);
    if (st.q) { const s = st.q.toLowerCase(); rows = rows.filter(q => (q.no + ' ' + q.title + ' ' + BO.clientName(q.clientId)).toLowerCase().includes(s)); }
    const open = all.filter(q => q.status === 'Envoyée' || q.status === 'Négociation');
    const openAmt = open.reduce((a, q) => a + BO.quoteTotals(q).ht, 0), weighted = open.reduce((a, q) => a + BO.quoteTotals(q).ht * (q.probability || 0), 0);
    const won = all.filter(q => q.status === 'Acceptée').length, lost = all.filter(q => q.status === 'Refusée').length;
    const avgM = all.length ? all.reduce((a, q) => a + (q.margin || 0), 0) / all.length : 0;
    el.innerHTML = `<div class="bo-page">${BO.head('Offres & devis', 'Chiffrage par codes CFC, marge, TVA ' + BO.tvaLbl() + ' et arrondi suisse', `<button class="btn" data-cat>${UI.icon('book', 16)}Catalogue de prix</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouvelle offre</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Offres en cours', v: chfK(openAmt), s: `${open.length} offres envoyées / en négociation`, icon: 'quote', cls: 'hero' })}
        ${BO.kpi({ lb: 'Pondéré', v: chfK(weighted), s: 'montant × probabilité', icon: 'target' })}
        ${BO.kpi({ lb: 'Taux de transformation', v: won + lost ? BO.pct(won / (won + lost)) : '—', s: `${won} gagnée${won > 1 ? 's' : ''} · ${lost} perdue${lost > 1 ? 's' : ''}`, icon: 'trophy', cls: 'green' })}
        ${BO.kpi({ lb: 'Marge moyenne', v: BO.pct(avgM, 1), s: 'marge prévue au chiffrage', icon: 'percent' })}
      </div>
      <div class="pipe-steps">${STATUSES.map(s => { const qs = all.filter(q => q.status === s); return `<div data-st="${s}" class="${st.status === s ? 'on' : ''}" style="border-top-color:${ST_COL[s]}"><small>${s}</small><b>${qs.length}</b><span class="sm-t muted">${chfK(qs.reduce((a, q) => a + BO.quoteTotals(q).ht, 0))} HT</span></div>`; }).join('')}</div>
      <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="N°, titre, client…" value="${esc(st.q)}">${UI.icon('search')}</div>${st.status ? `<button class="btn sm" data-clr>${UI.icon('x', 14)}${esc(st.status)}</button>` : ''}<span class="sp"></span><span class="muted sm-t">${rows.length} offre${rows.length > 1 ? 's' : ''}</span></div>
      <div data-t></div></div>`;
    BO.table(el.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: q => APP.open('quotes', { id: q.id }),
      empty: BO.empty('quote', 'Aucune offre', 'Créez une offre en quelques clics à partir du catalogue CFC.', '<button class="btn pri" data-new>Nouvelle offre</button>'),
      cols: [
        { k: 'no', label: 'N°', render: q => `<span class="code b">${esc(q.no)}</span>` },
        { k: 'title', label: 'Objet', render: q => `<div class="t1">${esc(q.title)}</div><div class="t2">${esc(BO.clientName(q.clientId))}</div>` },
        { k: 'date', label: 'Date', render: q => BO.dateS(q.date) },
        { k: 'validity', label: 'Validité', render: q => { const d = diffDays(today(), q.validity), open = /Envoy|Négo|Brouil/.test(q.status); return `<span class="${open && d < 0 ? 'bad-t b' : open && d <= 7 ? 'warn-t b' : ''}">${BO.dateS(q.validity)}</span>${open && d <= 7 ? `<div class="t2">${d < 0 ? 'échue' : BO.inDays(q.validity)}</div>` : ''}`; } },
        { k: 'ht', label: 'Montant HT', num: true, get: q => BO.quoteTotals(q).ht, render: q => `<b>${chf(BO.quoteTotals(q).ht)}</b>` },
        { k: 'margin', label: 'Marge', num: true, render: q => BO.pct(q.margin, 1) },
        { k: 'probability', label: 'Proba.', num: true, render: q => BO.pct(q.probability) },
        { k: 'status', label: 'Statut', render: q => UI.statusChip(q.status) + (q.siteId ? ` <span class="pill-site" data-open="sites:${q.siteId}" title="Chantier créé">${UI.icon('crane', 12)}</span>` : '') },
        { k: 'a', label: '', nosort: true, render: q => `<div class="row" style="gap:2px;justify-content:flex-end"><button class="icon-btn" title="Aperçu / PDF" data-pr="${q.id}">${BO.xi('print', 16)}</button><button class="icon-btn" title="Dupliquer" data-dup="${q.id}">${BO.xi('copy', 16)}</button></div>` },
      ],
      after: h => { h.querySelectorAll('[data-pr]').forEach(b => b.onclick = () => printQuote(VX.S.quotes.find(x => x.id === b.dataset.pr))); h.querySelectorAll('[data-dup]').forEach(b => b.onclick = () => duplicate(b.dataset.dup)); h.querySelectorAll('[data-new]').forEach(b => b.onclick = () => BO.newQuote()); },
    });
    el.querySelectorAll('.pipe-steps [data-st]').forEach(d => d.addEventListener('click', () => { st.status = st.status === d.dataset.st ? '' : d.dataset.st; APP.refresh(); }));
    const clr = el.querySelector('[data-clr]'); if (clr) clr.onclick = () => { st.status = ''; APP.refresh(); };
    BO.bindSearch(el, v => st.q = v);
    el.querySelector('[data-new]').addEventListener('click', () => BO.newQuote());
    el.querySelector('[data-cat]').addEventListener('click', () => catalog(null));
  }

  /* ---------------- catalogue ---------------- */
  function catalog(onAdd) {
    let q = '';
    UI.modal({
      title: 'Catalogue de prix – CFC', wide: false,
      body: `<div class="toolbar"><div class="srch" style="flex:1"><input class="inp" data-cq placeholder="Rechercher : béton, bordure, fouille…" style="width:100%">${UI.icon('search')}</div></div><div class="cat-list" data-cl style="max-height:56vh;overflow:auto"></div>`,
      onMount: (el, close) => {
        const L = el.querySelector('[data-cl]');
        const draw = () => { const items = CATALOG.map((c, i) => [c, i]).filter(([c]) => !q || (c.join(' ')).toLowerCase().includes(q)); L.innerHTML = items.length ? items.map(([[cfc, l, u, p], i]) => `<div data-ci="${i}"><span class="code" style="width:46px">${esc(cfc)}</span><div style="flex:1"><b class="sm-t">${esc(l)}</b><div class="xs-t muted">${esc(BO.cfcLabel(cfc))}</div></div><span class="tnum b sm-t">${chf2(p)} / ${esc(u)}</span>${onAdd ? `<span class="btn sm">${UI.icon('plus', 13)}Ajouter</span>` : ''}</div>`).join('') : BO.empty('search', 'Aucun article', '', '', true); };
        draw();
        el.querySelector('[data-cq]').addEventListener('input', e => { q = e.target.value.toLowerCase(); draw(); });
        L.addEventListener('click', e => { const r = e.target.closest('[data-ci]'); if (!r || !onAdd) return; const [cfc, label, unit, price] = CATALOG[+r.dataset.ci]; onAdd({ id: U.uid('l'), cfc, label, unit, qty: 1, price }); r.style.background = 'var(--green-soft)'; UI.toast('Ligne ajoutée', label, 'ok', 'plus'); });
        setTimeout(() => el.querySelector('[data-cq]').focus(), 50);
      },
    });
  }

  /* ---------------- éditeur ---------------- */
  function renderEditor(el, p) {
    const src = VX.S.quotes.find(x => x.id === p.id);
    if (!drafts[p.id]) drafts[p.id] = { q: clone(src), dirty: false };
    const D = drafts[p.id], q = D.q;
    const locked = src.status === 'Acceptée' || src.status === 'Refusée';
    const c = VX.client(q.clientId);
    el.innerHTML = `<div class="bo-page">${BO.head(`${esc(q.no)} ${UI.statusChip(src.status)} ${D.dirty ? '<span class="chip amber" data-dirty>Non enregistré</span>' : '<span class="chip amber" data-dirty style="display:none">Non enregistré</span>'}`, `${esc(BO.clientName(q.clientId))} · créée le ${BO.date(q.date)}${src.siteId ? ` · chantier <a class="lnk" data-open="sites:${src.siteId}">${esc(BO.siteName(src.siteId))}</a>` : ''}`,
      `<button class="btn" data-print>${BO.xi('print', 16)}Aperçu / PDF</button><button class="btn" data-dup>${BO.xi('copy', 16)}Dupliquer</button>
       ${src.status === 'Brouillon' ? `<button class="btn" data-send>${UI.icon('send', 16)}Envoyer</button>` : ''}
       ${/Envoy|Négo/.test(src.status) ? `<button class="btn" data-follow>${UI.icon('mail', 16)}Relancer</button><button class="btn danger" data-lost>Refusée</button>` : ''}
       ${!locked ? `<button class="btn" data-accept style="color:var(--green)">${UI.icon('trophy', 16)}Marquer acceptée</button><button class="btn pri" data-save>${UI.icon('check', 16)}Enregistrer</button>` : ''}
       ${src.status === 'Acceptée' && !src.siteId ? `<button class="btn pri" data-mksite>${UI.icon('crane', 16)}Créer le chantier</button>` : ''}`,
      BO.crumb([['Offres', 'quotes'], [q.no]]))}
      ${locked ? `<div class="form-note mb ${src.status === 'Refusée' ? 'red' : ''}">${BO.icon(src.status === 'Acceptée' ? 'trophy' : 'lock', 17)}<div>Offre ${src.status === 'Acceptée' ? 'acceptée' : 'refusée'} : le chiffrage est verrouillé. Dupliquez-la pour créer une variante.</div></div>` : ''}
      <div class="g g-main">
        <div style="min-width:0;display:flex;flex-direction:column;gap:16px">
          <div class="card pad"><div class="fgrid c3" data-hdr>
            <div class="field full"><label>Objet de l’offre</label><input class="inp" data-k="title" value="${esc(q.title)}" ${locked ? 'disabled' : ''}></div>
            <div class="field"><label>Client / maître d’ouvrage</label><select class="inp" data-k="clientId" ${locked ? 'disabled' : ''}>${BO.opts(BO.optClients(), q.clientId)}</select></div>
            <div class="field"><label>Date</label><input class="inp" type="date" data-k="date" value="${q.date}" ${locked ? 'disabled' : ''}></div>
            <div class="field"><label>Valable jusqu’au</label><input class="inp" type="date" data-k="validity" value="${q.validity}" ${locked ? 'disabled' : ''}></div>
            <div class="field"><label>Marge prévue (%)</label><input class="inp" type="number" min="0" max="60" step="0.5" data-k="margin" data-pct value="${BO.num((q.margin || 0) * 100, 1).replace(',', '.')}" ${locked ? 'disabled' : ''}></div>
            <div class="field"><label>Rabais (%)</label><input class="inp" type="number" min="0" max="30" step="0.5" data-k="discount" value="${q.discount || 0}" ${locked ? 'disabled' : ''}></div>
            <div class="field"><label>Probabilité de signature (%)</label><input class="inp" type="number" min="0" max="100" step="5" data-k="probability" data-pct value="${Math.round((q.probability || 0) * 100)}" ${locked ? 'disabled' : ''}></div>
          </div></div>
          <div class="card"><div class="card-h"><h3>${UI.icon('layers', 18)}Positions <small>${q.lines.length} ligne${q.lines.length > 1 ? 's' : ''}</small></h3>${locked ? '' : `<button class="btn sm" data-catalog>${UI.icon('book', 14)}Catalogue</button><button class="btn sm pri" data-addl>${UI.icon('plus', 14)}Ligne</button>`}</div>
            <div class="tbl-wrap" style="box-shadow:none;border-radius:0"><table class="tbl qe-lines"><thead><tr><th style="width:150px">CFC</th><th>Désignation</th><th style="width:96px">Unité</th><th class="num" style="width:96px">Quantité</th><th class="num" style="width:112px">Prix unit.</th><th class="num" style="width:130px">Montant</th><th style="width:40px"></th></tr></thead>
            <tbody data-lines>${q.lines.length ? q.lines.map((l, i) => `<tr data-li="${i}"><td><select class="inp" data-lk="cfc" ${locked ? 'disabled' : ''}>${BO.opts([['—', '—']].concat(VX.CFC.map(([c2]) => [c2, c2 + ' ' + BO.cfcLabel(c2)])), l.cfc)}</select></td><td><input class="inp" data-lk="label" value="${esc(l.label)}" ${locked ? 'disabled' : ''}></td><td><select class="inp" data-lk="unit" ${locked ? 'disabled' : ''}>${BO.opts(UNITS.includes(l.unit) ? UNITS : UNITS.concat([l.unit]), l.unit)}</select></td><td class="num"><input class="inp" type="number" min="0" step="any" data-lk="qty" value="${l.qty}" ${locked ? 'disabled' : ''}></td><td class="num"><input class="inp" type="number" min="0" step="any" data-lk="price" value="${l.price}" ${locked ? 'disabled' : ''}></td><td class="num b" data-lt>${chf2(l.qty * l.price)}</td><td>${locked ? '' : `<button class="icon-btn" title="Supprimer" data-del="${i}">${UI.icon('trash', 15)}</button>`}</td></tr>`).join('') : `<tr><td colspan="7">${BO.empty('layers', 'Aucune position', 'Ajoutez des lignes depuis le catalogue CFC ou saisissez-les librement.', '', true)}</td></tr>`}</tbody></table></div></div>
          <div class="card pad"><div class="field"><label>Conditions particulières</label><textarea class="inp" data-k="conditions" rows="3" ${locked ? 'disabled' : ''}>${esc(q.conditions || '')}</textarea></div></div>
        </div>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          <div class="card pad" style="position:sticky;top:0"><h2 class="sec">${UI.icon('invoice', 18)}Récapitulatif</h2><div data-tot></div></div>
          <div class="card pad"><h2 class="sec">${UI.icon('chart', 18)}Répartition CFC</h2><div data-cfcsum></div></div>
          ${c ? `<div class="card pad"><h2 class="sec">${UI.icon('user', 18)}Client</h2><b>${esc(c.name)}</b><div class="sm-t muted">${esc(c.contact)} · ${esc(c.role)}</div><div class="sm-t mt" style="margin-top:6px">${esc(c.email)}<br>${esc(c.phone)}</div><button class="btn sm mt" data-open="clients:${c.id}">Fiche client</button></div>` : ''}
        </div></div></div>`;

    const totEl = el.querySelector('[data-tot]'), cfcEl = el.querySelector('[data-cfcsum]');
    const drawTot = () => {
      const t = BO.quoteTotals(q);
      totEl.innerHTML = `<dl class="qe-tot"><dt>Sous-total</dt><dd>${chf2(t.sub)}</dd>${t.disc ? `<dt>Rabais ${BO.num(q.discount, 1)} %</dt><dd>− ${chf2(t.disc)}</dd>` : ''}<dt>Total HT</dt><dd>${chf2(t.ht)}</dd><dt>TVA ${BO.tvaLbl()}</dt><dd>${chf2(t.tva)}</dd><dt class="b" style="color:var(--ink)">Total TTC <span class="xs-t muted">(arrondi 5 ct)</span></dt><dd class="big">${chf2(t.ttc)}</dd></dl>
        <div class="sep"></div><dl class="qe-tot"><dt>Coût de revient estimé</dt><dd>${chf(t.cost)}</dd><dt>Marge brute</dt><dd class="${q.margin < .08 ? 'warn-t' : 'ok-t'}">${chf(t.marginAmt)} (${BO.pct(q.margin, 1)})</dd><dt>Montant pondéré</dt><dd>${chf(t.ht * (q.probability || 0))}</dd></dl>
        ${q.margin < .08 ? `<div class="form-note warn mt">${BO.icon('alert', 16)}<div>Marge sous l’objectif de 8 % : vérifiez les prix unitaires.</div></div>` : ''}`;
      const by = {}; q.lines.forEach(l => by[l.cfc] = (by[l.cfc] || 0) + l.qty * l.price); const tot = Object.values(by).reduce((a, b) => a + b, 0) || 1;
      cfcEl.innerHTML = Object.keys(by).length ? Object.entries(by).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div style="margin:8px 0"><div class="row sm-t"><span class="code">${esc(k)}</span><span class="b" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(BO.cfcLabel(k))}</span><span class="tnum">${chfK(v)}</span></div><div class="bar" style="margin-top:4px"><i style="width:${v / tot * 100}%"></i></div></div>`).join('') : '<div class="muted sm-t">—</div>';
    };
    drawTot();
    const dirty = () => { D.dirty = true; const d = el.querySelector('[data-dirty]'); if (d) d.style.display = ''; };
    el.querySelectorAll('[data-hdr] [data-k], [data-k="conditions"]').forEach(inp => inp.addEventListener('input', () => {
      const k = inp.dataset.k; let v = inp.value;
      if (inp.type === 'number') v = (+v || 0) / (inp.dataset.pct != null ? 100 : 1);
      q[k] = v; dirty(); drawTot();
    }));
    el.querySelector('[data-k="clientId"]') && el.querySelector('[data-k="clientId"]').addEventListener('change', e => { q.clientId = e.target.value; dirty(); });
    el.querySelectorAll('[data-lines] tr[data-li]').forEach(tr => {
      const l = q.lines[+tr.dataset.li];
      tr.querySelectorAll('[data-lk]').forEach(inp => inp.addEventListener(inp.tagName === 'SELECT' ? 'change' : 'input', () => {
        const k = inp.dataset.lk; l[k] = (k === 'qty' || k === 'price') ? (+inp.value || 0) : inp.value;
        tr.querySelector('[data-lt]').textContent = chf2(l.qty * l.price); dirty(); drawTot();
      }));
    });
    const rer = () => { D.dirty = true; renderEditor(el, p); };
    el.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { q.lines.splice(+b.dataset.del, 1); rer(); }));
    const add = el.querySelector('[data-addl]'); if (add) add.onclick = () => { q.lines.push({ id: U.uid('l'), cfc: q.lines.length ? q.lines[q.lines.length - 1].cfc : '211', label: '', unit: 'm²', qty: 1, price: 0 }); rer(); setTimeout(() => { const ins = el.querySelectorAll('[data-lk="label"]'); ins[ins.length - 1] && ins[ins.length - 1].focus(); }, 30); };
    const cat = el.querySelector('[data-catalog]'); if (cat) cat.onclick = () => catalog(line => { q.lines.push(line); D.dirty = true; renderEditor(el, p); });
    const save = (silent) => {
      if (!q.title.trim()) { UI.toast('Objet manquant', 'Donnez un titre à l’offre.', 'warn'); return false; }
      if (q.lines.some(l => !String(l.label).trim())) { UI.toast('Ligne incomplète', 'Chaque position doit avoir une désignation.', 'warn'); return false; }
      if (q.validity < q.date) { UI.toast('Validité invalide', 'La validité doit suivre la date de l’offre.', 'warn'); return false; }
      const keepStatus = VX.S.quotes.find(x => x.id === q.id).status;
      VX.upsert('quotes', Object.assign(clone(q), { status: keepStatus }), 'quote'); D.dirty = false; delete drafts[q.id];
      if (!silent) UI.toast('Offre enregistrée', q.no + ' · ' + chf(BO.quoteTotals(q).ht) + ' HT', 'ok', 'check');
      return true;
    };
    const on = (sel, fn) => { const b = el.querySelector(sel); if (b) b.addEventListener('click', fn); };
    on('[data-save]', () => { if (save()) APP.refresh(); });
    on('[data-print]', () => printQuote(q));
    on('[data-dup]', () => { if (D.dirty && !save(true)) return; duplicate(q.id); });
    on('[data-send]', () => { if (D.dirty && !save(true)) return; sendQuote(q.id); });
    on('[data-follow]', () => { if (D.dirty && !save(true)) return; BO.quoteFollowUp(q.id); });
    on('[data-accept]', () => { if (D.dirty && !save(true)) return; if (!q.lines.length) { UI.toast('Offre vide', 'Ajoutez des positions avant de la marquer acceptée.', 'warn'); return; } accept(q.id); });
    on('[data-lost]', () => BO.formModal({ title: 'Offre refusée', fields: [{ k: 'reason', label: 'Motif', type: 'select', opts: ['Prix', 'Délais', 'Concurrent mieux placé', 'Projet abandonné', 'Autre'] }, { k: 'note', label: 'Commentaire', type: 'textarea', full: true, rows: 3 }], submit: 'Marquer refusée', onSubmit: v => { VX.upsert('quotes', { id: q.id, lostReason: v.reason + (v.note ? ' – ' + v.note : ''), probability: 0 }, 'quote'); VX.setQuoteStatus(q.id, 'Refusée'); delete drafts[q.id]; UI.toast('Offre classée', q.no + ' · ' + v.reason, 'warn'); } }));
    on('[data-mksite]', () => createSite(VX.S.quotes.find(x => x.id === q.id)));
  }

  function render(el, p) {
    if (p.id === 'new') { p.id = null; renderList(el); BO.newQuote(); return; }
    if (p.id && VX.S.quotes.find(x => x.id === p.id)) renderEditor(el, p); else renderList(el);
  }
  APP.register({ id: 'quotes', label: 'Offres & devis', icon: 'quote', group: 'Commercial & finance', order: 32, render, badge: () => VX.S.quotes.filter(q => /Envoy|Négo/.test(q.status) && diffDays(today(), q.validity) <= 7).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Factures & situations de travaux, relances, QR-facture (aperçu), paiements
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chf2, chfK, today, addDays, diffDays, round5 } = U;
  const st = { f: 'open', q: '', site: '', tbl: { sort: 'due', dir: 'asc' } };
  const RET = 0.05;   // retenue de garantie SIA 118

  const rest = i => Math.max(0, i.amount - (i.paid || 0));
  const late = i => i.status !== 'Payée' && i.status !== 'Brouillon' && diffDays(today(), i.due) < 0;

  /* ---------------- référence QR (27 chiffres, modulo 10 récursif) ---------------- */
  const mod10 = s => { const t = [0, 9, 4, 6, 8, 2, 7, 1, 3, 5]; let c = 0; for (const ch of s) c = t[(c + +ch) % 10]; return (10 - c) % 10; };
  BO.qrRef = i => { const base = ('41278' + (i.no || '').replace(/\D/g, '')).padStart(26, '0').slice(-26); const r = base + mod10(base); return r.replace(/^(\d{2})(\d{5})(\d{5})(\d{5})(\d{5})(\d{5})$/, '$1 $2 $3 $4 $5 $6'); };
  const qrSvg = seed => {
    const n = 33, r = U.rng(U.hash(seed)); let m = '';
    const finder = (x, y) => (x < 8 && y < 8) || (x > n - 9 && y < 8) || (x < 8 && y > n - 9);
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { if (finder(x, y)) continue; if (Math.abs(x - 16) < 4 && Math.abs(y - 16) < 4) continue; if (r() < .48) m += `M${x} ${y}h1v1h-1z`; }
    const f = (x, y) => `<rect x="${x}" y="${y}" width="7" height="7" fill="#000"/><rect x="${x + 1}" y="${y + 1}" width="5" height="5" fill="#fff"/><rect x="${x + 2}" y="${y + 2}" width="3" height="3" fill="#000"/>`;
    return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" class="qr" shape-rendering="crispEdges"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="#fff"/><path d="${m}" fill="#000"/>${f(0, 0)}${f(n - 7, 0)}${f(0, n - 7)}<rect x="13.2" y="13.2" width="6.6" height="6.6" fill="#fff"/><rect x="13.7" y="13.7" width="5.6" height="5.6" fill="#000"/><path d="M15.9 14.6h1.2v1.8h1.8v1.2h-1.8v1.8h-1.2v-1.8h-1.8v-1.2h1.8z" fill="#fff"/></svg>`;
  };
  BO.qrBill = i => {
    const co = VX.S.company, c = VX.client(i.clientId) || {}, ref = BO.qrRef(i), amt = (Math.round(rest(i) * 100) / 100).toLocaleString('fr-CH', { minimumFractionDigits: 2 }).replace(/’/g, ' ');
    const payee = `${esc(co.iban)}<br>${esc(co.name)}<br>${esc(co.address.split(',')[0])}<br>${esc((co.address.split(',')[1] || '').trim())}`;
    const payer = `${esc(c.name || '')}<br>${esc(c.contact || '')}<br>${esc(c.address || c.city || '')}`;
    return `<div class="qrbill">
      <div class="rcpt"><h5>Récépissé</h5><div class="l">Compte / Payable à</div><div class="v">${payee}</div><div class="l">Référence</div><div class="v">${ref}</div><div class="l">Payable par</div><div class="v">${payer}</div>
        <div class="amt"><div><div class="l">Monnaie</div><div class="v">CHF</div></div><div><div class="l">Montant</div><div class="v">${amt}</div></div></div><div class="acc">Point de dépôt</div></div>
      <div class="pay"><div><h5>Section paiement</h5>${qrSvg(i.no)}<div class="amt"><div><div class="l">Monnaie</div><div class="v">CHF</div></div><div><div class="l">Montant</div><div class="v">${amt}</div></div></div></div>
        <div><div class="l" style="margin-top:0">Compte / Payable à</div><div class="v">${payee}</div><div class="l">Référence</div><div class="v">${ref}</div><div class="l">Informations supplémentaires</div><div class="v">${esc(i.no)} – ${esc(i.label)}<br>Échéance ${esc(U.fmtDate(i.due, { day: '2-digit', month: '2-digit', year: 'numeric' }))}</div><div class="l">Payable par</div><div class="v">${payer}</div></div></div></div>`;
  };
  const qrModal = i => UI.modal({
    title: 'QR-facture ' + esc(i.no) + ' <span class="qr-stamp">Aperçu</span>', wide: true,
    body: `<div class="form-note warn mb">${BO.icon('qr', 17)}<div>Aperçu de la section paiement (format QR-facture suisse, 210 × 105 mm). Le code QR affiché est un motif de démonstration : il n’est <b>pas</b> scannable. En production, il est généré selon la norme SIX Swiss Payment Standards.</div></div><div style="background:#f6f7f7;padding:18px;border-radius:14px;overflow:auto">${BO.qrBill(i)}</div>`,
    foot: `<button class="btn" data-close>Fermer</button><button class="btn pri" data-pr>${BO.xi('print', 16)}Facture complète (PDF)</button>`,
    onMount: (el, close) => el.querySelector('[data-pr]').addEventListener('click', () => { close(); printInvoice(i); }),
  });
  const printInvoice = i => {
    const c = VX.client(i.clientId) || {}, s = VX.site(i.siteId), sit = i.sit;
    const ht = i.ht != null ? i.ht : i.amount / (1 + BO.tva()), tva = i.amount - ht;
    const lines = sit ? `<tr><td>Travaux exécutés cumulés (avancement ${BO.num(sit.progress * 100, 1)} % × contrat ${chf2(sit.contract)})</td><td class="n">${chf2(sit.cumul)}</td></tr><tr><td>Déjà facturé (situations précédentes)</td><td class="n">− ${chf2(sit.prev)}</td></tr><tr><td><b>Montant brut de la situation</b></td><td class="n"><b>${chf2(sit.brut)}</b></td></tr><tr><td>Retenue de garantie ${BO.num(sit.retPct * 100)} % (SIA 118 art. 150)</td><td class="n">− ${chf2(sit.retention)}</td></tr>`
      : `<tr><td>${esc(i.label)}</td><td class="n">${chf2(ht)}</td></tr>`;
    const inner = `${BO.printHeader()}<div class="addr"><b>${esc(c.name || '')}</b><br>${esc(c.contact || '')}<br>${esc(c.address || c.city || '')}</div>
      <h1>Facture ${esc(i.no)}</h1><div class="meta">${esc(i.label)}${s ? ' · chantier ' + esc(s.name) + ' (' + esc(s.code) + ')' : ''} · du ${esc(U.fmtDate(i.date, { day: 'numeric', month: 'long', year: 'numeric' }))} · payable jusqu’au ${esc(U.fmtDate(i.due, { day: 'numeric', month: 'long', year: 'numeric' }))}</div>
      <table><thead><tr><th>Désignation</th><th class="n">Montant CHF</th></tr></thead><tbody>${lines}</tbody></table>
      <table class="tot"><tr><td>Total HT</td><td class="n">${chf2(ht)}</td></tr><tr><td>TVA ${BO.tvaLbl()}</td><td class="n">${chf2(tva)}</td></tr><tr class="big"><td>Total TTC</td><td class="n">${chf2(i.amount)}</td></tr>${i.paid ? `<tr><td>Déjà payé</td><td class="n">− ${chf2(i.paid)}</td></tr><tr class="big"><td>Solde dû</td><td class="n">${chf2(rest(i))}</td></tr>` : ''}</table>
      <div class="cond">Conditions : ${esc((VX.client(i.clientId) || {}).terms || 30)} jours net. IBAN ${esc(VX.S.company.iban)} – ${esc(VX.S.company.bank)}. Merci d’utiliser la référence QR ci-dessous.</div>
      <div style="margin-top:28px;page-break-inside:avoid"><style>${qrCss()}</style>${BO.qrBill(i)}</div>`;
    BO.preview('Aperçu – facture ' + i.no, BO.printHtml('Facture ' + i.no, inner), 'Facture-' + i.no + '.html');
  };
  const qrCss = () => Array.from(document.styleSheets).flatMap(s => { try { return Array.from(s.cssRules); } catch (e) { return []; } }).map(r => r.cssText).filter(t => /\.qrbill|\.qr\b/.test(t)).join('\n');

  /* ---------------- actions ---------------- */
  BO.invoiceReminder = id => {
    const i = VX.S.invoices.find(x => x.id === id), c = VX.client(i.clientId) || {}, me = VX.emp('e6') || VX.emp(VX.S.meId);
    const lvl = (i.reminders || []).length + 1, d = diffDays(i.due, today());
    const L = lvl === 1 ? { t: '1er rappel', subj: 'Rappel amical', tone: I18N.t('Sauf erreur de notre part, la facture {no} du {date} ({label}) d’un montant de {amount} est échue depuis le {due}{late}.\n\nIl s’agit peut-être d’un simple oubli : nous vous remercions de bien vouloir procéder au règlement dans les 10 prochains jours. Si le paiement a été effectué entre-temps, merci de ne pas tenir compte de ce message.', { no: i.no, date: U.fmtDate(i.date, { day: 'numeric', month: 'long' }), label: i.label, amount: chf2(rest(i)), due: U.fmtDate(i.due, { day: 'numeric', month: 'long' }), late: d > 0 ? ' (' + I18N.t('{n} jours', { n: d }) + ')' : '' }) }
      : lvl === 2 ? { t: '2e rappel', subj: '2e rappel', tone: I18N.t('Malgré notre premier rappel, la facture {no} d’un montant de {amount} reste impayée à ce jour (échéance {due}, {days} jours de retard).\n\nNous vous prions de régler ce montant sous 10 jours. Pour toute question sur la situation de travaux, notre conductrice de travaux se tient à votre disposition.', { no: i.no, amount: chf2(rest(i)), due: U.fmtDate(i.due, { day: 'numeric', month: 'long' }), days: d }) }
      : { t: 'Mise en demeure', subj: 'Mise en demeure', tone: I18N.t('Nos rappels précédents étant restés sans effet, nous vous mettons en demeure de régler la facture {no} d’un montant de {amount} dans un délai de 10 jours.\n\nÀ défaut, nous nous verrons contraints d’entamer une procédure de recouvrement et de faire valoir notre droit à l’inscription d’une hypothèque légale des artisans et entrepreneurs (art. 837 CC), ainsi que des intérêts moratoires de 5 %.', { no: i.no, amount: chf2(rest(i)) }) };
    BO.compose({
      title: L.t + ' – ' + i.no, to: c.email, subject: I18N.t('{subj} – facture {no} – {company}', { subj: I18N.t(L.subj), no: i.no, company: VX.S.company.name }),
      note: `Niveau de relance proposé : <b>${L.t}</b> (${(i.reminders || []).length} relance${(i.reminders || []).length > 1 ? 's' : ''} déjà envoyée${(i.reminders || []).length > 1 ? 's' : ''}). La QR-facture est jointe.`,
      body: I18N.t('Madame, Monsieur,\n\n{tone}\n\nRéférence de paiement : {ref}\nIBAN : {iban}\n\nAvec nos salutations distinguées,\n\n{sign}', {
        tone: L.tone, ref: BO.qrRef(i), iban: VX.S.company.iban, sign: `${me.name}\n${me.title || I18N.t('Comptabilité')}\n${VX.S.company.name} · ${VX.S.company.phone}` }),
      okLabel: 'Envoyer la relance',
      onSend: m => { VX.upsert('invoices', { id: i.id, reminders: (i.reminders || []).concat([{ date: today(), level: lvl, label: L.t, channel: m.channel }]) }, 'invoice'); VX.log(L.t + ' envoyé : ' + i.no + ' (' + (c.name || '') + ')', 'invoice', i.siteId); VX.save(); UI.toast(L.t + ' envoyé', i.no + ' · ' + chf(rest(i)), 'ok', 'send'); },
    });
  };
  BO.payForm = id => {
    const i = VX.S.invoices.find(x => x.id === id);
    if (!rest(i)) { UI.toast('Déjà payée', i.no + ' est soldée.', 'info'); return; }
    BO.formModal({
      title: 'Enregistrer un paiement – ' + i.no,
      intro: `<div class="row"><div style="flex:1"><b>${esc(BO.clientName(i.clientId))}</b><div class="sm-t muted">${esc(i.label)}</div></div><div style="text-align:right"><div class="xs-t muted">Reste dû</div><b style="font-size:18px">${chf2(rest(i))}</b></div></div>`,
      fields: [
        { k: 'amount', label: 'Montant reçu (CHF)', type: 'number', min: 0.05, max: Math.round(rest(i) * 100) / 100, step: 0.05, req: true },
        { k: 'date', label: 'Date de valeur', type: 'date', req: true },
        { k: 'method', label: 'Mode', type: 'select', opts: ['Virement QR (camt.054)', 'Virement e-banking', 'Compensation', 'Autre'] },
        { k: 'note', label: 'Remarque', ph: 'ex. paiement partiel, retenue contestée…' },
      ],
      values: { amount: Math.round(rest(i) * 100) / 100, date: today(), method: 'Virement QR (camt.054)' },
      submit: 'Enregistrer le paiement',
      onSubmit: v => {
        VX.payInvoice(i.id, v.amount);
        const ii = VX.S.invoices.find(x => x.id === id); ii.payments = (ii.payments || []).concat([{ date: v.date, amount: v.amount, method: v.method, note: v.note }]); VX.save();
        UI.toast(ii.status === 'Payée' ? 'Facture soldée 🎉' : 'Paiement partiel enregistré', i.no + ' · ' + chf2(v.amount), 'ok', 'coins');
      },
    });
  };
  const sitNo = siteId => { const ns = VX.S.invoices.filter(x => x.siteId === siteId).map(x => +((/Situation n°\s*(\d+)/.exec(x.label) || [])[1] || 0)); return Math.max(0, ...ns) + 1; };
  const calcSit = (s, progress) => {
    const f = BO.siteFin(s.id), contract = f.contract;
    const cumul = progress * contract, prev = f.billed, brut = Math.max(0, cumul - prev), retention = brut * RET, net = brut - retention;
    const tva = net * BO.tva(), ttc = round5(net + tva);
    return { contract, progress, cumul, prev, brut, retPct: RET, retention, net, tva, ttc };
  };
  BO.newSituation = siteId => {
    const sites = BO.activeSites(); if (!sites.length) return;
    const s0 = VX.site(siteId) || sites[0];
    BO.formModal({
      title: 'Nouvelle situation de travaux',
      fields: [
        { k: 'siteId', label: 'Chantier', type: 'select', opts: sites.map(s => [s.id, s.name]), req: true },
        { k: 'progress', label: 'Avancement cumulé (%)', type: 'number', min: 0, max: 100, step: .5, req: true, help: 'Selon métré / constat avec la direction des travaux' },
        { k: 'label', label: 'Libellé', req: true, full: true },
        { k: 'date', label: 'Date de facture', type: 'date', req: true },
        { k: 'due', label: 'Échéance', type: 'date', req: true, validate: (v, a) => v < a.date ? 'Après la date de facture' : '' },
        { k: 'html', type: 'html', full: true, html: '<div data-calc></div>' },
      ],
      values: { siteId: s0.id, progress: Math.round(s0.progress * 1000) / 10, label: `Situation n° ${sitNo(s0.id)} – ${s0.phase}`, date: today(), due: addDays(today(), (VX.client(s0.clientId) || {}).terms || 30) },
      submit: 'Émettre la situation',
      onMount: el => {
        const q = n => el.querySelector(`[name=${n}]`);
        const draw = () => {
          const s = VX.site(q('siteId').value), c = calcSit(s, (+q('progress').value || 0) / 100);
          el.querySelector('[data-calc]').innerHTML = `<div class="card pad" style="box-shadow:inset 0 0 0 1px var(--line2)"><dl class="qe-tot"><dt>Travaux exécutés cumulés (${BO.num(c.progress * 100, 1)} % × ${chf(c.contract)})</dt><dd>${chf2(c.cumul)}</dd><dt>Déjà facturé HT</dt><dd>− ${chf2(c.prev)}</dd><dt class="b" style="color:var(--ink)">Montant brut de la situation</dt><dd class="b">${chf2(c.brut)}</dd><dt>Retenue de garantie 5 %</dt><dd>− ${chf2(c.retention)}</dd><dt>Net HT</dt><dd>${chf2(c.net)}</dd><dt>TVA ${BO.tvaLbl()}</dt><dd>${chf2(c.tva)}</dd><dt class="b" style="color:var(--ink)">À payer TTC (arrondi 5 ct)</dt><dd class="big">${chf2(c.ttc)}</dd></dl>${c.brut <= 0 ? `<div class="form-note warn mt">${BO.icon('alert', 16)}<div>L’avancement saisi ne dépasse pas le montant déjà facturé : rien à facturer.</div></div>` : ''}</div>`;
        };
        q('siteId').addEventListener('change', () => { const s = VX.site(q('siteId').value); q('progress').value = Math.round(s.progress * 1000) / 10; q('label').value = `Situation n° ${sitNo(s.id)} – ${s.phase}`; q('due').value = addDays(q('date').value || today(), (VX.client(s.clientId) || {}).terms || 30); draw(); });
        q('progress').addEventListener('input', draw); draw();
      },
      onSubmit: v => {
        const s = VX.site(v.siteId), c = calcSit(s, v.progress / 100);
        if (c.brut <= 0) { UI.toast('Rien à facturer', 'Augmentez l’avancement ou vérifiez le déjà facturé.', 'warn'); return false; }
        const inv = { id: U.uid('i'), no: BO.nextNo('invoices', 'FA', 4), siteId: s.id, clientId: s.clientId, label: v.label, date: v.date, due: v.due, amount: c.ttc, ht: Math.round(c.net * 100) / 100, status: 'Envoyée', paid: 0, reminders: [], kind: 'situation', sit: c };
        VX.upsert('invoices', inv, 'invoice');
        if (v.progress / 100 > s.progress) VX.upsert('sites', { id: s.id, progress: v.progress / 100 }, 'site');
        VX.log(v.label + ' émise – ' + s.name + ' (' + chf(c.ttc) + ')', 'invoice', s.id); VX.save();
        UI.toast('Situation émise', inv.no + ' · ' + chf2(c.ttc) + ' TTC', 'ok', 'invoice');
        setTimeout(() => qrModal(inv), 300);
      },
    });
  };
  const freeInvoice = () => BO.formModal({
    title: 'Nouvelle facture',
    fields: [
      { k: 'clientId', label: 'Client', type: 'select', opts: BO.optClients(), req: true, empty: '— choisir —' },
      { k: 'siteId', label: 'Chantier (facultatif)', type: 'select', opts: BO.optSites(false), empty: '— aucun —' },
      { k: 'label', label: 'Libellé', req: true, full: true, ph: 'ex. Travaux en régie septembre' },
      { k: 'ht', label: 'Montant HT (CHF)', type: 'number', min: 0.05, step: 0.05, req: true },
      { k: 'date', label: 'Date', type: 'date', req: true }, { k: 'due', label: 'Échéance', type: 'date', req: true },
      { k: 'html', type: 'html', full: true, html: '<div data-calc class="note-box"></div>' },
    ],
    values: { date: today(), due: addDays(today(), 30) },
    onMount: el => { const h = el.querySelector('[name=ht]'), d = el.querySelector('[data-calc]'), sel = el.querySelector('[name=siteId]'), cl = el.querySelector('[name=clientId]'); const draw = () => { const v = +h.value || 0; d.innerHTML = `HT ${chf2(v)} + TVA ${BO.tvaLbl()} ${chf2(v * BO.tva())} = <b>${chf2(round5(v * (1 + BO.tva())))}</b> TTC (arrondi 5 ct)`; }; h.addEventListener('input', draw); draw(); sel.addEventListener('change', () => { const s = VX.site(sel.value); if (s && s.clientId) cl.value = s.clientId; }); },
    onSubmit: v => { const inv = { id: U.uid('i'), no: BO.nextNo('invoices', 'FA', 4), clientId: v.clientId, siteId: v.siteId || null, label: v.label, date: v.date, due: v.due, ht: v.ht, amount: round5(v.ht * (1 + BO.tva())), status: 'Envoyée', paid: 0, reminders: [] }; VX.upsert('invoices', inv, 'invoice'); VX.log('Facture ' + inv.no + ' émise – ' + BO.clientName(v.clientId), 'invoice', inv.siteId); VX.save(); UI.toast('Facture émise', inv.no + ' · ' + chf2(inv.amount), 'ok', 'invoice'); },
  });

  /* ---------------- tiroir facture ---------------- */
  const invDrawer = id => BO.drawer({
    title: () => { const i = VX.S.invoices.find(x => x.id === id); return i ? esc(i.no) : null; },
    sub: () => { const i = VX.S.invoices.find(x => x.id === id); return `${UI.statusChip(i.status)} <span>${esc(BO.clientName(i.clientId))}</span>`; },
    render: () => {
      const i = VX.S.invoices.find(x => x.id === id), s = VX.site(i.siteId), sit = i.sit;
      return `<div class="dsec"><div class="g g3" style="gap:10px">${[['Montant TTC', chf2(i.amount)], ['Payé', chf2(i.paid || 0)], ['Reste dû', chf2(rest(i))]].map(([l, v], k) => `<div class="card pad" style="box-shadow:inset 0 0 0 1px var(--line);padding:11px 13px"><div class="xs-t muted b">${l}</div><div style="font-size:17px;font-weight:900" class="${k === 2 && late(i) ? 'bad-t' : ''}">${v}</div></div>`).join('')}</div>${i.amount ? `<div class="mt">${BO.prog((i.paid || 0) / i.amount)}</div>` : ''}</div>

        <div class="dsec"><h4>Paiements</h4>${(i.payments || []).length ? `<div class="mini-list">${i.payments.map(p => `<div>${UI.icon('coins', 16)}<div style="flex:1"><b class="sm-t">${chf2(p.amount)}</b><div class="xs-t muted">${BO.date(p.date)} · ${esc(p.method)}${p.note ? ' · ' + esc(p.note) : ''}</div></div></div>`).join('')}</div>` : i.paid ? `<div class="muted sm-t">${chf2(i.paid)} reçus (import bancaire).</div>` : '<div class="muted sm-t">Aucun paiement reçu.</div>'}</div>`;

    onMount: d => {
      const i = VX.S.invoices.find(x => x.id === id); if (!i) return;

    },
  });

  function render(el, p) {
    const S = VX.S, t0 = today(), y = String(new Date().getFullYear());
    if (p.id && S.invoices.find(i => i.id === p.id)) { const id = p.id; p.id = null; setTimeout(() => invDrawer(id), 30); }
    const all = S.invoices;
    let rows = all.slice();
    if (st.f === 'open') rows = rows.filter(i => rest(i) > 0);
    if (st.f === 'late') rows = rows.filter(late);
    if (st.f === 'paid') rows = rows.filter(i => i.status === 'Payée');
    if (st.f === 'sit') rows = rows.filter(i => /Situation/i.test(i.label));
    if (st.site) rows = rows.filter(i => i.siteId === st.site);
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(i => (i.no + ' ' + i.label + ' ' + BO.clientName(i.clientId)).toLowerCase().includes(q)); }
    const issued = all.filter(i => i.date.startsWith(y)).reduce((a, i) => a + i.amount, 0), cashed = all.reduce((a, i) => a + (i.paid || 0), 0);
    const open = all.reduce((a, i) => a + rest(i), 0), lateL = all.filter(late), lateAmt = lateL.reduce((a, i) => a + rest(i), 0);
    const paidL = all.filter(i => i.status === 'Payée'), dso = paidL.length ? Math.round(paidL.reduce((a, i) => a + Math.max(10, diffDays(i.date, i.due) - 3), 0) / paidL.length) : 30;

        ${BO.kpi({ lb: 'En retard', v: chfK(lateAmt), s: `${lateL.length} facture${lateL.length > 1 ? 's' : ''} échue${lateL.length > 1 ? 's' : ''}`, icon: 'alert', cls: lateL.length ? 'red' : 'green' })}
        ${BO.kpi({ lb: 'Délai moyen d’encaissement', v: dso + '<small>jours</small>', s: 'factures soldées', icon: 'calendar' })}
      </div>
      ${toBill.length ? `<div class="card pad mb"><div class="row wrap"><b>${BO.icon('sparkles', 16)} Travaux exécutés non facturés :</b>${toBill.map(([s, f]) => `<button class="btn sm" data-sitsite="${s.id}"><i class="dot-s" style="background:${s.color}"></i>${esc(s.code)} · ${chfK(f.toBill)}</button>`).join('')}<span class="muted sm-t">→ préparer la situation en 1 clic</span></div></div>` : ''}
      <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="N°, libellé, client…" value="${esc(st.q)}">${UI.icon('search')}</div>
        ${BO.seg('f', [['open', 'À encaisser', all.filter(i => rest(i) > 0).length], ['late', 'En retard', lateL.length], ['sit', 'Situations'], ['paid', 'Payées'], ['all', 'Toutes', all.length]], st.f)}
        <select class="inp" data-site>${BO.opts(BO.optSites(false), st.site, 'Tous les chantiers')}</select></div>
      <div data-t></div></div>`;
    BO.table(el.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: i => invDrawer(i.id), rowCls: i => late(i) ? '' : '',
      empty: BO.empty('invoice', 'Aucune facture', st.f === 'late' ? 'Aucun retard de paiement 👏' : 'Modifiez les filtres.', '', true),
      cols: [
        { k: 'no', label: 'N°', render: i => `<span class="code b">${esc(i.no)}</span>` },
        { k: 'label', label: 'Client / objet', get: i => BO.clientName(i.clientId), render: i => `<div class="t1">${esc(BO.clientName(i.clientId))}</div><div class="t2">${esc(i.label)}${i.siteId ? ' · ' + esc((VX.site(i.siteId) || {}).code || '') : ''}</div>` },
        { k: 'date', label: 'Date', render: i => BO.dateS(i.date) },
        { k: 'due', label: 'Échéance', render: i => late(i) ? `<b class="bad-t">${BO.dateS(i.due)}</b><div class="t2 bad-t">+${diffDays(i.due, t0)} j</div>` : BO.dateS(i.due) },
        { k: 'amount', label: 'TTC', num: true, render: i => chf(i.amount) },
        { k: 'rest', label: 'Reste dû', num: true, get: rest, render: i => rest(i) ? `<b>${chf(rest(i))}</b>` : '<span class="muted">—</span>' },
        { k: 'status', label: 'Statut', render: i => UI.statusChip(late(i) ? 'En retard' : i.status) + ((i.reminders || []).length ? ` <span class="tag" title="Relances">${UI.icon('mail', 12)}&nbsp;${i.reminders.length}</span>` : '') },
        { k: 'a', label: '', nosort: true, render: i => `<div class="row" style="gap:4px;justify-content:flex-end"><button class="icon-btn" title="QR-facture" data-qr="${i.id}">${BO.xi('qr', 16)}</button>${late(i) ? `<button class="btn sm" data-rem="${i.id}">Relancer</button>` : ''}${rest(i) ? `<button class="btn sm" data-pay="${i.id}">Paiement</button>` : ''}</div>` },
      ],
      foot: r => `<td colspan="4">${r.length} factures</td><td class="num">${chf(r.reduce((a, i) => a + i.amount, 0))}</td><td class="num">${chf(r.reduce((a, i) => a + rest(i), 0))}</td><td colspan="2"></td>`,
      after: h => { h.querySelectorAll('[data-qr]').forEach(b => b.onclick = () => qrModal(VX.S.invoices.find(x => x.id === b.dataset.qr))); h.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => BO.invoiceReminder(b.dataset.rem)); h.querySelectorAll('[data-pay]').forEach(b => b.onclick = () => BO.payForm(b.dataset.pay)); },
    });
    BO.bindSearch(el, v => st.q = v);
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-site]').addEventListener('change', e => { st.site = e.target.value; APP.refresh(); });
    el.querySelector('[data-sit]').addEventListener('click', () => BO.newSituation(st.site));
    el.querySelector('[data-free]').addEventListener('click', freeInvoice);
    el.querySelectorAll('[data-sitsite]').forEach(b => b.addEventListener('click', () => BO.newSituation(b.dataset.sitsite)));
    el.querySelector('[data-csv]').addEventListener('click', () => { BO.download('factures-vanteo-' + t0 + '.csv', BO.csv([['N°', 'Client', 'Chantier', 'Libellé', 'Date', 'Échéance', 'HT', 'TTC', 'Payé', 'Reste', 'Statut']].concat(rows.map(i => [i.no, BO.clientName(i.clientId), i.siteId ? BO.siteName(i.siteId) : '', i.label, i.date, i.due, (Math.round(i.ht * 100) / 100).toFixed(2), i.amount.toFixed(2), (i.paid || 0).toFixed(2), rest(i).toFixed(2), late(i) ? 'En retard' : i.status]))), 'text/csv;charset=utf-8'); UI.toast('Export prêt', rows.length + ' factures', 'ok', 'download'); });
  }
  APP.register({ id: 'invoices', label: 'Factures & situations', icon: 'invoice', group: 'Commercial & finance', order: 33, render, badge: () => VX.S.invoices.filter(late).length });
})();

<script>
/* ==========================================================================
   BO · Achats & livraisons : commandes, fournisseurs / sous-traitants, relances
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chf2, chfK, today, addDays, diffDays } = U;
  const st = { tab: 'orders', f: 'open', q: '', site: '', tbl: { sort: 'delivery', dir: 'asc' } };
  const OSTATUS = ['Demandée', 'Confirmée', 'En fabrication', 'En retard', 'Livrée', 'Annulée'];
  const isLate = o => o.status === 'En retard' || (o.status !== 'Livrée' && o.status !== 'Annulée' && o.delivery < today());

  BO.supplierReminder = id => {
    const o = VX.S.orders.find(x => x.id === id), f = VX.supplier(o.supplierId) || {}, s = VX.site(o.siteId) || {}, chef = VX.emp(s.foremanId), me = VX.emp('e7') || VX.emp(VX.S.meId);
    const today0 = o.delivery === today();
    BO.compose({
      title: 'Relancer ' + (f.name || 'le fournisseur'), to: f.email || f.phone, channel: today0 ? 'Téléphone (script)' : 'E-mail',
      subject: I18N.t('Commande {no} – {what} – chantier {site}', { no: o.no, what: I18N.t(today0 ? 'livraison attendue ce matin' : 'confirmation de livraison'), site: s.name || '' }),
      note: today0 ? `Livraison prévue aujourd’hui à ${esc(o.slot)}${o.delayMin ? ` : retard de <b>${o.delayMin} min</b>` : ''}. L’équipe attend sur place — un appel est souvent plus rapide.` : 'Message pré-rédigé à partir de la commande.',
      body: I18N.t('Bonjour,\n\n{text}\n\nContact sur place : {contact}\n\nMerci et meilleures salutations,\n{sign}', {
        text: today0
          ? I18N.t('Notre commande {no} ({label}) était annoncée ce matin à {slot} sur le chantier {site} à {city}. Elle n’est pas arrivée{late} et l’équipe de {chef} est en attente.\n\nPouvez-vous nous confirmer au plus vite l’heure d’arrivée du camion ?', { no: o.no, label: o.label, slot: o.slot, site: s.name, city: s.city, late: o.delayMin ? ' (' + I18N.t('{n} min de retard', { n: o.delayMin }) + ')' : '', chef: chef ? chef.name : I18N.t('notre chef de chantier') })
          : I18N.t('Nous souhaitons confirmer la livraison de notre commande {no} ({label}) prévue le {date}{at} sur le chantier {site} ({city}).\n\nMerci de nous confirmer la date et le créneau.', { no: o.no, label: o.label, date: U.fmtDate(o.delivery, { day: 'numeric', month: 'long' }), at: o.slot && o.slot !== '—' ? ' ' + I18N.t('à {time}', { time: o.slot }) : '', site: s.name, city: s.city }),
        contact: chef ? chef.name + ' – ' + chef.phone : VX.S.company.phone, sign: `${me.name}\n${VX.S.company.name}` }),
      okLabel: 'Relance effectuée',
      onSend: () => { VX.upsert('orders', { id: o.id, reminded: today(), reminders: (o.reminders || 0) + 1 }, 'orders'); VX.log('Relance fournisseur : ' + (f.name || '') + ' – ' + o.no, 'delivery', o.siteId); VX.save(); UI.toast('Relance enregistrée', (f.name || '') + ' · ' + o.no, 'ok', 'send'); },
    });
  };
  BO.receiveOrder = id => {
    const o = VX.S.orders.find(x => x.id === id), s = VX.site(o.siteId);
    if (o.status === 'Livrée') return;
    BO.confirm('Réceptionner la livraison ?', `<b>${esc(o.label)}</b> – ${esc((VX.supplier(o.supplierId) || {}).name || '')}<br>Le montant de ${chf(o.amount)} est ajouté aux coûts engagés de <b>${esc(s ? s.name : '')}</b>.`, 'Livraison reçue', () => {
      VX.upsert('orders', { id: o.id, status: 'Livrée', delayMin: 0, received: today() }, 'delivery');
      if (s && s.id !== 'hq') s.spent += o.amount;
      VX.log('Livraison réceptionnée : ' + o.label + (s ? ' (' + s.name + ')' : ''), 'delivery', o.siteId); VX.save(); VX.emit('site', { id: o.siteId });
      UI.toast('Livraison réceptionnée', o.label, 'ok', 'truck');
    });
  };
  const lineRow = (l = {}) => `<tr><td><input class="inp sm" data-l="label" value="${esc(l.label || '')}" placeholder="Article"></td><td style="width:90px"><input class="inp sm" type="number" step="any" min="0" data-l="qty" value="${l.qty ?? 1}"></td><td style="width:90px"><select class="inp sm" data-l="unit">${BO.opts(['m³', 'm²', 'ml', 't', 'kg', 'pce', 'forfait', 'j', 'sem.'], l.unit || 'pce')}</select></td><td style="width:110px"><input class="inp sm" type="number" step="any" min="0" data-l="price" value="${l.price ?? 0}"></td><td style="width:110px" class="num b" data-lt>${chf(+(l.qty ?? 1) * +(l.price ?? 0))}</td><td style="width:36px"><button class="icon-btn" data-rm type="button">${UI.icon('x', 14)}</button></td></tr>`;
  BO.orderForm = (id, pre = {}) => {
    const o = id ? VX.S.orders.find(x => x.id === id) : null;
    BO.formModal({
      title: o ? 'Commande ' + o.no : 'Nouvelle commande', wide: true,
      fields: [
        { k: 'supplierId', label: 'Fournisseur / sous-traitant', type: 'select', opts: BO.optSuppliers(), req: true, empty: '— choisir —' },
        { k: 'siteId', label: 'Chantier de livraison', type: 'select', opts: BO.optSites(true), req: true },
        { k: 'label', label: 'Objet', req: true, ph: 'ex. Béton C30/37 – 40 m³' },
        { k: 'delivery', label: 'Date de livraison', type: 'date', req: true },
        { k: 'slot', label: 'Créneau', type: 'select', opts: ['—', '06:30', '07:00', '07:15', '07:30', '08:00', '09:00', '10:30', '13:30', '15:00'] },
        { k: 'status', label: 'Statut', type: 'select', opts: OSTATUS },
        { k: 'html', type: 'html', full: true, html: `<div class="field"><label>Positions</label><div class="tbl-wrap" style="box-shadow:inset 0 0 0 1px var(--line)"><table class="tbl compact"><thead><tr><th>Article</th><th>Qté</th><th>Unité</th><th>Prix unit.</th><th class="num">Total</th><th></th></tr></thead><tbody data-lines>${((o && o.lines) || [{ label: '', qty: 1, unit: 'pce', price: 0 }]).map(lineRow).join('')}</tbody><tfoot><tr><td colspan="4"><button class="btn sm" type="button" data-addl>${UI.icon('plus', 13)}Ligne</button></td><td class="num" data-sum></td><td></td></tr></tfoot></table></div></div>` },
        { k: 'notes', label: 'Remarques pour le fournisseur', type: 'textarea', full: true, rows: 2, ph: 'ex. accès par la rue du Lac, grue disponible dès 7h' },
      ],
      values: o || Object.assign({ delivery: addDays(today(), 3), slot: '07:30', status: 'Demandée', siteId: BO.activeSites()[0].id }, pre),
      submit: o ? 'Enregistrer' : 'Passer la commande',
      danger: o ? { label: 'Supprimer', title: 'Supprimer la commande ?', text: 'La commande ' + esc(o.no) + ' sera supprimée.', run: () => { VX.remove('orders', o.id, 'orders'); UI.toast('Commande supprimée', o.no, 'ok'); } } : null,
      onMount: el => {
        const tb = el.querySelector('[data-lines]');
        const sum = () => { let t = 0; tb.querySelectorAll('tr').forEach(tr => { const v = (+tr.querySelector('[data-l=qty]').value || 0) * (+tr.querySelector('[data-l=price]').value || 0); t += v; tr.querySelector('[data-lt]').textContent = chf(v); }); el.querySelector('[data-sum]').textContent = chf(t); };
        tb.addEventListener('input', sum); tb.addEventListener('click', e => { if (e.target.closest('[data-rm]') && tb.children.length > 1) { e.target.closest('tr').remove(); sum(); } });
        el.querySelector('[data-addl]').addEventListener('click', () => { tb.insertAdjacentHTML('beforeend', lineRow()); sum(); });
        sum();
      },
      onSubmit: (v, close, el) => {
        const lines = Array.from(el.querySelectorAll('[data-lines] tr')).map(tr => ({ label: tr.querySelector('[data-l=label]').value.trim(), qty: +tr.querySelector('[data-l=qty]').value || 0, unit: tr.querySelector('[data-l=unit]').value, price: +tr.querySelector('[data-l=price]').value || 0 })).filter(l => l.label);
        if (!lines.length) { UI.toast('Positions manquantes', 'Ajoutez au moins un article.', 'warn'); return false; }

        if (amount <= 0) { UI.toast('Montant nul', 'Renseignez les prix unitaires.', 'warn'); return false; }
        delete v.html;
        const ord = Object.assign({ id: o ? o.id : U.uid('o'), no: o ? o.no : BO.nextNo('orders', 'CMD', 3), date: o ? o.date : today() }, v, { lines, amount: Math.round(amount * 100) / 100 });
        VX.upsert('orders', ord, o ? 'orders' : 'order:new');
        if (!o) { VX.log('Commande ' + ord.no + ' passée – ' + ord.label + ' (' + (VX.supplier(ord.supplierId) || {}).name + ')', 'delivery', ord.siteId); VX.save(); }
        UI.toast(o ? 'Commande mise à jour' : 'Commande passée', ord.no + ' · ' + chf(ord.amount), 'ok', 'truck');
      },
    });

  const supplierForm = id => {

      title: f ? f.name : 'Nouveau fournisseur / sous-traitant',
