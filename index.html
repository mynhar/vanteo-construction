      return out;
    });
    def('maintenance', () => [
      { id: U.uid('mt'), eqId: 'm1', date: addDays(today(), -84), type: 'Contrôle périodique SUVA', note: 'Contrôle câbles et limiteurs – conforme', cost: 1850, by: 'Liebherr Service' },
      { id: U.uid('mt'), eqId: 'm3', date: addDays(today(), -190), type: 'Service 500 h', note: 'Vidange, filtres, graissage', cost: 1240, by: 'Atelier Vanteo' },
      { id: U.uid('mt'), eqId: 'm4', date: addDays(today(), -58), type: 'Service 500 h', note: 'Remplacement flexible hydraulique bras', cost: 2310, by: 'Avesco' },
      { id: U.uid('mt'), eqId: 'm2', date: addDays(today(), -178), type: 'Expertise annuelle', note: 'Expertise grue mobile – OK', cost: 3400, by: 'Liebherr Service' },
      { id: U.uid('mt'), eqId: 'm9', date: addDays(today(), -110), type: 'Service 30 000 km', note: 'Freins AV + pneus', cost: 4120, by: 'Mercedes Trucks Crissier' },
    ]);
    S.sites.forEach(s => {
      if (s.id === 'hq') return;
      if (s.contract == null) { s.contract = Math.round(s.budget * 1.12 / 1000) * 1000; dirty = true; }
      if (!s.cfc) { s.cfc = BO.cfcBreakdown(s); dirty = true; }
      if (s.billedHist == null) {
        const inv = S.invoices.filter(i => i.siteId === s.id).reduce((a, i) => a + (i.ht != null ? i.ht : i.amount / (1 + VX.TVA)), 0);
        s.billedHist = Math.max(0, Math.round(s.progress * s.contract * .9 - inv)); dirty = true;
      }
    });
    S.invoices.forEach(i => {
      if (i.ht == null) { i.ht = Math.round(i.amount / (1 + VX.TVA) * 100) / 100; dirty = true; }
      if (!i.reminders) { i.reminders = []; dirty = true; }
      if (i.status === 'Envoyée' && diffDays(today(), i.due) < 0) { i.status = 'En retard'; dirty = true; }
    });
    S.clients.forEach(c => { if (!c.notes) { c.notes = c.id === 'c1' ? [{ at: Date.now() - 3 * 864e5, by: 'e2', text: 'Séance de coordination mensuelle avec le comité : satisfaits de l’avancement, attente sur le choix des carrelages.' }] : c.id === 'c3' ? [{ at: Date.now() - 6 * 864e5, by: 'e2', text: 'M. Bonvin souhaite avancer la réception de la piscine. Vérifier faisabilité avec Anne-Laure.' }] : []; dirty = true; } });
    S.suppliers.forEach(f => {
      if (!f.kind) { f.kind = /sous-traitant/i.test(f.cat) ? 'Sous-traitant' : 'Fournisseur'; dirty = true; }
      if (!f.email) { f.email = 'commandes@' + f.name.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z]+/g, '').slice(0, 14) + '.ch'; dirty = true; }
    });
    S.orders.forEach(o => { if (!o.lines) { o.lines = [{ label: o.label, qty: 1, unit: 'forfait', price: o.amount }]; dirty = true; } });
    S.equipment.forEach(m => { if (!m.log) { m.log = []; dirty = true; } });
    // semaine précédente de pointages (validée) pour avoir de l'historique
    if (!S.ext.tsPrev) {
      const ws = addDays(U.weekStart(today()), -7);
      S.employees.forEach(e => {
        const r = U.rng(U.hash(e.id + 'prev'));
        for (let d = 0; d < 5; d++) {
          const date = addDays(ws, d); if (S.timesheets.some(t => t.empId === e.id && t.date === date)) continue;
          if (e.status === 'absent' && d >= 3) continue;
          const h = Math.round((8 + r() * 1.6) * 4) / 4;
          S.timesheets.push({ id: U.uid('h'), empId: e.id, date, hours: h, siteId: e.homeSiteId, taskId: e.taskId, validated: true });
        }
      });
      S.ext.tsPrev = true; dirty = true;
    }
    if (dirty) VX.save();
  }
  BO.ensure = ensure;
  ensure();
  VX.on('reset', ensure);

  /* ---------- indicateurs financiers d'un chantier ---------- */
  BO.siteFin = id => {
    const s = VX.site(id), S = VX.S;
    const inv = S.invoices.filter(i => i.siteId === id);
    const invHT = inv.reduce((a, i) => a + (i.ht || 0), 0);
    const billed = (s.billedHist || 0) + invHT;
    const paid = inv.reduce((a, i) => a + (i.paid || 0), 0);
    const openOrders = S.orders.filter(o => o.siteId === id && o.status !== 'Livrée' && o.status !== 'Annulée').reduce((a, o) => a + o.amount, 0);
    const committed = s.spent + openOrders;
    const eac = s.progress > 0.02 ? s.spent / s.progress : s.budget;           // coût final estimé
    const contract = s.contract || s.budget;
    const margin = contract ? (contract - eac) / contract : 0;
    const earned = s.progress * contract;
    const elapsed = s.start && s.end ? Math.max(0, Math.min(1, diffDays(s.start, today()) / Math.max(1, diffDays(s.start, s.end)))) : 0;
    const cv = s.budget ? (s.budget * s.progress - s.spent) : 0;               // écart de coût (CHF)
    return { inv, invHT, billed, paid, openOrders, committed, eac, contract, margin, earned, toBill: Math.max(0, earned - billed), elapsed, cv, schedule: s.progress - elapsed };
  };

  /* ==========================================================================
     SYNCHRONISATION LIVE
     ========================================================================== */
  let pend = false, timer = null, last = 0, drawerCur = null;
  BO.dragging = false;
  BO.busy = () => {
    if (document.querySelector('.modal-bg') || BO.dragging) return true;
    const a = document.activeElement;
    return !!(a && a.closest && a.closest('#bo-content, .bo-drawer') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && a.type !== 'checkbox' && a.type !== 'file');
  };
  function tick() {
    if (!pend) return;
    if (APP.mode !== 'bo') { pend = false; return; }
    if (BO.busy()) { timer = setTimeout(tick, 700); return; }
    const gap = Date.now() - last; if (gap < 900) { timer = setTimeout(tick, 900 - gap); return; }
    pend = false; last = Date.now();
    const host = document.getElementById('bo-content'); if (host) host.classList.add('live');   // pas d'animation d'entrée sur un rafraîchissement
    BO.refreshing = true;
    try { APP.refresh(); if (drawerCur) drawerCur.rerender(); } finally { BO.refreshing = false; }
  }
  BO.schedule = (ms = 250) => { pend = true; clearTimeout(timer); timer = setTimeout(tick, ms); };
  VX.on('change', () => BO.schedule());
  BO.now = () => { pend = true; last = 0; clearTimeout(timer); tick(); };   // rafraîchit tout de suite
  APP.onMode(m => { if (m !== 'bo') BO.closeDrawer(); });

  /* ==========================================================================
     NAVIGATION DÉLÉGUÉE (data-*)
     ========================================================================== */
  BO.toMap = (type, id) => {
    BO.closeDrawer();
    if (!APP.focusHandlers.length) { APP.setMode('map'); UI.toast('Carte', 'La carte 3D se charge…', 'info', 'map'); return; }
    APP.setMode('map'); setTimeout(() => APP.focus({ type, id }), 80);
  };
  document.addEventListener('click', e => {
    const host = document.getElementById('bo-content');
    if (host) host.classList.toggle('live', !e.target.closest('.bo-nav a, [data-open], .crumb a, .kcard, tr.cl, .site-card, .kpi.click'));   // animation seulement en navigation
    const m = e.target.closest('[data-map]');
    if (m) { e.preventDefault(); e.stopPropagation(); const [t, id] = m.dataset.map.split(':'); BO.toMap(t, id); return; }
    const em = e.target.closest('[data-open-emp]');
    if (em) { e.preventDefault(); e.stopPropagation(); BO.empDrawer && BO.empDrawer(em.dataset.openEmp); return; }
    const tk = e.target.closest('[data-open-task]');
    if (tk) { e.preventDefault(); e.stopPropagation(); BO.taskDrawer(tk.dataset.openTask); return; }
    const o = e.target.closest('[data-open]');
    if (o) { e.preventDefault(); e.stopPropagation(); const [mod, id, tab] = o.dataset.open.split(':'); BO.closeDrawer(); APP.open(mod, id ? { id, tab } : {}); return; }
  }, true);

  /** champ de recherche [data-q] avec rafraîchissement débouncé et focus conservé */
  BO.bindSearch = (el, cb) => {
    const q = el.querySelector('[data-q]'); if (!q) return; let tm;
    q.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { cb(q.value); APP.refresh(); const n = BO.$('#bo-content [data-q]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 260); });
  };
  /** branche les segments / onglets d'une page : cb(name, value) */
  BO.bindSeg = (el, cb) => el.querySelectorAll('[data-seg]').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) cb(g.dataset.seg, b.dataset.v); }));
  BO.bindTabs = (el, cb) => el.querySelectorAll('.tabs').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button[data-tab]'); if (b) cb(b.dataset.tab); }));

  /* ==========================================================================
     TABLEAU TRIABLE
     cfg: { cols:[{k,label,get(r)→valeur de tri,render(r)→html,num,w,nosort}], rows, state:{sort,dir}, onRow(r), empty, foot(rows)→html, rowCls(r) }
     ========================================================================== */
  BO.table = (host, cfg) => {
    const st = cfg.state || (cfg.state = {});
    const draw = () => {
      let rows = cfg.rows.slice();
      const col = cfg.cols.find(c => c.k === st.sort);
      if (col) { const g = col.get || (r => r[col.k]); rows.sort((a, b) => { const x = g(a), y = g(b); const r = (typeof x === 'number' && typeof y === 'number') ? x - y : String(x ?? '').localeCompare(String(y ?? ''), 'fr', { numeric: true }); return st.dir === 'desc' ? -r : r; }); }
      host.innerHTML = `<div class="tbl-wrap" ${cfg.maxH ? `style="max-height:${cfg.maxH}px"` : ''}><table class="tbl ${cfg.cls || ''}"><thead><tr>${cfg.cols.map(c => `<th class="${c.nosort ? '' : 's'} ${c.num ? 'num' : ''} ${st.sort === c.k ? 'sorted' : ''}" data-k="${c.k}" ${c.w ? `style="width:${c.w}"` : ''}>${c.label}${c.nosort ? '' : `<span class="ar">${st.sort === c.k && st.dir === 'desc' ? '▼' : '▲'}</span>`}</th>`).join('')}</tr></thead><tbody>${rows.length ? rows.map((r, i) => `<tr data-ri="${i}" class="${cfg.onRow ? 'cl' : ''} ${cfg.rowCls ? cfg.rowCls(r) : ''}">${cfg.cols.map(c => `<td class="${c.num ? 'num' : ''} ${c.cls || ''}">${c.render ? c.render(r) : esc(r[c.k])}</td>`).join('')}</tr>`).join('') : `<tr><td colspan="${cfg.cols.length}">${cfg.empty || BO.empty('search', 'Aucun résultat', 'Modifiez les filtres pour élargir la recherche.', '', true)}</td></tr>`}</tbody>${cfg.foot && rows.length ? `<tfoot><tr>${cfg.foot(rows)}</tr></tfoot>` : ''}</table></div>`;
      host.querySelector('thead').addEventListener('click', e => { const th = e.target.closest('th.s'); if (!th) return; const k = th.dataset.k; if (st.sort === k) st.dir = st.dir === 'desc' ? 'asc' : 'desc'; else { st.sort = k; st.dir = cfg.cols.find(c => c.k === k).num ? 'desc' : 'asc'; } draw(); });
      if (cfg.onRow) host.querySelector('tbody').addEventListener('click', e => { if (e.target.closest('button,a,input,select,label,[data-open],[data-open-emp],[data-open-task],[data-map]')) return; const tr = e.target.closest('tr[data-ri]'); if (tr) cfg.onRow(rows[+tr.dataset.ri]); });
      if (cfg.after) cfg.after(host, rows);
    };
    draw(); return { draw };
  };

  /* ==========================================================================
     FORMULAIRES
     field: { k, label, type:text|number|date|select|textarea|email|tel|color|checkbox, opts, req, min, max, step, full, ph, help, v }
     ========================================================================== */
  BO.formHtml = (fields, vals = {}, cls = '') => `<div class="fgrid ${cls}">${fields.map(f => {
    if (f.type === 'html') return `<div class="${f.full ? 'full' : ''}">${f.html}</div>`;
    const v = vals[f.k] != null ? vals[f.k] : (f.v != null ? f.v : '');
    const id = 'f_' + f.k;
    let ctl;
    if (f.type === 'select') ctl = `<select class="inp" id="${id}" name="${f.k}">${BO.opts(f.opts || [], v, f.empty)}</select>`;
    else if (f.type === 'textarea') ctl = `<textarea class="inp" id="${id}" name="${f.k}" placeholder="${esc(f.ph || '')}" rows="${f.rows || 4}">${esc(v)}</textarea>`;
    else if (f.type === 'checkbox') return `<label class="chk ${f.full ? 'full' : ''}"><input type="checkbox" name="${f.k}" ${v ? 'checked' : ''}> ${esc(f.label)}</label>`;
    else ctl = `<input class="inp" id="${id}" name="${f.k}" type="${f.type || 'text'}" value="${esc(v)}" placeholder="${esc(f.ph || '')}" ${f.min != null ? `min="${f.min}"` : ''} ${f.max != null ? `max="${f.max}"` : ''} ${f.step != null ? `step="${f.step}"` : ''} ${f.type === 'color' ? 'style="padding:4px;height:40px"' : ''}>`;
    return `<div class="field ${f.full ? 'full' : ''}" data-f="${f.k}"><label for="${id}">${esc(f.label)}${f.req ? '<span class="req">*</span>' : ''}</label>${ctl}${f.help ? `<div class="help">${esc(f.help)}</div>` : ''}<div class="em"></div></div>`;
  }).join('')}</div>`;
  BO.formRead = (root, fields) => {
    const vals = {}, errs = {};
    fields.forEach(f => {
      if (f.type === 'html') return;
      const el = root.querySelector(`[name="${f.k}"]`); if (!el) return;
      let v = f.type === 'checkbox' ? el.checked : el.value.trim();
      if (f.type === 'number') v = v === '' ? null : Number(v);
      vals[f.k] = v;
      if (f.req && (v === '' || v == null)) errs[f.k] = 'Champ obligatoire';
      else if (f.type === 'number' && v != null && (isNaN(v) || (f.min != null && v < f.min) || (f.max != null && v > f.max))) errs[f.k] = f.min != null && f.max != null ? `Entre ${f.min} et ${f.max}` : f.min != null ? `Minimum ${f.min}` : 'Nombre invalide';
      else if (f.type === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs[f.k] = 'Adresse e-mail invalide';
      else if (f.type === 'tel' && v && !/^[+\d][\d\s().-]{6,}$/.test(v)) errs[f.k] = 'Numéro invalide';
      else if (f.validate) { const m = f.validate(v, vals); if (m) errs[f.k] = m; }
    });
    root.querySelectorAll('.field[data-f]').forEach(d => { const m = errs[d.dataset.f]; d.classList.toggle('err', !!m); const em = d.querySelector('.em'); if (em) em.textContent = m || ''; });
    const first = Object.keys(errs)[0]; if (first) { const el = root.querySelector(`[name="${first}"]`); el && el.focus(); }
    return { ok: !first, vals, errs };
  };
  /** Modale formulaire : onSubmit(vals, close, root) ; retourner false garde la modale ouverte. extra(root) pour brancher du comportement. */
  BO.formModal = ({ title, fields, values = {}, submit = 'Enregistrer', wide = false, intro = '', after = '', onSubmit, onMount, danger }) => {
    return UI.modal({
      title: esc(title), wide,
      body: (intro ? `<div class="mb">${intro}</div>` : '') + BO.formHtml(fields, values, wide ? 'c3' : '') + after,
      foot: `${danger ? `<button class="btn danger" data-del style="margin-right:auto">${UI.icon('trash', 16)}${esc(danger.label || 'Supprimer')}</button>` : ''}<button class="btn" data-close>Annuler</button><button class="btn pri" data-ok>${UI.icon('check', 16)}${esc(submit)}</button>`,
      onMount: (el, close) => {
        const go = () => { const r = BO.formRead(el, fields); if (!r.ok) return; const res = onSubmit(r.vals, close, el); if (res !== false) close(); };
        el.querySelector('[data-ok]').addEventListener('click', go);
        el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); go(); } });
        if (danger) el.querySelector('[data-del]').addEventListener('click', () => { close(); BO.confirm(danger.title || 'Supprimer ?', danger.text || 'Cette action est définitive.', 'Supprimer', danger.run, true); });
        if (onMount) onMount(el, close);
        setTimeout(() => { const f = el.querySelector('.inp'); f && f.focus(); }, 60);
      },
    });
  };
  BO.confirm = (title, text, ok = 'Confirmer', run, danger = false) => UI.modal({
    title: esc(title), body: `<p style="line-height:1.55;color:var(--ink2)">${text}</p>`,
    foot: `<button class="btn" data-close>Annuler</button><button class="btn ${danger ? 'dark' : 'pri'}" data-ok>${esc(ok)}</button>`,
    onMount: (el, close) => el.querySelector('[data-ok]').addEventListener('click', () => { close(); run(); }),
  });

  /** Message pré-rédigé (relances, demandes) — l'utilisateur relit et valide. */
  BO.compose = ({ title = 'Message', to = '', subject = '', body = '', channel = 'E-mail', note = '', okLabel = 'Marquer comme envoyé', onSend }) => UI.modal({
    title: esc(title), wide: false,
    body: `${note ? `<div class="form-note mb">${BO.icon('sparkles', 17)}<div>${note}</div></div>` : ''}
      <div class="fgrid"><div class="field"><label>Destinataire</label><input class="inp" name="to" value="${esc(to)}"></div><div class="field"><label>Canal</label><select class="inp" name="ch">${BO.opts(['E-mail', 'SMS', 'Téléphone (script)', 'Courrier'], channel)}</select></div>
      <div class="field full"><label>Objet</label><input class="inp" name="subj" value="${esc(subject)}"></div>
      <div class="field full"><label>Message</label><textarea class="inp" name="body" rows="11">${esc(body)}</textarea></div></div>`,
    foot: `<button class="btn" data-copy style="margin-right:auto">${BO.xi('copy', 16)}Copier</button><a class="btn" data-mail>${UI.icon('mail', 16)}Ouvrir dans la messagerie</a><button class="btn pri" data-ok>${UI.icon('send', 16)}${esc(okLabel)}</button>`,
    onMount: (el, close) => {
      const val = n => el.querySelector(`[name="${n}"]`).value;
      el.querySelector('[data-copy]').addEventListener('click', () => BO.copy(val('subj') + '\n\n' + val('body')));
      el.querySelector('[data-mail]').addEventListener('click', e => { e.preventDefault(); const to = val('to'); const href = 'mailto:' + (/@/.test(to) ? encodeURIComponent(to) : '') + '?subject=' + encodeURIComponent(val('subj')) + '&body=' + encodeURIComponent(val('body')); window.location.href = href; });
      el.querySelector('[data-ok]').addEventListener('click', () => { close(); onSend && onSend({ to: val('to'), channel: val('ch'), subject: val('subj'), body: val('body') }); });
    },
  });

  /* ==========================================================================
     TIROIR LATÉRAL
     ========================================================================== */
  BO.drawer = ({ title, sub = '', head = '', render, foot, wide = false, onMount }) => {
    BO.closeDrawer();
    const bg = document.createElement('div'); bg.className = 'bo-drawer-bg';
    const d = document.createElement('aside'); d.className = 'bo-drawer' + (wide ? ' wide' : '');
    document.body.append(bg, d);
    const close = () => { bg.remove(); d.remove(); document.removeEventListener('keydown', onKey); if (drawerCur && drawerCur.el === d) drawerCur = null; };
    const onKey = e => { if (e.key === 'Escape' && !document.querySelector('.modal-bg')) close(); };
    const rerender = () => {
      const t = typeof title === 'function' ? title() : title; if (t == null) { close(); return; }
      const sc = d.querySelector('.db') ? d.querySelector('.db').scrollTop : 0;
      const h = typeof head === 'function' ? head() : head, sb = typeof sub === 'function' ? sub() : sub;
      const f = typeof foot === 'function' ? foot() : foot;
      d.innerHTML = `<div class="dh">${h}<div class="tt"><h3>${t}</h3><div class="sub">${sb}</div></div><button class="btn ghost sm" data-x>${UI.icon('x', 18)}</button></div><div class="db">${render()}</div>${f ? `<div class="df">${f}</div>` : ''}`;
      d.querySelector('[data-x]').addEventListener('click', close);
      d.querySelector('.db').scrollTop = sc;
      onMount && onMount(d, close, rerender);
    };
    bg.addEventListener('click', close);
    document.addEventListener('keydown', onKey);
    drawerCur = { el: d, rerender, close };
    rerender();
    return drawerCur;
  };
  BO.closeDrawer = () => { if (drawerCur) drawerCur.close(); };

  /* ==========================================================================
     SÉLECTEURS
     ========================================================================== */
  /** Choisir un employé (pool et équipe du chantier en premier). */
  BO.pickEmployee = ({ title = 'Affecter quelqu’un', siteId, taskId, onPick, fieldOnly = true }) => {
    const t = taskId ? VX.task(taskId) : null;
    let q = '';
    const score = e => (e.siteId === 'hq' && BO.isField(e) ? 0 : e.siteId === siteId ? 1 : 2) + (e.status === 'absent' ? 5 : 0);
    const list = () => VX.S.employees.filter(e => (!fieldOnly || BO.isField(e) || e.id === (t && t.assignees[0])) && (!q || (e.name + ' ' + VX.roleLabel(e.role)).toLowerCase().includes(q))).sort((a, b) => score(a) - score(b) || a.last.localeCompare(b.last));
    const row = e => {
      const tk = e.taskId ? VX.task(e.taskId) : null, abs = e.status === 'absent', already = t && t.assignees.includes(e.id);
      const tag = e.siteId === 'hq' && BO.isField(e) ? '<span class="chip green">Disponible</span>' : e.siteId === siteId ? '<span class="chip">Sur ce chantier</span>' : '';
      return `<div class="row" style="padding:9px 8px;border-bottom:1px solid var(--line);${abs || already ? 'opacity:.5' : 'cursor:pointer'}" ${abs || already ? '' : `data-pick="${e.id}"`}>${UI.avatar(e, 34)}<div style="flex:1;min-width:0"><b>${esc(e.name)}</b> ${tag}<div class="sm-t muted">${esc(VX.roleLabel(e.role))} · ${esc(BO.siteName(e.siteId))}${tk ? ' · ' + esc(tk.title) : ''}${abs ? ' · Absent·e' : ''}${already ? ' · déjà affecté·e' : ''}</div></div>${abs || already ? '' : `<span class="btn sm">${UI.icon('plus', 14)}Choisir</span>`}</div>`;
    };
    UI.modal({
      title: esc(title) + (t ? ` <small class="muted" style="font-weight:600;font-size:14px">· ${esc(t.title)}</small>` : ''),
      body: `<div class="toolbar"><div class="srch" style="flex:1"><input class="inp" data-q placeholder="Rechercher par nom ou métier…" style="width:100%">${UI.icon('search')}</div></div><div data-l style="max-height:52vh;overflow:auto"></div>`,
      onMount: (el, close) => {
        const L = el.querySelector('[data-l]');
        const draw = () => { const ls = list(); L.innerHTML = ls.length ? ls.map(row).join('') : BO.empty('users', 'Personne ne correspond', '', '', true); };
        draw();
        el.querySelector('[data-q]').addEventListener('input', e => { q = e.target.value.toLowerCase(); draw(); });
        L.addEventListener('click', e => { const p = e.target.closest('[data-pick]'); if (p) { close(); onPick(p.dataset.pick); } });
        setTimeout(() => el.querySelector('[data-q]').focus(), 50);
      },
    });
  };
  /** Choisir un chantier puis (option) une tâche ; onPick(siteId, taskId|null) */
  BO.pickSite = ({ title = 'Envoyer vers…', withTask = true, exclude, onPick }) => {
    const sites = VX.S.sites.filter(s => s.id !== exclude && s.status !== 'Terminé');
    UI.modal({
      title: esc(title),
      body: `<div class="g g2">${sites.map(s => `<div class="card pad" data-s="${s.id}" style="cursor:pointer;box-shadow:inset 0 0 0 1px var(--line2)"><div class="row"><span class="sc-ic" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;background:${s.color}">${BO.siteIcon(s)}</span><div><b>${esc(s.id === 'hq' ? 'Siège / dépôt (disponible)' : s.name)}</b><div class="sm-t muted">${esc(s.city)} · ${VX.siteStaff(s.id).length} pers.</div></div></div></div>`).join('')}</div><div data-t class="mt"></div>`,
      onMount: (el, close) => {
        el.addEventListener('click', e => {
          const c = e.target.closest('[data-s]');
          if (c) {
            const sid = c.dataset.s;
            el.querySelectorAll('[data-s]').forEach(x => x.style.boxShadow = x === c ? 'inset 0 0 0 2px var(--tq)' : 'inset 0 0 0 1px var(--line2)');
            const ts = VX.siteTasks(sid).filter(t => t.status !== 'done');
            if (!withTask || !ts.length) { close(); onPick(sid, null); return; }
            el.querySelector('[data-t]').innerHTML = `<h2 class="sec">Sur quelle tâche ?</h2><div class="mini-list">${ts.map(t => `<div data-tk="${t.id}" style="cursor:pointer">${UI.statusChip(t.status)}<div style="flex:1"><b>${esc(t.title)}</b><div class="xs-t muted">CFC ${esc(t.cfc)} · ${t.assignees.length} pers.</div></div><span class="btn sm">Choisir</span></div>`).join('')}<div data-tk="" style="cursor:pointer"><span class="chip grey">Sans tâche</span><div style="flex:1" class="muted">Juste envoyer sur le chantier</div><span class="btn sm">Choisir</span></div></div>`;
            el.querySelector('[data-t]').onclick = ev => { const tk = ev.target.closest('[data-tk]'); if (tk) { close(); onPick(sid, tk.dataset.tk || null); } };
          }
        });
      },
    });
  };

  /** Réaffecter un employé : chantier + tâche → VX.assign / VX.moveTo */
  BO.reassign = empId => {
    const e = VX.emp(empId); if (!e) return;
    if (e.status === 'absent') { UI.toast('Absent·e', e.name + ' est absent·e aujourd’hui.', 'warn'); return; }
    BO.pickSite({
      title: 'Réaffecter ' + e.name, onPick: (sid, tid) => {
        if (tid) { if (VX.assign(empId, tid)) UI.toast('Affectation enregistrée', e.name + ' → ' + VX.task(tid).title, 'ok', 'check'); }
        else { VX.moveTo(empId, sid); UI.toast('Déplacement enregistré', e.name + ' → ' + BO.siteName(sid), 'ok', 'check'); }
      },
    });
  };

  /* ==========================================================================
     TIROIR « TÂCHE » (partagé : chantiers, planning, tableau de bord)
     ========================================================================== */
  const PRIO = { basse: 'grey', normale: 'blue', haute: 'red' };
  BO.prioChip = p => `<span class="chip ${PRIO[p] || 'grey'}">${esc(p ? p[0].toUpperCase() + p.slice(1) : 'Normale')}</span>`;
  BO.taskDrawer = id => {
    BO.drawer({
      title: () => { const t = VX.task(id); return t ? esc(t.title) : null; },
      sub: () => { const t = VX.task(id); return `${UI.statusChip(t.status)} ${BO.prioChip(t.priority)} <span>CFC ${esc(t.cfc)} · ${esc(BO.cfcLabel(t.cfc))}</span>`; },
      render: () => {
        const t = VX.task(id), s = VX.site(t.siteId), late = t.status !== 'done' && diffDays(today(), t.end) < 0;
        return `<div class="dsec"><div class="row" style="margin-bottom:12px">${BO.pillSite(t.siteId)}<span class="sp"></span>${late ? '<span class="chip red">En retard</span>' : ''}</div>
          <div class="g g3" style="gap:10px">${[['Prévu', BO.h(t.plannedH)], ['Réalisé', BO.h(t.doneH)], ['Reste', BO.h(Math.max(0, t.plannedH - t.doneH))]].map(([l, v]) => `<div class="card pad" style="box-shadow:inset 0 0 0 1px var(--line);padding:11px 13px"><div class="xs-t muted b">${l}</div><div style="font-size:19px;font-weight:900">${v}</div></div>`).join('')}</div>
          <div class="mt">${BO.prog(t.progress, t.status === 'blocked' ? 'red' : '')}</div></div>
          <div class="dsec"><h4>Statut</h4><div class="seg" data-st>${Object.entries(VX.TASK_STATUS).map(([k, l]) => `<button data-v="${k}" class="${t.status === k ? 'on' : ''}">${l}</button>`).join('')}</div></div>
          <div class="dsec"><h4>Équipe affectée <span class="r"><button class="btn sm" data-add>${UI.icon('plus', 14)}Affecter</button></span></h4>${t.assignees.length ? `<div class="mini-list">${t.assignees.map(VX.emp).filter(Boolean).map(e => `<div>${UI.avatar(e, 32)}<div style="flex:1;cursor:pointer" data-open-emp="${e.id}"><b>${esc(e.name)}</b><div class="xs-t muted">${esc(VX.roleLabel(e.role))}${e.status === 'absent' ? ' · <span class="bad-t">absent·e</span>' : ''}</div></div><button class="icon-btn" title="Voir sur la carte" data-map="employee:${e.id}">${UI.icon('map', 16)}</button><button class="icon-btn" title="Retirer" data-un="${e.id}">${UI.icon('x', 16)}</button></div>`).join('')}</div>` : BO.empty('users', 'Personne n’est affecté', 'Affectez une équipe pour démarrer la tâche.', '', true)}</div>
          <div class="dsec"><h4>Saisir de l’avancement</h4><div class="row"><input class="inp sm" type="number" min="0.25" step="0.25" value="8" data-hrs style="width:90px"><span class="muted sm-t">heures réalisées</span><button class="btn sm pri" data-prog>${UI.icon('plus', 14)}Ajouter</button></div></div>
          <div class="dsec"><h4>Détails</h4><dl class="kv"><dt>Chantier</dt><dd>${esc(s.name)}</dd><dt>Début</dt><dd>${BO.date(t.start)}</dd><dt>Fin prévue</dt><dd>${BO.date(t.end)} <span class="muted">(${BO.inDays(t.end)})</span></dd><dt>Priorité</dt><dd>${esc(t.priority || 'normale')}</dd></dl>${t.notes ? `<div class="note-box mt">${esc(t.notes)}</div>` : ''}</div>`;
      },
      foot: () => `<button class="btn" data-edit>${UI.icon('edit', 15)}Modifier</button>${BO.mapBtn('task', id, 'Voir sur la carte', '')}<span class="sp"></span>${VX.task(id) && VX.task(id).status !== 'done' ? `<button class="btn pri" data-done>${UI.icon('check', 15)}Terminer</button>` : ''}`,
      onMount: (d) => {
        const t = VX.task(id); if (!t) return;
        d.querySelector('[data-st]').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b && b.dataset.v !== t.status) { VX.setTaskStatus(id, b.dataset.v); UI.toast('Statut mis à jour', t.title + ' → ' + VX.TASK_STATUS[b.dataset.v], 'ok', 'check'); BO.now(); } });
        d.querySelector('[data-add]').addEventListener('click', () => BO.pickEmployee({ siteId: t.siteId, taskId: id, onPick: eid => { if (VX.assign(eid, id)) { UI.toast('Affecté·e', BO.empName(eid) + ' → ' + t.title, 'ok', 'check'); BO.now(); } } }));
        d.querySelectorAll('[data-un]').forEach(b => b.addEventListener('click', () => { VX.unassign(b.dataset.un); BO.now(); }));
        d.querySelector('[data-prog]').addEventListener('click', () => { const h = parseFloat(d.querySelector('[data-hrs]').value); if (!(h > 0)) { UI.toast('Heures invalides', 'Indiquez un nombre d’heures positif.', 'warn'); return; } VX.addTaskProgress(id, h); UI.toast('Avancement enregistré', '+' + BO.h(h) + ' sur ' + t.title, 'ok', 'check'); BO.now(); });
        const done = d.querySelector('[data-done]'); if (done) done.addEventListener('click', () => { VX.setTaskStatus(id, 'done'); UI.toast('Tâche terminée', t.title, 'ok', 'trophy'); BO.now(); });
        d.querySelector('[data-edit]').addEventListener('click', () => BO.taskForm(t.siteId, id));
      },
    });
  };
  /** Formulaire création / modification de tâche */
  BO.taskForm = (siteId, id) => {
    const t = id ? VX.task(id) : null;
    const fields = [
      { k: 'title', label: 'Intitulé', req: true, full: true, ph: 'ex. Coffrage murs sous-sol' },
      { k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(true), req: true },
      { k: 'cfc', label: 'Code CFC', type: 'select', opts: [['—', '— Hors CFC']].concat(BO.optCFC()) },
      { k: 'start', label: 'Début', type: 'date', req: true },
      { k: 'end', label: 'Fin prévue', type: 'date', req: true, validate: (v, all) => all.start && v < all.start ? 'La fin doit suivre le début' : '' },
      { k: 'plannedH', label: 'Heures prévues', type: 'number', min: 1, step: 1, req: true },
      { k: 'priority', label: 'Priorité', type: 'select', opts: [['basse', 'Basse'], ['normale', 'Normale'], ['haute', 'Haute']] },
      { k: 'notes', label: 'Notes', type: 'textarea', full: true, rows: 3 },
    ];
    BO.formModal({
      title: t ? 'Modifier la tâche' : 'Nouvelle tâche', fields,
      values: t || { siteId, start: today(), end: addDays(today(), 5), plannedH: 40, priority: 'normale', cfc: '—' },
      submit: t ? 'Enregistrer' : 'Créer la tâche',
      danger: t ? { label: 'Supprimer', title: 'Supprimer la tâche ?', text: 'La tâche « ' + esc(t.title) + ' » sera retirée et son équipe libérée.', run: () => { t.assignees.slice().forEach(a => VX.unassign(a)); VX.remove('tasks', t.id, 'task'); BO.closeDrawer(); UI.toast('Tâche supprimée', t.title, 'ok'); } } : null,
      onSubmit: v => {
        if (t) { VX.upsert('tasks', Object.assign({ id: t.id }, v, { progress: v.plannedH ? Math.min(1, t.doneH / v.plannedH) : 0 }), 'task'); UI.toast('Tâche modifiée', v.title, 'ok', 'check'); }
        else { const nt = VX.createTask(v); UI.toast('Tâche créée', nt.title + ' · ' + BO.siteName(nt.siteId), 'ok', 'check'); }
        BO.now();
      },
    });
  };
})();

</script>
<script>
/* ==========================================================================
   BO · Tableau de bord direction
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, addDays, diffDays } = U;

  /* --- paiements enregistrés (pour la trésorerie du mois en cours) --- */
  VX.on('payment', d => { const S = VX.S; S.ext = S.ext || {}; (S.ext.payments = S.ext.payments || []).push({ date: today(), amount: d.amount || 0 }); VX.save(); });

  /* ==========================================================================
     « À traiter aujourd'hui » : alertes VX + relances métier, avec actions 1 clic
     ========================================================================== */
  const KIND_IC = { delivery: 'truck', blocked: 'alert', unassigned: 'users', machine: 'wrench', cert: 'shield', safety: 'helmet', invoice: 'invoice', absence: 'user', quote: 'quote', deal: 'target', ts: 'clock', bill: 'coins', toolbox: 'shield' };
  BO.todo = () => {
    const S = VX.S, t0 = today(), out = [];
    VX.alerts().forEach(a => {
      const x = Object.assign({}, a, { acts: [] });
      if (a.kind === 'delivery') { const oid = a.id.slice(3); x.acts = [['remind-order', 'Relancer', oid, 'pri'], ['order-done', 'Livrée', oid]]; }
      if (a.kind === 'blocked') x.acts = [['unblock', 'Débloquer', a.target.id, 'pri'], ['task', 'Ouvrir', a.target.id]];
      if (a.kind === 'unassigned') x.acts = [['assign', 'Affecter', a.target.id, 'pri'], ['task', 'Ouvrir', a.target.id]];
      if (a.kind === 'machine') x.acts = [['service', 'Service effectué', a.target.id, 'pri'], ['equipment', 'Ouvrir', a.target.id]];
      if (a.kind === 'cert') { const empId = a.target.id; x.acts = [['renew', 'Renouveler', empId + '|' + a.id.slice(4 + empId.length), 'pri'], ['emp', 'Fiche', empId]]; }
      if (a.kind === 'safety') x.acts = [['incident', 'Traiter', a.id.slice(3), 'pri']];
      if (a.kind === 'invoice') x.acts = [['remind-inv', 'Relancer', a.id.slice(3), 'pri'], ['pay', 'Paiement reçu', a.id.slice(3)]];
      if (a.kind === 'absence') x.acts = [['replace', 'Remplacer', a.target.id, 'pri'], ['emp', 'Fiche', a.target.id]];
      out.push(x);
    });
    S.quotes.filter(q => (q.status === 'Envoyée' || q.status === 'Négociation') && diffDays(t0, q.validity) <= 7).forEach(q => out.push({ id: 'n-q' + q.id, level: diffDays(t0, q.validity) < 0 ? 'mid' : 'low', kind: 'quote', title: diffDays(t0, q.validity) < 0 ? 'Offre expirée sans réponse' : 'Offre bientôt échue', text: q.no + ' – ' + q.title + ' (validité ' + U.fmtDate(q.validity) + ')', acts: [['follow-quote', 'Relancer le client', q.id, 'pri'], ['quote', 'Ouvrir', q.id]] }));
    S.deals.filter(d => !/Gagn|Perdu/.test(d.stage) && d.next && diffDays(t0, d.next) <= 0).forEach(d => out.push({ id: 'n-d' + d.id, level: 'low', kind: 'deal', title: 'Action commerciale prévue', text: d.title + ' – ' + d.stage + ' (' + BO.inDays(d.next) + ')', acts: [['deal', 'Ouvrir', d.id, 'pri']] }));
    const pending = S.timesheets.filter(t => !t.validated && t.date < t0).length;
    if (pending) out.push({ id: 'n-ts', level: 'low', kind: 'ts', title: 'Heures à valider', text: pending + ' saisies de pointage en attente de validation', acts: [['timesheets', 'Valider', '', 'pri']] });
    BO.activeSites().forEach(s => { const f = BO.siteFin(s.id); if (f.toBill > s.contract * 0.04) out.push({ id: 'n-b' + s.id, level: 'low', kind: 'bill', siteId: s.id, title: 'Situation à facturer', text: s.name + ' – ' + chfK(f.toBill) + ' HT de travaux non facturés', acts: [['situation', 'Préparer la situation', s.id, 'pri']] }); });
    const ws = U.weekStart(t0);
    const noTb = BO.activeSites().filter(s => !(S.toolbox || []).some(t => t.siteId === s.id && t.date >= ws));
    if (noTb.length) out.push({ id: 'n-tb', level: 'low', kind: 'toolbox', title: 'Quart d’heure sécurité de la semaine', text: 'À tenir sur : ' + noTb.map(s => s.code).join(', '), acts: [['safety', 'Ouvrir la check-list', '', 'pri']] });
    const ord = { high: 0, mid: 1, low: 2 };
    return out.sort((a, b) => ord[a.level] - ord[b.level]);
  };
  BO.runTodo = (act, arg) => {
    const S = VX.S;
    switch (act) {
      case 'remind-order': BO.supplierReminder(arg); break;
      case 'order-done': BO.receiveOrder(arg); break;
      case 'unblock': VX.setTaskStatus(arg, 'doing'); UI.toast('Tâche débloquée', VX.task(arg).title, 'ok', 'check'); break;
      case 'task': BO.taskDrawer(arg); break;
      case 'assign': { const t = VX.task(arg); BO.pickEmployee({ siteId: t.siteId, taskId: arg, onPick: e => { if (VX.assign(e, arg)) UI.toast('Affecté·e', BO.empName(e) + ' → ' + t.title, 'ok', 'check'); } }); break; }
      case 'service': BO.serviceForm(arg); break;
      case 'equipment': APP.open('equipment', { id: arg }); break;
      case 'renew': { const [e, c] = arg.split('|'); BO.renewCert(e, c); break; }
      case 'emp': BO.empDrawer(arg); break;
      case 'incident': APP.open('safety', { id: arg }); break;
      case 'remind-inv': BO.invoiceReminder(arg); break;
      case 'pay': BO.payForm(arg); break;
      case 'replace': { const e = VX.emp(arg); BO.pickEmployee({ title: 'Remplacer ' + e.name, siteId: e.homeSiteId, onPick: id => { VX.moveTo(id, e.homeSiteId); UI.toast('Remplacement organisé', BO.empName(id) + ' rejoint ' + BO.siteName(e.homeSiteId), 'ok', 'check'); } }); break; }
      case 'follow-quote': BO.quoteFollowUp(arg); break;
      case 'quote': APP.open('quotes', { id: arg }); break;
      case 'deal': APP.open('pipeline', { id: arg }); break;
      case 'timesheets': APP.open('timesheets'); break;
      case 'situation': BO.newSituation(arg); break;
      case 'safety': APP.open('safety', { tab: 'toolbox' }); break;
    }
  };
  BO.todoHtml = (items, max = 99) => items.length ? items.slice(0, max).map(a => `<div class="todo" data-todo="${esc(a.id)}">
      <div class="tic ${a.level}">${BO.icon(KIND_IC[a.kind] || 'bell', 17)}</div>
      <div class="tx"><b>${esc(a.title)}</b><span>${esc(a.text)}</span>${a.siteId && VX.site(a.siteId) ? `<div><small>${esc(BO.siteName(a.siteId))}</small></div>` : ''}</div>
      <div class="ta">${(a.acts || []).map(([act, l, arg, cls]) => `<button class="btn sm ${cls || ''}" data-act="${act}" data-arg="${esc(arg)}">${esc(l)}</button>`).join('')}${a.target && /site|task|employee/.test(a.target.type) ? `<button class="icon-btn" title="Voir sur la carte" data-map="${a.target.type}:${a.target.id}">${UI.icon('map', 16)}</button>` : ''}</div></div>`).join('')
    : BO.empty('check', 'Rien d’urgent', 'Tout est sous contrôle pour aujourd’hui.', '', true);
  BO.bindTodo = el => el.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) BO.runTodo(b.dataset.act, b.dataset.arg); });

  /* ==========================================================================
     Trésorerie (SVG)
     ========================================================================== */
  function cashSeries() {
    const S = VX.S, now = new Date(), out = [];
    for (let k = -5; k <= 2; k++) {
      const d = new Date(now.getFullYear(), now.getMonth() + k, 1), ym = d.getFullYear() + '-' + U.pad(d.getMonth() + 1);
      const r = U.rng(U.hash('cash' + ym));
      let inn, out_;
      if (k < 0) { inn = 1.15e6 + r() * 0.75e6; out_ = 1.05e6 + r() * 0.55e6; }
      else if (k === 0) {
        inn = 0.42e6 + (S.ext.payments || []).filter(p => p.date.startsWith(ym)).reduce((a, p) => a + p.amount, 0);
        out_ = 0.68e6 + S.orders.filter(o => o.status === 'Livrée' && (o.delivery || '').startsWith(ym)).reduce((a, o) => a + o.amount, 0);
      } else {
        inn = S.invoices.filter(i => i.status !== 'Payée' && (i.due || '').startsWith(ym)).reduce((a, i) => a + i.amount - (i.paid || 0), 0) + 0.55e6 + r() * 0.3e6;
        out_ = S.orders.filter(o => o.status !== 'Livrée' && (o.delivery || '').startsWith(ym)).reduce((a, o) => a + o.amount, 0) + 0.85e6 + r() * 0.25e6;
      }
      out.push({ k, lbl: d.toLocaleDateString(I18N.locale, { month: 'short' }).replace('.', ''), inn, out: out_ });
    }
    return out;
  }
  BO.cashChart = () => {
    const ser = cashSeries(), W = 560, H = 210, pl = 40, pb = 26, pt = 14, cw = (W - pl - 8) / ser.length;
    const max = Math.max(...ser.map(s => Math.max(s.inn, s.out))) * 1.12, y = v => pt + (H - pt - pb) * (1 - v / max);
    let cum = 0; const net = ser.map(s => (cum += s.inn - s.out));
    const nmin = Math.min(0, ...net), nmax = Math.max(...net, 1), yn = v => pt + (H - pt - pb) * (1 - (v - nmin) / (nmax - nmin || 1));
    const ticks = [0, .25, .5, .75, 1].map(f => max * f / 1.12);
    let g = ticks.map(v => `<line x1="${pl}" x2="${W - 4}" y1="${y(v)}" y2="${y(v)}" stroke="#e6eeed"/><text x="${pl - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="#7d908e">${(v / 1e6).toLocaleString(I18N.locale, { maximumFractionDigits: 1 })}M</text>`).join('');
    ser.forEach((s, i) => {
      const x = pl + i * cw + cw * .18, bw = cw * .3, fut = s.k > 0;
      g += `<rect x="${x}" y="${y(s.inn)}" width="${bw}" height="${H - pb - y(s.inn)}" rx="4" fill="${fut ? 'url(#hin)' : '#0fb5ab'}"><title>Encaissements ${chf(s.inn)}</title></rect>`;
      g += `<rect x="${x + bw + 3}" y="${y(s.out)}" width="${bw}" height="${H - pb - y(s.out)}" rx="4" fill="${fut ? 'url(#hout)' : '#b6c4c2'}"><title>Décaissements ${chf(s.out)}</title></rect>`;
      g += `<text x="${pl + i * cw + cw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" font-weight="${s.k === 0 ? 800 : 600}" fill="${s.k === 0 ? '#076b65' : '#7d908e'}">${esc(s.lbl)}</text>`;
    });
    const pts = net.map((v, i) => `${pl + i * cw + cw / 2},${yn(v)}`).join(' ');
    g += `<polyline points="${pts}" fill="none" stroke="#076b65" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="0"/>` + net.map((v, i) => `<circle cx="${pl + i * cw + cw / 2}" cy="${yn(v)}" r="3.5" fill="#fff" stroke="#076b65" stroke-width="2"><title>Solde cumulé ${chf(v)}</title></circle>`).join('');
    const xNow = pl + 5 * cw;
    g += `<rect x="${xNow + cw}" y="${pt - 6}" width="${W - xNow - cw - 4}" height="${H - pt - pb + 6}" fill="#0fb5ab" opacity=".05"/><text x="${xNow + cw + 6}" y="${pt + 4}" font-size="10" font-weight="700" fill="#0a8f87">prévision</text>`;
    const defs = `<defs><pattern id="hin" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#9ee5df"/><line x1="0" y1="0" x2="0" y2="6" stroke="#0fb5ab" stroke-width="2.5"/></pattern><pattern id="hout" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#e4ecea"/><line x1="0" y1="0" x2="0" y2="6" stroke="#b6c4c2" stroke-width="2.5"/></pattern></defs>`;
    const tot = ser.filter(s => s.k <= 0);
    return { svg: `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Trésorerie">${defs}${g}</svg>`, inn: tot.reduce((a, s) => a + s.inn, 0), out: tot.reduce((a, s) => a + s.out, 0), net: net[5] };
  };

  /* ==========================================================================
     Carte chantier (réutilisée par le module Chantiers)
     ========================================================================== */
  BO.siteCard = s => {
    const k = VX.siteKpis(s.id), f = BO.siteFin(s.id), chef = VX.emp(s.foremanId), cl = VX.client(s.clientId);
    const budgetUse = s.budget ? s.spent / s.budget : 0, al = VX.alerts().filter(a => a.siteId === s.id && a.level !== 'low').length;
    const cvPct = s.budget ? f.cv / (s.budget * Math.max(.01, s.progress)) : 0;
    return `<div class="site-card" data-open="sites:${s.id}"><div class="sc-top" style="background:${s.color}"></div><div class="sc-b">
      <div class="sc-h"><div class="sc-ic" style="background:${s.color}">${BO.siteIcon(s)}</div><div style="flex:1;min-width:0"><h4>${esc(s.name)}</h4><div class="ph">${esc(s.city)} · ${esc(s.phase)}</div></div>${al ? `<span class="chip red">${al} alerte${al > 1 ? 's' : ''}</span>` : '<span class="chip green">OK</span>'}</div>
      <div class="meter" title="Avancement physique vs temps écoulé (repère noir)"><span>Avancement</span><div class="bar"><i style="width:${s.progress * 100}%"></i><span class="mk" style="left:${f.elapsed * 100}%"></span></div><b>${Math.round(s.progress * 100)}%</b></div>

  const FEED_IC = { delivery: 'truck', safety: 'helmet', invoice: 'invoice', quote: 'quote', assign: 'users', done: 'check', task: 'plus', payment: 'coins', note: 'edit', machine: 'excavator', journal: 'book', doc: 'folder' };
  BO.feedHtml = (items) => items.length ? items.map(a => `<div><span class="fi">${BO.icon(FEED_IC[a.kind] || 'bell', 15)}</span><div>${esc(a.text)}<small>${BO.ago(a.at)}${a.siteId && VX.site(a.siteId) ? ' · ' + esc(BO.siteName(a.siteId)) : ''}</small></div></div>`).join('') : BO.empty('bell', 'Aucune activité', '', '', true);

  /* ==========================================================================
     RENDU
     ========================================================================== */
  function render(el) {
    const S = VX.S, me = VX.emp(S.meId), t0 = today(), y = String(new Date().getFullYear());
    const sites = BO.activeSites();
    const invY = S.invoices.filter(i => i.date.startsWith(y));
    const caHT = invY.reduce((a, i) => a + i.ht, 0), cash = invY.reduce((a, i) => a + (i.paid || 0), 0);
    const fins = sites.map(s => [s, BO.siteFin(s.id)]);
    const backlog = fins.reduce((a, [s, f]) => a + Math.max(0, f.contract - f.billed), 0) + S.quotes.filter(q => q.status === 'Acceptée' && !q.siteId).reduce((a, q) => a + BO.quoteTotals(q).ht, 0);
    const sumC = fins.reduce((a, [, f]) => a + f.contract, 0), sumM = fins.reduce((a, [, f]) => a + (f.contract - f.eac), 0), marg = sumC ? sumM / sumC : 0;
    const ws = U.weekStart(t0), wk = S.timesheets.filter(t => t.date >= ws && t.date <= addDays(ws, 6));
    const prevWk = S.timesheets.filter(t => t.date >= addDays(ws, -7) && t.date < ws).reduce((a, t) => a + t.hours, 0);
    const hrs = wk.reduce((a, t) => a + t.hours, 0), toVal = S.timesheets.filter(t => !t.validated).length;
    const onSite = S.employees.filter(e => e.siteId !== 'hq' && e.status === 'present').length;
    const al = VX.alerts(), high = al.filter(a => a.level === 'high').length;
    const todo = BO.todo();
    const cc = BO.cashChart();
    const wx = (S.journal.find(j => j.date === t0) || S.journal[0] || {}).weather || '';
    const pool = S.employees.filter(e => e.siteId === 'hq' && BO.isField(e) && e.status === 'present');
    const absent = S.employees.filter(e => e.status === 'absent');
    const hour = new Date().getHours();

    el.innerHTML = `<div class="bo-page">
      ${BO.head(`${hour < 12 ? 'Bonjour' : hour < 18 ? 'Bon après-midi' : 'Bonsoir'} ${esc(me.first)}`, `${esc(U.fmtDate(t0, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }))} · ${sites.length} chantiers actifs · ${onSite} collaborateurs sur le terrain`,
        `${wx ? `<span class="weather">${esc(wx)} <span class="muted" style="font-weight:600">Morges</span></span>` : ''}<button class="btn" data-open="quotes:new">${UI.icon('quote', 16)}Nouvelle offre</button><button class="btn pri" data-mapall>${UI.icon('map', 16)}Voir la carte live</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'CA facturé ' + y, v: chfK(caHT), s: `HT · encaissé ${chfK(cash)}`, icon: 'invoice', cls: 'hero', go: 'invoices' })}
        ${BO.kpi({ lb: 'Carnet de commandes', v: chfK(backlog), s: `reste à réaliser sur ${sites.length} chantiers`, icon: 'layers', go: 'sites' })}
        ${BO.kpi({ lb: 'Marge prévisionnelle', v: BO.pct(marg, 1), s: `<span class="delta ${marg < .1 ? 'neg' : ''}">${marg >= .1 ? '+' : ''}${BO.num((marg - .1) * 100, 1)} pt</span> vs objectif 10 %`, icon: 'percent', cls: marg < .08 ? 'amber' : 'green', go: 'sites' })}
        ${hrs >= 1 ? BO.kpi({ lb: 'Heures semaine', v: BO.num(hrs) + '<small>h</small>', s: `${toVal ? `<span class="chip amber" style="height:20px">${toVal} à valider</span>` : 'tout validé'} · S-1 : ${BO.num(prevWk)} h`, icon: 'clock', go: 'timesheets' })
          : BO.kpi({ lb: 'Heures semaine passée', v: BO.num(prevWk) + '<small>h</small>', s: `${toVal ? `<span class="chip amber" style="height:20px">${toVal} à valider</span>` : 'tout validé'} · semaine en cours démarrée`, icon: 'clock', go: 'timesheets' })}
        ${BO.kpi({ lb: 'Chantiers actifs', v: sites.length, s: `${onSite} pers. sur site · ${pool.length} dispo.`, icon: 'crane', go: 'sites' })}
        ${BO.kpi({ lb: 'Alertes', v: al.length, s: `<span class="chip red" style="height:20px">${high} urgentes</span>`, icon: 'alert', cls: (high ? 'red' : 'green') + ' click al-kpi' })}
      </div>
      <div class="g g-main">
        <div style="min-width:0">
          <div class="card"><div class="card-h"><h3>${UI.icon('bell', 18)}À traiter aujourd’hui <small>${todo.length} élément${todo.length > 1 ? 's' : ''}</small></h3><span class="legend"><span><i style="background:var(--red)"></i>Urgent</span><span><i style="background:var(--amber)"></i>À traiter</span><span><i style="background:#cfdcda"></i>Suivi</span></span></div>
            <div class="todo-list" data-todo-list style="max-height:470px;overflow:auto">${BO.todoHtml(todo)}</div></div>
          <h2 class="sec mt2">${UI.icon('crane', 18)}Chantiers en cours <span class="r"><button class="btn sm" data-open="sites">Tous les chantiers ${UI.icon('chevron', 14)}</button></span></h2>
          <div class="site-grid">${sites.map(BO.siteCard).join('')}</div>
        </div>
        <div style="min-width:0;display:flex;flex-direction:column;gap:16px">
          <div class="card"><div class="card-h"><h3>${UI.icon('coins', 18)}Trésorerie</h3><span class="legend"><span><i style="background:#0fb5ab"></i>Entrées</span><span><i style="background:#b6c4c2"></i>Sorties</span><span><i style="background:#076b65;height:3px"></i>Cumul</span></span></div>
            <div class="card-b chart-box">${cc.svg}<div class="row sm-t mt" style="justify-content:space-between"><span class="muted">6 derniers mois</span><b class="ok-t">+${chfK(cc.inn)}</b><b class="bad-t">−${chfK(cc.out)}</b><b>${chfK(cc.inn - cc.out)}</b></div></div></div>
          <div class="card"><div class="card-h"><h3>${UI.icon('users', 18)}Effectifs du jour</h3><button class="btn sm" data-open="planning">Planning</button></div>
            <div class="card-b"><div class="g g3" style="gap:8px">
              <div class="note-box" style="text-align:center"><b style="font-size:22px;display:block;color:var(--ink)">${onSite}</b><span class="xs-t">sur chantier</span></div>
              <div class="note-box" style="text-align:center"><b style="font-size:22px;display:block;color:var(--green)">${pool.length}</b><span class="xs-t">disponibles</span></div>
              <div class="note-box" style="text-align:center"><b style="font-size:22px;display:block;color:var(--red)">${absent.length}</b><span class="xs-t">absents</span></div></div>
              ${pool.length ? `<div class="sm-t b mt" style="margin-bottom:4px">Disponibles au dépôt</div><div class="mini-list">${pool.map(e => `<div>${UI.avatar(e, 28)}<div style="flex:1;cursor:pointer" data-open-emp="${e.id}"><b>${esc(e.name)}</b><div class="xs-t muted">${esc(VX.roleLabel(e.role))}</div></div><button class="btn sm" data-reassign="${e.id}">Affecter</button></div>`).join('')}</div>` : ''}
              ${absent.length ? `<div class="sm-t b mt" style="margin-bottom:4px">Absents</div><div class="mini-list">${absent.map(e => `<div>${UI.avatar(e, 28)}<div style="flex:1;cursor:pointer" data-open-emp="${e.id}"><b>${esc(e.name)}</b><div class="xs-t muted">${esc(e.absence || 'Absent·e')}</div></div></div>`).join('')}</div>` : ''}
            </div></div>
          <div class="card"><div class="card-h"><h3>${UI.icon('sparkles', 18)}Activité récente</h3></div><div class="feed" style="max-height:360px;overflow:auto">${BO.feedHtml(S.activity.slice(0, 14))}</div></div>
        </div>
      </div></div>`;

    BO.bindTodo(el.querySelector('[data-todo-list]'));
    el.querySelector('[data-mapall]').addEventListener('click', () => APP.setMode('map'));
    el.querySelectorAll('[data-reassign]').forEach(b => b.addEventListener('click', () => BO.reassign(b.dataset.reassign)));
    el.querySelector('.al-kpi').addEventListener('click', () => document.getElementById('top-bell').click());
  }

  APP.register({ id: 'dashboard', label: 'Tableau de bord', icon: 'dashboard', group: 'Pilotage', order: 1, render, badge: () => VX.alerts().filter(a => a.level === 'high').length });
})();

</script>
<script>
/* ==========================================================================
   BO · Chantiers : liste + fiche détaillée (onglets)
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, addDays, diffDays } = U;
  const st = { view: 'cards', status: 'actifs', tbl: { sort: 'end', dir: 'asc' } };
  const COLORS = ['#f2a516', '#5b6bd6', '#e4572e', '#7d6b57', '#4a7fb5', '#2a9d8f', '#d1495b', '#8e5bd6', '#3fb6a8'];
  const SITE_STATUS = ['En préparation', 'En cours', 'Suspendu', 'Réception', 'Terminé'];

  /* ---------------- formulaire chantier (exposé : utilisé par Offres) ---------------- */
  BO.siteForm = (id, prefill = {}, after) => {
    const s = id ? VX.site(id) : null;
    const fields = [
      { k: 'name', label: 'Nom du chantier', req: true, full: true, ph: 'ex. Résidence Les Cèdres' },
      { k: 'code', label: 'Code (3 lettres)', req: true, validate: v => !/^[A-Z0-9]{2,4}$/i.test(v) ? '2 à 4 caractères' : VX.S.sites.some(x => x.code.toUpperCase() === v.toUpperCase() && x.id !== id) ? 'Code déjà utilisé' : '' },
      { k: 'type', label: 'Type d’ouvrage', type: 'select', opts: Object.entries(VX.SITE_TYPES).filter(([k]) => k !== 'hq').map(([k, t]) => [k, t.label]) },
      { k: 'city', label: 'Commune', req: true },
      { k: 'clientId', label: 'Maître d’ouvrage', type: 'select', opts: BO.optClients(), req: true, empty: '— choisir —' },
      { k: 'contract', label: 'Montant du contrat HT (CHF)', type: 'number', min: 0, step: 1000, req: true },
      { k: 'budget', label: 'Budget de coûts (CHF)', type: 'number', min: 0, step: 1000, req: true, help: 'Coûts directs prévus (main-d’œuvre, matériaux, sous-traitance)' },
      { k: 'start', label: 'Début des travaux', type: 'date', req: true },
      { k: 'end', label: 'Fin prévue', type: 'date', req: true, validate: (v, a) => a.start && v <= a.start ? 'Doit suivre le début' : '' },
      { k: 'conductorId', label: 'Conducteur de travaux', type: 'select', opts: BO.optEmps(e => /conducteur|direction/.test(e.role)), empty: '—' },
      { k: 'foremanId', label: 'Chef de chantier', type: 'select', opts: BO.optEmps(e => /chef|contremaitre/.test(e.role)), empty: '—' },
      { k: 'phase', label: 'Phase actuelle', ph: 'ex. Installation de chantier' },
      { k: 'status', label: 'Statut', type: 'select', opts: SITE_STATUS },
      { k: 'color', label: 'Couleur sur la carte', type: 'color' },
      { k: 'desc', label: 'Description', type: 'textarea', full: true, rows: 3 },
    ];
    const vals = s ? Object.assign({}, s) : Object.assign({ type: 'immeuble', start: addDays(today(), 14), end: addDays(today(), 300), status: 'En préparation', phase: 'Installation de chantier', color: COLORS[VX.S.sites.length % COLORS.length] }, prefill);
    BO.formModal({
      title: s ? 'Modifier le chantier' : 'Nouveau chantier', fields, values: vals, wide: true, submit: s ? 'Enregistrer' : 'Créer le chantier',
      onMount: el => { const c = el.querySelector('[name=contract]'), b = el.querySelector('[name=budget]'); c.addEventListener('input', () => { if (!s && !b.dataset.touched) b.value = Math.round((+c.value || 0) / 1.12 / 1000) * 1000; }); b.addEventListener('input', () => b.dataset.touched = 1); },
      onSubmit: v => {
        v.code = v.code.toUpperCase();
        if (s) {
          VX.upsert('sites', Object.assign({ id: s.id }, v), 'site');
          VX.log('Chantier mis à jour : ' + v.name, 'note', s.id); VX.save();
          UI.toast('Chantier enregistré', v.name, 'ok', 'check');
        } else {
          const ns = Object.assign({ id: U.uid('s'), pos: BO.findFreePos(), progress: 0, spent: 0, billedHist: 0 }, v);
          ns.cfc = BO.cfcBreakdown(ns);
          VX.upsert('sites', ns, 'site');
          VX.log('Nouveau chantier ouvert : ' + ns.name + ' (' + ns.city + ')', 'task', ns.id); VX.save(); VX.emit('site:new', { siteId: ns.id });
          UI.toast('Chantier créé', ns.name + ' apparaît sur la carte', 'ok', 'crane');
          if (after) after(ns); else APP.open('sites', { id: ns.id });
        }
      },
    });
  };

  /* ---------------- liste ---------------- */
  function renderList(el, p) {
    const S = VX.S;
    const all = S.sites.filter(s => s.id !== 'hq');
    const rows = all.filter(s => st.status === 'tous' || (st.status === 'actifs' ? s.status !== 'Terminé' : s.status === 'Terminé'));
    const fins = rows.map(s => BO.siteFin(s.id));
    const sumC = fins.reduce((a, f) => a + f.contract, 0), sumB = rows.reduce((a, s) => a + s.budget, 0), sumS = rows.reduce((a, s) => a + s.spent, 0);
    const wProg = sumB ? rows.reduce((a, s) => a + s.progress * s.budget, 0) / sumB : 0;
    const sumM = fins.reduce((a, f) => a + (f.contract - f.eac), 0);
    el.innerHTML = `<div class="bo-page">${BO.head('Chantiers', `${rows.length} chantier${rows.length > 1 ? 's' : ''} · contrats ${chfK(sumC)} HT`, `<button class="btn" data-map="site:hq">${UI.icon('map', 16)}Vue carte</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouveau chantier</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Volume contrats', v: chfK(sumC), s: 'HT, chantiers sélectionnés', icon: 'invoice', cls: 'hero' })}
        ${BO.kpi({ lb: 'Coûts engagés', v: chfK(sumS), s: `sur ${chfK(sumB)} de budget (${BO.pct(sumB ? sumS / sumB : 0)})`, icon: 'coins' })}
        ${BO.kpi({ lb: 'Avancement pondéré', v: BO.pct(wProg), s: 'pondéré par le budget', icon: 'chart' })}
        ${BO.kpi({ lb: 'Marge à terminaison', v: chfK(sumM), s: BO.pct(sumC ? sumM / sumC : 0, 1) + ' du contrat', icon: 'percent', cls: sumM / (sumC || 1) < .08 ? 'amber' : 'green' })}
      </div>
      <div class="toolbar">${BO.seg('status', [['actifs', 'Actifs', all.filter(s => s.status !== 'Terminé').length], ['termines', 'Terminés', all.filter(s => s.status === 'Terminé').length], ['tous', 'Tous', all.length]], st.status)}<span class="sp"></span>${BO.seg('view', [['cards', BO.icon('grid', 15) + 'Cartes'], ['table', BO.xi('list', 15) + 'Tableau']], st.view)}</div>
      <div data-body></div></div>`;
    const body = el.querySelector('[data-body]');
    if (st.view === 'cards') body.innerHTML = rows.length ? `<div class="site-grid">${rows.map(BO.siteCard).join('')}</div>` : `<div class="card">${BO.empty('crane', 'Aucun chantier', 'Créez votre premier chantier pour le suivre ici et sur la carte.', '<button class="btn pri" data-new>Nouveau chantier</button>')}</div>`;
    else BO.table(body, {
      state: st.tbl, rows, onRow: s => APP.open('sites', { id: s.id }),
      cols: [
        { k: 'name', label: 'Chantier', render: s => `<div class="who"><span class="sc-ic" style="width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;background:${s.color}">${BO.siteIcon(s)}</span><div><div class="t1">${esc(s.name)}</div><div class="t2">${esc(s.code)} · ${esc(s.city)}</div></div></div>` },
        { k: 'client', label: 'Maître d’ouvrage', get: s => BO.clientName(s.clientId), render: s => esc(BO.clientName(s.clientId)) },
        { k: 'phase', label: 'Phase', render: s => `<span class="sm-t">${esc(s.phase)}</span>` },
        { k: 'foreman', label: 'Chef', get: s => BO.empName(s.foremanId), render: s => { const e = VX.emp(s.foremanId); return e ? `<span class="row" style="gap:7px" data-open-emp="${e.id}">${UI.avatar(e, 24)}${esc(e.first)}</span>` : '—'; } },
        { k: 'progress', label: 'Avancement', num: true, render: s => BO.prog(s.progress) },
        { k: 'contract', label: 'Contrat HT', num: true, get: s => BO.siteFin(s.id).contract, render: s => chfK(BO.siteFin(s.id).contract) },
        { k: 'spent', label: 'Engagé', num: true, render: s => chfK(s.spent) },
        { k: 'margin', label: 'Marge EAC', num: true, get: s => BO.siteFin(s.id).margin, render: s => { const m = BO.siteFin(s.id).margin; return `<b class="${m < .05 ? 'bad-t' : m < .09 ? 'warn-t' : 'ok-t'}">${BO.pct(m, 1)}</b>`; } },
        { k: 'end', label: 'Fin prévue', render: s => `${BO.dateS(s.end)}<div class="t2">${BO.inDays(s.end)}</div>` },
        { k: 'status', label: 'Statut', render: s => UI.statusChip(s.status) },
      ],
    });
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelectorAll('[data-new]').forEach(b => b.addEventListener('click', () => BO.siteForm()));
  }

  /* ---------------- détail ---------------- */
  const TABS = [['overview', 'Vue d’ensemble'], ['tasks', 'Tâches'], ['team', 'Équipe'], ['gantt', 'Planning'], ['fin', 'Finances'], ['journal', 'Journal'], ['docs', 'Documents'], ['safety', 'Sécurité']];
  function renderDetail(el, p) {
    const s = VX.site(p.id);
    if (!s) { el.innerHTML = `<div class="bo-page">${BO.empty('crane', 'Chantier introuvable', 'Il a peut-être été supprimé.', '<button class="btn" data-open="sites">Retour à la liste</button>')}</div>`; return; }
    const tab = p.tab || 'overview', k = VX.siteKpis(s.id), S = VX.S;
    const nInc = S.incidents.filter(x => x.siteId === s.id && x.status !== 'Clos').length;
    const counts = { tasks: [k.open, k.blocked ? 'red' : ''], team: [k.staff], journal: [S.journal.filter(j => j.siteId === s.id).length], docs: [S.documents.filter(d => d.siteId === s.id).length], safety: [nInc || '', 'red'], fin: [S.invoices.filter(i => i.siteId === s.id && i.status !== 'Payée').length || ''] };
    const isHq = s.id === 'hq';
    el.innerHTML = `<div class="bo-page">${BO.head(`<span class="sc-ic" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:#fff;background:${s.color}">${BO.siteIcon(s)}</span>${esc(s.name)} ${UI.statusChip(s.status)}`,
      `${esc(s.code)} · ${esc(VX.SITE_TYPES[s.type].label)} · ${esc(s.city)}${s.clientId ? ' · ' + esc(BO.clientName(s.clientId)) : ''} · <b class="tq-t">${esc(s.phase)}</b>`,
      `${BO.mapBtn('site', s.id, 'Voir sur la carte', '')}${isHq ? '' : `<button class="btn" data-edit>${UI.icon('edit', 16)}Modifier</button><button class="btn pri" data-newtask>${UI.icon('plus', 16)}Nouvelle tâche</button>`}`,
      BO.crumb([['Chantiers', 'sites'], [s.name]]))}
      ${BO.tabs(TABS.map(([v, l]) => [v, l, (counts[v] || [])[0], (counts[v] || [])[1]]), tab)}
      <div data-tabbody></div></div>`;
    const body = el.querySelector('[data-tabbody]');
    ({ overview, tasks, team, gantt, fin, journal, docs, safety })[tab](body, s, p);
    BO.bindTabs(el, t => { p.tab = t; APP.refresh(); });
    const ed = el.querySelector('[data-edit]'); if (ed) ed.addEventListener('click', () => BO.siteForm(s.id));
    const nt = el.querySelector('[data-newtask]'); if (nt) nt.addEventListener('click', () => BO.taskForm(s.id));
  }

  /* ---- vue d'ensemble ---- */
  function overview(body, s) {
    const f = BO.siteFin(s.id), k = VX.siteKpis(s.id), cl = VX.client(s.clientId), cond = VX.emp(s.conductorId), chef = VX.emp(s.foremanId);
    const cfc = s.cfc || [];
    const al = VX.alerts().filter(a => a.siteId === s.id);
    const daysLeft = s.end ? diffDays(today(), s.end) : null;
    if (s.id === 'hq') {
      body.innerHTML = `<div class="g g2"><div class="card pad"><h2 class="sec">Siège & dépôt</h2><p class="note-box">${esc(s.desc)}</p><dl class="kv mt"><dt>Adresse</dt><dd>${esc(VX.S.company.address)}</dd><dt>Personnel présent</dt><dd>${k.staff}</dd><dt>Machines au dépôt</dt><dd>${VX.S.equipment.filter(m => m.siteId === 'hq').length}</dd></dl></div><div class="card"><div class="card-h"><h3>Alertes</h3></div><div class="todo-list" data-tl>${BO.todoHtml(BO.todo().filter(a => a.siteId === 'hq'))}</div></div></div>`;
      BO.bindTodo(body.querySelector('[data-tl]')); return;
    }
    body.innerHTML = `
      <div class="kpis">
        ${BO.kpi({ lb: 'Avancement', v: BO.pct(s.progress), s: `temps écoulé ${BO.pct(f.elapsed)} · <span class="delta ${f.schedule < -0.03 ? 'neg' : ''}">${f.schedule >= 0 ? '+' : ''}${BO.num(f.schedule * 100, 0)} pt</span>`, icon: 'chart', cls: 'hero' })}
        ${BO.kpi({ lb: 'Contrat HT', v: chfK(f.contract), s: `facturé ${chfK(f.billed)} (${BO.pct(f.contract ? f.billed / f.contract : 0)})`, icon: 'invoice' })}
        ${BO.kpi({ lb: 'Coûts engagés', v: chfK(s.spent), s: `budget ${chfK(s.budget)} · <span class="delta ${f.cv < 0 ? 'neg' : ''}">${f.cv >= 0 ? '+' : ''}${chfK(f.cv)}</span>`, icon: 'coins', cls: f.cv < 0 ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Marge à terminaison', v: BO.pct(f.margin, 1), s: `coût final estimé ${chfK(f.eac)}`, icon: 'percent', cls: f.margin < .06 ? 'red' : f.margin < .09 ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Équipe', v: k.present + '<small>/ ' + k.staff + '</small>', s: `${k.open} tâches ouvertes${k.blocked ? ` · <span class="bad-t b">${k.blocked} bloquée</span>` : ''}`, icon: 'users', go: 'sites:' + s.id + ':team' })}
        ${BO.kpi({ lb: 'Fin prévue', v: daysLeft != null ? daysLeft + '<small>jours</small>' : '—', s: BO.date(s.end), icon: 'calendar' })}
      </div>
      <div class="g g-main2">
        <div class="card"><div class="card-h"><h3>${UI.icon('layers', 18)}Budget par code CFC</h3><button class="btn sm" data-prog>${UI.icon('edit', 14)}Mettre à jour l’avancement</button></div><div data-cfc style="padding:0 6px 6px"></div></div>
        <div style="display:flex;flex-direction:column;gap:16px">
          <div class="card pad"><h2 class="sec">${UI.icon('building', 18)}Fiche chantier</h2>
            <dl class="kv"><dt>Maître d’ouvrage</dt><dd>${cl ? `<a class="lnk" data-open="clients:${cl.id}">${esc(cl.name)}</a><div class="xs-t muted">${esc(cl.contact)} · ${esc(cl.phone)}</div>` : '—'}</dd>
            <dt>Conducteur·rice</dt><dd>${cond ? `<span class="row" style="gap:7px;cursor:pointer" data-open-emp="${cond.id}">${UI.avatar(cond, 22)}${esc(cond.name)}</span>` : '—'}</dd>
            <dt>Chef de chantier</dt><dd>${chef ? `<span class="row" style="gap:7px;cursor:pointer" data-open-emp="${chef.id}">${UI.avatar(chef, 22)}${esc(chef.name)}</span>` : '—'}</dd>
            <dt>Période</dt><dd>${BO.date(s.start)} → ${BO.date(s.end)}</dd><dt>Phase</dt><dd>${esc(s.phase)}</dd></dl>
            ${s.desc ? `<div class="note-box mt">${esc(s.desc)}</div>` : ''}</div>
          <div class="card"><div class="card-h"><h3>${UI.icon('bell', 18)}À traiter sur ce chantier <small>${al.length}</small></h3></div><div class="todo-list" data-tl>${BO.todoHtml(BO.todo().filter(a => a.siteId === s.id), 6)}</div></div>
        </div>
      </div>`;
    BO.table(body.querySelector('[data-cfc]'), {
      cls: 'compact', rows: cfc, state: {},
      cols: [
        { k: 'code', label: 'CFC', render: c => `<span class="code">${esc(c.code)}</span>` },
        { k: 'label', label: 'Lot', render: c => `<b>${esc(c.label)}</b>` },
        { k: 'budget', label: 'Budget', num: true, render: c => chf(c.budget) },
        { k: 'spent', label: 'Engagé', num: true, render: c => chf(c.spent) },
        { k: 'use', label: 'Consommation', get: c => c.budget ? c.spent / c.budget : 0, render: c => { const u = c.budget ? c.spent / c.budget : 0; return BO.prog(u, u > 1 ? 'red' : u > .9 ? 'amber' : ''); } },
        { k: 'gap', label: 'Reste', num: true, get: c => c.budget - c.spent, render: c => `<span class="${c.budget - c.spent < 0 ? 'bad-t b' : ''}">${chf(c.budget - c.spent)}</span>` },
      ],
      foot: rows => `<td colspan="2">Total</td><td class="num">${chf(rows.reduce((a, c) => a + c.budget, 0))}</td><td class="num">${chf(rows.reduce((a, c) => a + c.spent, 0))}</td><td></td><td class="num">${chf(rows.reduce((a, c) => a + c.budget - c.spent, 0))}</td>`,
    });
    BO.bindTodo(body.querySelector('[data-tl]'));
    body.querySelector('[data-prog]').addEventListener('click', () => progressForm(s));
  }
  function progressForm(s) {
    BO.formModal({
      title: 'Avancement – ' + s.name,
      intro: `<div class="form-note">${BO.icon('sparkles', 17)}<div>L’avancement physique alimente les situations de travaux (avancement × contrat − déjà facturé) et la carte.</div></div>`,
      fields: [
        { k: 'progress', label: 'Avancement physique (%)', type: 'number', min: 0, max: 100, step: 1, req: true },
        { k: 'spent', label: 'Coûts engagés à date (CHF)', type: 'number', min: 0, step: 100, req: true },
        { k: 'phase', label: 'Phase en cours', full: true },
      ],
      values: { progress: Math.round(s.progress * 100), spent: s.spent, phase: s.phase },
      onSubmit: v => { VX.upsert('sites', { id: s.id, progress: v.progress / 100, spent: v.spent, phase: v.phase }, 'site'); VX.log('Avancement ' + s.name + ' : ' + v.progress + ' %', 'note', s.id); VX.save(); UI.toast('Avancement mis à jour', s.name + ' · ' + v.progress + ' %', 'ok', 'check'); },
    });
  }

  /* ---- tâches (kanban) ---- */
  const COLS = [['todo', 'À faire', '#9fb3b0'], ['doing', 'En cours', '#0fb5ab'], ['blocked', 'Bloquée', '#e5484d'], ['done', 'Terminée', '#1f9d55']];
  BO.kanbanTasks = (body, tasks, opts = {}) => {
    body.innerHTML = `<div class="kanban">${COLS.map(([k, l, c]) => { const ts = tasks.filter(t => t.status === k); return `<div class="kcol" data-col="${k}"><div class="kcol-h"><i class="dot-s" style="background:${c}"></i>${l}<span class="n">${ts.length}</span><span class="amt">${BO.num(ts.reduce((a, t) => a + t.plannedH, 0))} h</span></div>${ts.length ? ts.map(t => taskCard(t, c, opts)).join('') : '<div class="kempty">Glissez une tâche ici</div>'}</div>`; }).join('')}</div>`;
    let dragId = null;
    body.querySelectorAll('.kcard').forEach(c => {
      c.addEventListener('dragstart', e => { dragId = c.dataset.id; BO.dragging = true; c.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', dragId); });
      c.addEventListener('dragend', () => { BO.dragging = false; c.classList.remove('dragging'); body.querySelectorAll('.kcol').forEach(k => k.classList.remove('over')); });
      c.addEventListener('click', e => { if (e.target.closest('[data-as],[data-open-emp]')) return; BO.taskDrawer(c.dataset.id); });
    });
    body.querySelectorAll('.kcol').forEach(col => {
      col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
      col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
      col.addEventListener('drop', e => {
        e.preventDefault(); col.classList.remove('over'); BO.dragging = false;
        const id = e.dataTransfer.getData('text/plain') || dragId, t = VX.task(id), to = col.dataset.col; if (!t || t.status === to) return;
        if (to === 'blocked') {
          BO.formModal({ title: 'Bloquer « ' + t.title + ' »', fields: [{ k: 'notes', label: 'Motif du blocage', type: 'textarea', req: true, full: true, ph: 'ex. attente plans indice D, livraison acier…' }], values: { notes: t.notes }, submit: 'Bloquer la tâche',
            onSubmit: v => { VX.upsert('tasks', { id: t.id, notes: v.notes }, 'task'); VX.setTaskStatus(t.id, 'blocked'); UI.toast('Tâche bloquée', t.title, 'warn'); } });
          return;
        }
        VX.setTaskStatus(id, to);
        UI.toast(to === 'done' ? 'Tâche terminée' : 'Statut mis à jour', t.title + ' → ' + VX.TASK_STATUS[to], to === 'done' ? 'ok' : 'info', to === 'done' ? 'trophy' : 'check');
        if (to === 'doing' && !t.assignees.length) setTimeout(() => UI.toast('Personne n’est affecté', 'Cliquez sur « + » pour affecter une équipe.', 'warn'), 400);
        BO.now();
      });
    });
    body.querySelectorAll('[data-as]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const t = VX.task(b.dataset.as); BO.pickEmployee({ siteId: t.siteId, taskId: t.id, onPick: eid => { if (VX.assign(eid, t.id)) { UI.toast('Affecté·e', BO.empName(eid) + ' → ' + t.title, 'ok', 'check'); BO.now(); } } }); }));
  };
  function taskCard(t, c, opts) {
    const late = t.status !== 'done' && diffDays(today(), t.end) < 0;
    return `<div class="kcard" draggable="true" data-id="${t.id}" style="border-left-color:${t.priority === 'haute' ? 'var(--red)' : c}">
      <div class="kt">${esc(t.title)}</div>
      <div class="km">${opts.showSite ? `<span class="tag" style="background:${VX.site(t.siteId).color}22;color:var(--ink)">${esc(VX.site(t.siteId).code)}</span>` : ''}<span class="tag">CFC ${esc(t.cfc)}</span>${t.priority === 'haute' ? '<span class="chip red" style="height:20px">Haute</span>' : ''}<span class="${late ? 'bad-t' : ''}">${UI.icon('calendar', 13)} ${BO.dateS(t.end)}</span></div>
      ${t.status === 'blocked' && t.notes ? `<div class="xs-t bad-t mt" style="margin-top:6px">${esc(t.notes)}</div>` : ''}
      <div style="margin-top:9px">${BO.prog(t.progress, t.status === 'blocked' ? 'red' : '')}</div>
      <div class="kf">${BO.avs(t.assignees, 26, 4)}${t.status !== 'done' ? `<button class="add-as" data-as="${t.id}" title="Affecter">${UI.icon('plus', 14)}</button>` : ''}<span class="sp"></span><span class="xs-t muted b">${BO.num(t.doneH)} / ${BO.num(t.plannedH)} h</span></div></div>`;
  }
  function tasks(body, s) {
    const ts = VX.siteTasks(s.id);
    body.innerHTML = `<div class="toolbar"><span class="muted sm-t">${ts.length} tâches · ${BO.num(ts.reduce((a, t) => a + t.doneH, 0))} h réalisées sur ${BO.num(ts.reduce((a, t) => a + t.plannedH, 0))} h prévues · glissez les cartes pour changer de statut</span><span class="sp"></span><button class="btn pri" data-nt>${UI.icon('plus', 16)}Nouvelle tâche</button></div><div data-k></div>`;
    BO.kanbanTasks(body.querySelector('[data-k]'), ts);
    body.querySelector('[data-nt]').addEventListener('click', () => BO.taskForm(s.id));
  }

  /* ---- équipe ---- */
  function team(body, s) {
    const S = VX.S, staff = VX.siteStaff(s.id), away = S.employees.filter(e => e.homeSiteId === s.id && e.siteId !== s.id);
    const ws = U.weekStart(today()), ts = VX.siteTasks(s.id).filter(t => t.status !== 'done');
    const wkH = id => S.timesheets.filter(t => t.empId === id && t.date >= ws).reduce((a, t) => a + t.hours, 0);
    body.innerHTML = `<div class="toolbar"><span class="muted sm-t">${staff.length} personne${staff.length > 1 ? 's' : ''} actuellement sur le chantier${away.length ? ` · ${away.length} de l’équipe d’origine ailleurs` : ''}</span><span class="sp"></span><button class="btn pri" data-add>${UI.icon('plus', 16)}Ajouter du personnel</button></div><div data-t></div>
      ${away.length ? `<h2 class="sec mt2">Équipe d’origine détachée ailleurs</h2><div class="card">${away.map(e => `<div class="row" style="padding:10px 16px;border-top:1px solid var(--line)">${BO.empCell(e)}<span class="sp"></span>${BO.pillSite(e.siteId)}<button class="btn sm" data-back="${e.id}">${BO.xi('swap', 14)}Rappeler sur ${esc(s.code)}</button></div>`).join('')}</div>` : ''}`;
    BO.table(body.querySelector('[data-t]'), {
      rows: staff, state: {},
      empty: BO.empty('users', 'Personne sur ce chantier', 'Ajoutez du personnel depuis le pool disponible.', '', true),
      cols: [
        { k: 'name', label: 'Collaborateur', get: e => e.last, render: e => BO.empCell(e) },
        { k: 'role', label: 'Métier', get: e => VX.roleLabel(e.role), render: e => `<span class="tag" style="background:${e.color}1f;color:var(--ink)">${esc(VX.roleLabel(e.role))}</span>` },
        { k: 'task', label: 'Tâche', nosort: true, render: e => e.status === 'absent' ? '<span class="muted">—</span>' : `<select class="inp sm" data-task="${e.id}" style="max-width:260px">${BO.opts(ts.map(t => [t.id, t.title]), e.taskId, '— sans tâche —')}</select>` },
        { k: 'status', label: 'Statut', render: e => e.status === 'absent' ? `<span class="chip red" title="${esc(e.absence || '')}">Absent·e</span>` : '<span class="chip green">Présent·e</span>' },
        { k: 'h', label: 'Heures sem.', num: true, get: e => wkH(e.id), render: e => BO.h(wkH(e.id)) },
        { k: 'a', label: '', nosort: true, render: e => `<div class="row" style="gap:4px;justify-content:flex-end"><button class="btn sm" data-re="${e.id}">${BO.xi('swap', 14)}Réaffecter</button><button class="icon-btn" title="Voir sur la carte" data-map="employee:${e.id}">${UI.icon('map', 16)}</button></div>` },
      ],
    });
    body.querySelectorAll('[data-task]').forEach(sel => sel.addEventListener('change', () => { const e = sel.dataset.task; if (sel.value) { if (VX.assign(e, sel.value)) UI.toast('Affectation modifiée', BO.empName(e) + ' → ' + VX.task(sel.value).title, 'ok', 'check'); } else VX.unassign(e); sel.blur(); BO.now(); }));
    body.querySelectorAll('[data-re]').forEach(b => b.addEventListener('click', () => BO.reassign(b.dataset.re)));
    body.querySelectorAll('[data-back]').forEach(b => b.addEventListener('click', () => { VX.moveTo(b.dataset.back, s.id); UI.toast('Retour sur le chantier', BO.empName(b.dataset.back) + ' → ' + s.name, 'ok', 'check'); }));
    body.querySelector('[data-add]').addEventListener('click', () => BO.pickEmployee({ title: 'Ajouter sur ' + s.name, siteId: s.id, onPick: id => {
      const open = VX.siteTasks(s.id).filter(t => t.status !== 'done');
      if (!open.length) { VX.moveTo(id, s.id); UI.toast('Ajouté·e à l’équipe', BO.empName(id) + ' → ' + s.name, 'ok', 'check'); return; }
      UI.modal({ title: 'Sur quelle tâche ? <small class="muted" style="font-size:14px;font-weight:600">· ' + esc(BO.empName(id)) + '</small>',
        body: `<div class="mini-list">${open.map(t => `<div data-tk="${t.id}" style="cursor:pointer">${UI.statusChip(t.status)}<div style="flex:1"><b>${esc(t.title)}</b><div class="xs-t muted">CFC ${esc(t.cfc)} · ${t.assignees.length} pers.</div></div><span class="btn sm">Choisir</span></div>`).join('')}<div data-tk="" style="cursor:pointer"><span class="chip grey">Sans tâche</span><div style="flex:1" class="muted">Juste l’envoyer sur le chantier</div><span class="btn sm">Choisir</span></div></div>`,
        onMount: (m, close) => m.addEventListener('click', ev => { const r = ev.target.closest('[data-tk]'); if (!r) return; close(); if (r.dataset.tk) VX.assign(id, r.dataset.tk); else VX.moveTo(id, s.id); UI.toast('Ajouté·e à l’équipe', BO.empName(id) + ' → ' + s.name, 'ok', 'check'); }) });
    } }));
  }

  /* ---- planning (Gantt) ---- */
  function gantt(body, s) {
    const ts = VX.siteTasks(s.id).slice().sort((a, b) => a.start.localeCompare(b.start) || a.end.localeCompare(b.end));
    if (!ts.length) { body.innerHTML = `<div class="card">${BO.empty('calendar', 'Aucune tâche planifiée', 'Créez des tâches pour construire le planning.', '<button class="btn pri" data-nt>Nouvelle tâche</button>')}</div>`; body.querySelector('[data-nt]').onclick = () => BO.taskForm(s.id); return; }
    const t0 = today();
    let from = ts.reduce((m, t) => t.start < m ? t.start : m, addDays(t0, -7)); from = U.weekStart(from);
    let to = ts.reduce((m, t) => t.end > m ? t.end : m, addDays(t0, 21));
    const n = diffDays(from, to) + 2, days = Array.from({ length: n }, (_, i) => addDays(from, i));
    const pct = d => diffDays(from, d) / n * 100;
    const COL = { todo: '#9fb3b0', doing: '#0fb5ab', blocked: '#e5484d', done: '#1f9d55' };
    const dayHdr = days.map(d => { const dt = U.parse(d), we = dt.getDay() % 6 === 0; return `<div class="${we ? 'we' : ''} ${dt.getDay() === 1 ? 'mon' : ''}" title="${BO.date(d)}">${dt.getDate()}${n < 45 ? '<br>' + BO.dayName(d)[0] : ''}</div>`; }).join('');
    const bgDays = days.map(d => { const dt = U.parse(d); return `<div class="${dt.getDay() % 6 === 0 ? 'we' : ''} ${dt.getDay() === 1 ? 'mon' : ''}"></div>`; }).join('');
