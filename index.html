    body.innerHTML = `<div class="toolbar"><span class="legend">${Object.entries(VX.TASK_STATUS).map(([k, l]) => `<span><i style="background:${COL[k]}"></i>${l}</span>`).join('')}</span><span class="sp"></span><span class="muted sm-t">Glissez une barre pour décaler la tâche · bord droit pour la prolonger</span><button class="btn pri sm" data-nt>${UI.icon('plus', 14)}Tâche</button></div>
      <div class="gantt"><div class="gh"><div class="gl"><b>Tâche</b></div><div class="gt"><div class="days">${dayHdr}</div></div></div>
      ${ts.map(t => `<div class="gr"><div class="gl" data-open-task="${t.id}" style="cursor:pointer"><div class="t1">${esc(t.title)}</div><div class="t2">CFC ${esc(t.cfc)} · ${t.assignees.length} pers. · ${BO.num(t.doneH)}/${BO.num(t.plannedH)} h</div></div><div class="gt" style="height:42px"><div class="days">${bgDays}</div>
        <div class="gb" data-gb="${t.id}" style="left:${pct(t.start)}%;width:${(diffDays(t.start, t.end) + 1) / n * 100}%;background:${COL[t.status]}" title="${esc(t.title)} · ${BO.dateS(t.start)} → ${BO.dateS(t.end)}"><i style="width:${t.progress * 100}%"></i><span>${Math.round(t.progress * 100)}% ${esc(t.title)}</span></div></div></div>`).join('')}
      ${s.end ? `<div class="gr"><div class="gl"><div class="t1">🏁 Fin contractuelle</div><div class="t2">${BO.date(s.end)}</div></div><div class="gt" style="height:34px"><div class="days">${bgDays}</div>${s.end <= to ? `<div style="position:absolute;top:8px;left:calc(${pct(s.end)}% - 9px);width:18px;height:18px;background:var(--ink);transform:rotate(45deg);border-radius:3px"></div>` : `<span class="xs-t muted" style="position:absolute;right:8px;top:10px">→ ${BO.dateS(s.end)}</span>`}</div></div>` : ''}
      </div>`;
    const g = body.querySelector('.gantt'), hdr = g.querySelector('.gh .gt');
    if (t0 >= from && t0 <= to) g.querySelectorAll('.gr .gt, .gh .gt').forEach((x, i) => x.insertAdjacentHTML('beforeend', `<div class="today ${x.closest('.gh') ? '' : 'nl'}" style="left:${pct(t0) + 50 / n}%"></div>`));
    body.querySelector('[data-nt]').onclick = () => BO.taskForm(s.id);
    // glisser-déposer des barres
    g.querySelectorAll('[data-gb]').forEach(bar => bar.addEventListener('mousedown', e => {
      e.preventDefault();
      const t = VX.task(bar.dataset.gb), track = bar.parentElement, w = track.getBoundingClientRect().width, dayW = w / n;
      const r = bar.getBoundingClientRect(), resize = e.clientX > r.right - 10, x0 = e.clientX, l0 = parseFloat(bar.style.left), w0 = parseFloat(bar.style.width);
      let dd = 0; BO.dragging = true; bar.classList.add('dragging');
      const mv = ev => { dd = Math.round((ev.clientX - x0) / dayW); if (resize) bar.style.width = Math.max(100 / n, w0 + dd * 100 / n) + '%'; else bar.style.left = (l0 + dd * 100 / n) + '%'; };
      const up = () => {
        document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); BO.dragging = false; bar.classList.remove('dragging');
        if (!dd) { BO.taskDrawer(t.id); return; }
        const ns = resize ? t.start : addDays(t.start, dd), ne = resize ? (addDays(t.end, dd) < t.start ? t.start : addDays(t.end, dd)) : addDays(t.end, dd);
        VX.upsert('tasks', { id: t.id, start: ns, end: ne }, 'task');
        UI.toast('Planning modifié', `${t.title} : ${BO.dateS(ns)} → ${BO.dateS(ne)}`, 'ok', 'calendar'); BO.now();
      };
      document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
    }));
    g.querySelectorAll('[data-gb]').forEach(bar => bar.addEventListener('mousemove', e => { const r = bar.getBoundingClientRect(); bar.style.cursor = e.clientX > r.right - 10 ? 'ew-resize' : 'grab'; }));
  }

  /* ---- finances ---- */
  function fin(body, s) {
    const S = VX.S, f = BO.siteFin(s.id);
    const orders = S.orders.filter(o => o.siteId === s.id), eq = S.equipment.filter(m => m.siteId === s.id);
    const ws = U.weekStart(today());
    const labour = S.timesheets.filter(t => t.siteId === s.id && t.date >= ws).reduce((a, t) => { const e = VX.emp(t.empId); return a + t.hours * (e ? VX.ROLES[e.role].rate : 80); }, 0);
    const max = Math.max(f.contract, s.budget, f.committed) * 1.05 || 1;
    const bars = [['Contrat HT', f.contract, '#076b65'], ['Budget coûts', s.budget, '#5fd6cd'], ['Coûts engagés + commandes', f.committed, '#e8930c'], ['Valeur acquise (avancement)', f.earned, '#3b82f6'], ['Facturé HT', f.billed, '#0fb5ab'], ['Encaissé (factures suivies)', f.paid, '#1f9d55']];
    body.innerHTML = `<div class="kpis">
        ${BO.kpi({ lb: 'Contrat HT', v: chfK(f.contract), s: 'prix de vente', icon: 'invoice', cls: 'hero' })}
        ${BO.kpi({ lb: 'Engagé', v: chfK(f.committed), s: `dont ${chfK(f.openOrders)} de commandes ouvertes`, icon: 'coins' })}
        ${BO.kpi({ lb: 'Facturé HT', v: chfK(f.billed), s: BO.pct(f.contract ? f.billed / f.contract : 0) + ' du contrat', icon: 'invoice' })}
        ${BO.kpi({ lb: 'Reste à facturer', v: chfK(f.toBill), s: 'travaux exécutés non facturés', icon: 'alert', cls: f.toBill > f.contract * .08 ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Main-d’œuvre semaine', v: chfK(labour), s: 'heures pointées × taux', icon: 'clock' })}
      </div>
      <div class="g g2">
        <div class="card pad"><h2 class="sec">${UI.icon('chart', 18)}Budget vs engagé vs facturé</h2>
          ${bars.map(([l, v, c]) => `<div style="margin:10px 0"><div class="row sm-t" style="margin-bottom:5px"><b>${l}</b><span class="sp"></span><span class="tnum b">${chf(v)}</span></div><div class="bar" style="height:12px"><i style="width:${v / max * 100}%;background:${c}"></i></div></div>`).join('')}
          <div class="form-note mt">${BO.icon('sparkles', 17)}<div>Coût final estimé : <b>${chf(f.eac)}</b> → marge à terminaison <b>${chf(f.contract - f.eac)}</b> (${BO.pct(f.margin, 1)}).</div></div></div>
        <div class="card"><div class="card-h"><h3>${UI.icon('invoice', 18)}Situations & factures</h3><button class="btn pri sm" data-sit>${UI.icon('plus', 14)}Nouvelle situation</button></div><div data-inv style="padding:0 6px 6px"></div></div>
      </div>
      <div class="g g2 mt">
        <div class="card"><div class="card-h"><h3>${UI.icon('truck', 18)}Commandes</h3><button class="btn sm" data-ord>${UI.icon('plus', 14)}Commander</button></div><div data-ord-t style="padding:0 6px 6px"></div></div>
        <div class="card"><div class="card-h"><h3>${UI.icon('excavator', 18)}Machines sur le chantier</h3><small class="muted b">${chf(eq.reduce((a, m) => a + m.dayRate, 0))} / jour</small></div><div data-eq style="padding:0 6px 6px"></div></div>
      </div>`;
    BO.table(body.querySelector('[data-inv]'), { cls: 'compact', rows: f.inv, state: { sort: 'date', dir: 'desc' }, onRow: i => APP.open('invoices', { id: i.id }), empty: BO.empty('invoice', 'Aucune facture', 'Préparez la première situation de travaux.', '', true), cols: [
      { k: 'no', label: 'N°', render: i => `<b>${esc(i.no)}</b><div class="t2">${esc(i.label)}</div>` }, { k: 'date', label: 'Date', render: i => BO.dateS(i.date) },
      { k: 'amount', label: 'TTC', num: true, render: i => chf(i.amount) }, { k: 'status', label: 'Statut', render: i => UI.statusChip(i.status) }] });
    BO.table(body.querySelector('[data-ord-t]'), { cls: 'compact', rows: orders, state: { sort: 'delivery' }, onRow: o => APP.open('purchasing', { id: o.id }), empty: BO.empty('truck', 'Aucune commande', '', '', true), cols: [
      { k: 'label', label: 'Commande', render: o => `<b>${esc(o.label)}</b><div class="t2">${esc(o.no)} · ${esc((VX.supplier(o.supplierId) || {}).name || '')}</div>` }, { k: 'delivery', label: 'Livraison', render: o => BO.dateS(o.delivery) },
      { k: 'amount', label: 'Montant', num: true, render: o => chf(o.amount) }, { k: 'status', label: 'Statut', render: o => UI.statusChip(o.status) }] });
    BO.table(body.querySelector('[data-eq]'), { cls: 'compact', rows: eq, state: {}, onRow: m => APP.open('equipment', { id: m.id }), empty: BO.empty('excavator', 'Aucune machine', '', '', true), cols: [
      { k: 'name', label: 'Machine', render: m => `<b>${esc(m.name)}</b><div class="t2">${esc(m.type)} · ${esc(m.plate)}</div>` }, { k: 'status', label: 'Statut', render: m => UI.statusChip(m.status) },
      { k: 'dayRate', label: 'Tarif / j', num: true, render: m => chf(m.dayRate) }, { k: 'month', label: '≈ / mois', num: true, get: m => m.dayRate * 21, render: m => chf(m.dayRate * 21) }] });
    body.querySelector('[data-sit]').addEventListener('click', () => BO.newSituation(s.id));
    body.querySelector('[data-ord]').addEventListener('click', () => BO.orderForm(null, { siteId: s.id }));
  }

  /* ---- journal / documents / sécurité (composants des modules dédiés) ---- */
  function journal(body, s) { BO.journalSite(body, s.id); }
  function docs(body, s) { BO.docsSite(body, s.id); }
  function safety(body, s) { BO.safetySite(body, s.id); }

  function render(el, p) {
    if (p.id && VX.site(p.id)) renderDetail(el, p);
    else if (p.id === 'new') { renderList(el, {}); p.id = null; BO.siteForm(); }
    else renderList(el, p);
  }
  APP.register({ id: 'sites', label: 'Chantiers', icon: 'crane', group: 'Chantiers', order: 10, render, badge: () => VX.S.tasks.filter(t => t.status === 'blocked').length });
})();

</script>
<script>
/* ==========================================================================
   BO · Journal de chantier (tous chantiers) + composant pour la fiche chantier
   ========================================================================== */
(function () {
  const U = VX.util, { esc, today, addDays, diffDays } = U;
  const st = { site: '', period: '14', q: '' };
  const WEATHER = ['☀️ Ensoleillé', '🌤 Éclaircies', '⛅ Nuageux', '🌥 Couvert', '🌧 Pluie', '⛈ Orage', '🌨 Neige', '🌫 Brouillard', '💨 Vent fort'];

  BO.journalForm = ({ siteId, id } = {}) => {
    const S = VX.S, j = id ? S.journal.find(x => x.id === id) : null;
    const sid = j ? j.siteId : siteId || BO.activeSites()[0].id, s = VX.site(sid);
    const w = j ? j.weather : '';
    const wm = /(\S+\s[^\d-]+?)\s*(-?\d+)°/.exec(w || '');
    BO.formModal({
      title: j ? 'Modifier l’entrée du journal' : 'Nouvelle entrée de journal',
      fields: [
        { k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(false), req: true },
        { k: 'date', label: 'Date', type: 'date', req: true, validate: v => v > today() ? 'Pas de saisie dans le futur' : '' },
        { k: 'sky', label: 'Météo', type: 'select', opts: WEATHER },
        { k: 'temp', label: 'Température (°C)', type: 'number', min: -25, max: 45, step: 1 },
        { k: 'staff', label: 'Effectif présent', type: 'number', min: 0, max: 200, step: 1, req: true },
        { k: 'author', label: 'Rédigé par', type: 'select', opts: BO.optEmps(e => /chef|contremaitre|conducteur|direction/.test(e.role)) },
        { k: 'text', label: 'Travaux exécutés / observations', type: 'textarea', req: true, full: true, rows: 5, ph: 'Travaux réalisés, livraisons, visites, intempéries, instructions de la direction des travaux…' },
        { k: 'lost', label: 'Heures perdues (intempéries, attentes)', type: 'number', min: 0, max: 24, step: .5 },
      ],
      values: j ? Object.assign({}, j, { sky: wm ? wm[1].trim() : WEATHER[0], temp: wm ? +wm[2] : 15 }) : { siteId: sid, date: today(), sky: WEATHER[0], temp: 16, staff: VX.siteStaff(sid).filter(e => e.status === 'present').length, author: s && s.foremanId, lost: 0 },
      onMount: el => { const ss = el.querySelector('[name=siteId]'), sf = el.querySelector('[name=staff]'), au = el.querySelector('[name=author]'); ss.addEventListener('change', () => { sf.value = VX.siteStaff(ss.value).filter(e => e.status === 'present').length; const fs = VX.site(ss.value).foremanId; if (fs) au.value = fs; }); },
      danger: j ? { title: 'Supprimer l’entrée ?', text: 'L’entrée du ' + BO.date(j.date) + ' sera supprimée.', run: () => { VX.remove('journal', j.id, 'journal'); UI.toast('Entrée supprimée', '', 'ok'); } } : null,
      onSubmit: v => {
        const o = { id: j ? j.id : U.uid('j'), siteId: v.siteId, date: v.date, weather: v.sky + (v.temp != null ? ' ' + v.temp + '°' : ''), staff: v.staff, text: v.text, author: v.author, lost: v.lost || 0 };
        VX.upsert('journal', o, 'journal');
        if (!j) { VX.log('Journal ' + VX.site(v.siteId).code + ' du ' + U.fmtDate(v.date) + ' saisi', 'journal', v.siteId); VX.save(); }
        UI.toast('Journal enregistré', VX.site(v.siteId).name + ' · ' + BO.date(v.date), 'ok', 'book');
      },
    });
  };

  BO.journalHtml = (rows, showSite = true) => rows.length ? rows.map(j => {
    const s = VX.site(j.siteId), a = VX.emp(j.author), d = U.parse(j.date);
    return `<div class="jentry"><div class="jd"><small>${esc(BO.dayName(j.date))}</small><b>${d.getDate()}</b><small>${esc(d.toLocaleDateString(I18N.locale, { month: 'short' }))}</small><div class="jw">${esc(j.weather)}</div></div>
      <div><div class="row wrap">${showSite && s ? BO.pillSite(s.id) : ''}<span class="chip grey">${UI.icon('users', 13)} ${j.staff} pers.</span>${j.lost ? `<span class="chip amber">${BO.h(j.lost)} perdues</span>` : ''}<span class="sp"></span>${a ? `<span class="row xs-t muted" style="gap:6px">${UI.avatar(a, 20)}${esc(a.name)}</span>` : ''}<button class="icon-btn" title="Modifier" data-jedit="${j.id}">${UI.icon('edit', 15)}</button></div><p>${esc(j.text)}</p></div></div>`;
  }).join('') : BO.empty('book', 'Aucune entrée', 'Le journal de chantier n’a pas encore été rempli pour cette période.', '', true);
  const bindJ = el => el.querySelectorAll('[data-jedit]').forEach(b => b.addEventListener('click', () => BO.journalForm({ id: b.dataset.jedit })));

  BO.journalSite = (body, siteId) => {
    const rows = VX.S.journal.filter(j => j.siteId === siteId).sort((a, b) => b.date.localeCompare(a.date));
    const has = rows.some(j => j.date === today());
    body.innerHTML = `<div class="toolbar">${has ? '<span class="chip green">Journal du jour saisi</span>' : '<span class="chip amber">Journal du jour à saisir</span>'}<span class="muted sm-t">${rows.length} entrées</span><span class="sp"></span><button class="btn pri" data-nj>${UI.icon('plus', 16)}Nouvelle entrée</button></div><div class="card">${BO.journalHtml(rows, false)}</div>`;
    body.querySelector('[data-nj]').addEventListener('click', () => BO.journalForm({ siteId }));
    bindJ(body);
  };

  function render(el, p) {
    const S = VX.S, t0 = today();
    if (p.id && VX.site(p.id)) { st.site = p.id; p.id = null; }
    let rows = S.journal.slice().sort((a, b) => b.date.localeCompare(a.date) || a.siteId.localeCompare(b.siteId));
    if (st.site) rows = rows.filter(j => j.siteId === st.site);
    if (st.period !== 'all') rows = rows.filter(j => diffDays(j.date, t0) < +st.period);
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(j => (j.text + ' ' + j.weather).toLowerCase().includes(q)); }
    const sites = BO.activeSites(), missing = sites.filter(s => !S.journal.some(j => j.siteId === s.id && j.date === t0));
    const wk = S.journal.filter(j => j.date >= U.weekStart(t0));
    const rain = wk.filter(j => /Pluie|Orage|Neige/.test(j.weather)).length, lost = wk.reduce((a, j) => a + (j.lost || 0), 0);
    el.innerHTML = `<div class="bo-page">${BO.head('Journal de chantier', 'Rapports journaliers : travaux, météo, effectifs, événements', `<button class="btn" data-csv>${UI.icon('download', 16)}Export CSV</button><button class="btn pri" data-nj>${UI.icon('plus', 16)}Nouvelle entrée</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Saisis aujourd’hui', v: (sites.length - missing.length) + '<small>/ ' + sites.length + '</small>', s: missing.length ? 'manquants : ' + missing.map(s => s.code).join(', ') : 'tous les chantiers sont à jour', icon: 'book', cls: missing.length ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Entrées cette semaine', v: wk.length, s: 'tous chantiers', icon: 'calendar' })}
        ${BO.kpi({ lb: 'Jours d’intempéries', v: rain, s: 'cette semaine (pluie, orage, neige)', icon: 'sun', cls: rain ? 'amber' : '' })}
        ${BO.kpi({ lb: 'Heures perdues', v: BO.num(lost, 1) + '<small>h</small>', s: 'déclarées cette semaine', icon: 'clock' })}
      </div>
      ${missing.length ? `<div class="card pad mb"><div class="row wrap"><b>${UI.icon('bell', 16)} À saisir aujourd’hui :</b>${missing.map(s => `<button class="btn sm" data-fill="${s.id}"><i class="dot-s" style="background:${s.color}"></i>${esc(s.name)}</button>`).join('')}</div></div>` : ''}
      <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="Rechercher dans le journal…" value="${esc(st.q)}">${UI.icon('search')}</div>
        <select class="inp" data-site>${BO.opts(BO.optSites(false), st.site, 'Tous les chantiers')}</select>
        ${BO.seg('period', [['7', '7 jours'], ['14', '14 jours'], ['30', '30 jours'], ['all', 'Tout']], st.period)}<span class="sp"></span><span class="muted sm-t">${rows.length} entrée${rows.length > 1 ? 's' : ''}</span></div>
      <div class="card">${BO.journalHtml(rows)}</div></div>`;
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-site]').addEventListener('change', e => { st.site = e.target.value; APP.refresh(); });
    const q = el.querySelector('[data-q]'); let tm; q.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => { st.q = q.value; APP.refresh(); const n = BO.$('#bo-content [data-q]'); if (n) { n.focus(); n.setSelectionRange(n.value.length, n.value.length); } }, 250); });
    el.querySelector('[data-nj]').addEventListener('click', () => BO.journalForm({ siteId: st.site || undefined }));
    el.querySelectorAll('[data-fill]').forEach(b => b.addEventListener('click', () => BO.journalForm({ siteId: b.dataset.fill })));
    el.querySelector('[data-csv]').addEventListener('click', () => { BO.download('journal-chantier-' + t0 + '.csv', BO.csv([['Date', 'Chantier', 'Météo', 'Effectif', 'Heures perdues', 'Rédacteur', 'Texte']].concat(rows.map(j => [j.date, BO.siteName(j.siteId), j.weather, j.staff, j.lost || 0, BO.empName(j.author), j.text]))), 'text/csv;charset=utf-8'); UI.toast('Export prêt', rows.length + ' entrées exportées', 'ok', 'download'); });
    bindJ(el);
  }
  APP.register({ id: 'journal', label: 'Journal de chantier', icon: 'book', group: 'Chantiers', order: 11, render, badge: () => BO.activeSites().filter(s => !VX.S.journal.some(j => j.siteId === s.id && j.date === today())).length });
})();

</script>
<script>
/* ==========================================================================
   BO · GED — documents par chantier et par dossier
   ========================================================================== */
(function () {
  const U = VX.util, { esc, today } = U;
  const CATS = ['Plans', 'Autorisations', 'Contrats', 'Qualité', 'Sécurité', 'Technique'];
  const CAT_IC = { Plans: 'layers', Autorisations: 'shield', Contrats: 'file', Qualité: 'check', Sécurité: 'helmet', Technique: 'wrench' };
  const st = { site: '', cat: '', q: '', tbl: { sort: 'date', dir: 'desc' } };
  const ext = n => (/\.([a-z0-9]+)$/i.exec(n) || [, '?'])[1].toLowerCase();
  const EXT_COL = { pdf: '#e5484d', dwg: '#3b82f6', dxf: '#3b82f6', ifc: '#5b6bd6', docx: '#2b5fb3', doc: '#2b5fb3', xlsx: '#1f9d55', xls: '#1f9d55', csv: '#1f9d55', jpg: '#e8930c', jpeg: '#e8930c', png: '#e8930c', heic: '#e8930c', zip: '#6c8a88' };
  BO.fileIcon = n => { const x = ext(n); return `<span class="ficon" style="background:${EXT_COL[x] || '#7d908e'}">${esc(x.toUpperCase().slice(0, 4))}</span>`; };
  const fmtSize = b => b >= 1048576 ? (b / 1048576).toLocaleString('fr-CH', { maximumFractionDigits: 1 }) + ' Mo' : Math.max(1, Math.round(b / 1024)) + ' Ko';

  /** Téléversement : on stocke les métadonnées (nom, taille, dossier). */
  BO.uploadDocs = (siteId, cat, files) => {
    const pick = fl => {
      const list = Array.from(fl || []); if (!list.length) return;
      BO.formModal({
        title: list.length > 1 ? `Classer ${list.length} fichiers` : 'Classer le fichier',
        intro: `<div class="mini-list">${list.map(f => `<div>${BO.fileIcon(f.name)}<div style="flex:1;min-width:0"><b style="overflow-wrap:anywhere">${esc(f.name)}</b><div class="xs-t muted">${fmtSize(f.size)}</div></div></div>`).join('')}</div>`,
        fields: [{ k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(true), req: true }, { k: 'cat', label: 'Dossier', type: 'select', opts: CATS, req: true }],
        values: { siteId: siteId || st.site || BO.activeSites()[0].id, cat: cat || st.cat || (/\.(dwg|dxf|ifc)$/i.test(list[0].name) ? 'Plans' : 'Technique') },
        submit: 'Téléverser',
        onSubmit: v => {
          list.forEach(f => VX.S.documents.unshift({ id: U.uid('d'), siteId: v.siteId, name: f.name, cat: v.cat, size: fmtSize(f.size), date: today(), by: VX.S.meId }));
          VX.log(list.length + ' document' + (list.length > 1 ? 's' : '') + ' ajouté' + (list.length > 1 ? 's' : '') + ' dans ' + v.cat + ' – ' + BO.siteName(v.siteId), 'doc', v.siteId);
          VX.save(); VX.emit('documents', { siteId: v.siteId });
          UI.toast('Documents classés', list.length + ' fichier' + (list.length > 1 ? 's' : '') + ' · ' + v.cat, 'ok', 'folder');
        },
      });
    };
    if (files) { pick(files); return; }
    const inp = document.createElement('input'); inp.type = 'file'; inp.multiple = true;
    inp.addEventListener('change', () => pick(inp.files)); inp.click();
  };
  const preview = d => UI.modal({
    title: esc(d.name), body: `<div style="display:grid;grid-template-columns:200px 1fr;gap:20px;align-items:start">
      <div style="aspect-ratio:1/1.41;border-radius:12px;background:repeating-linear-gradient(0deg,#f4f8f7 0 14px,#fff 14px 28px);box-shadow:inset 0 0 0 1px var(--line2);display:grid;place-items:center">${BO.fileIcon(d.name).replace('class="ficon"', 'class="ficon" style="width:64px;height:72px;font-size:15px;background:' + (EXT_COL[ext(d.name)] || '#7d908e') + '"')}</div>
      <div><dl class="kv"><dt>Chantier</dt><dd>${esc(BO.siteName(d.siteId))}</dd><dt>Dossier</dt><dd>${esc(d.cat)}</dd><dt>Taille</dt><dd>${esc(d.size)}</dd><dt>Ajouté le</dt><dd>${BO.date(d.date)}</dd><dt>Par</dt><dd>${esc(BO.empName(d.by) === '—' ? 'Import initial' : BO.empName(d.by))}</dd><dt>Version</dt><dd>${esc(d.version || 'ind. A')}</dd></dl>
      <div class="form-note mt">${BO.icon('lock', 17)}<div>Aperçu de démonstration : seules les métadonnées sont conservées. En production, les fichiers sont stockés en Suisse (nLPD) avec historique des versions.</div></div></div></div>`,
  });
  const editDoc = d => BO.formModal({
    title: 'Modifier le document', fields: [{ k: 'name', label: 'Nom du fichier', req: true, full: true }, { k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(true) }, { k: 'cat', label: 'Dossier', type: 'select', opts: CATS }, { k: 'version', label: 'Indice / version', ph: 'ind. B' }],
    values: d, danger: { title: 'Supprimer le document ?', text: '« ' + esc(d.name) + ' » sera retiré de la GED.', run: () => { VX.remove('documents', d.id, 'documents'); UI.toast('Document supprimé', d.name, 'ok'); } },
    onSubmit: v => { VX.upsert('documents', Object.assign({ id: d.id }, v), 'documents'); UI.toast('Document mis à jour', v.name, 'ok', 'check'); },
  });
  const docTable = (host, rows, showSite = true) => BO.table(host, {
    rows, state: st.tbl, onRow: preview,
    empty: BO.empty('folder', 'Dossier vide', 'Glissez des fichiers ici ou utilisez « Téléverser ».', '', true),
    cols: [
      { k: 'name', label: 'Nom', render: d => `<div class="who">${BO.fileIcon(d.name)}<div><div class="t1">${esc(d.name)}</div><div class="t2">${esc(d.size)}${d.version ? ' · ' + esc(d.version) : ''}</div></div></div>` },
      ...(showSite ? [{ k: 'site', label: 'Chantier', get: d => BO.siteName(d.siteId), render: d => BO.pillSite(d.siteId) }] : []),
      { k: 'cat', label: 'Dossier', render: d => `<span class="tag">${UI.icon(CAT_IC[d.cat] || 'folder', 13)}&nbsp;${esc(d.cat)}</span>` },
      { k: 'date', label: 'Ajouté', render: d => BO.dateS(d.date) },
      { k: 'a', label: '', nosort: true, render: d => `<div class="row" style="gap:2px;justify-content:flex-end"><button class="icon-btn" title="Aperçu" data-pv="${d.id}">${UI.icon('eye', 16)}</button><button class="icon-btn" title="Modifier" data-ed="${d.id}">${UI.icon('edit', 16)}</button></div>` },
    ],
    after: h => {
      h.querySelectorAll('[data-pv]').forEach(b => b.addEventListener('click', () => preview(VX.S.documents.find(x => x.id === b.dataset.pv))));
      h.querySelectorAll('[data-ed]').forEach(b => b.addEventListener('click', () => editDoc(VX.S.documents.find(x => x.id === b.dataset.ed))));
    },
  });
  const bindDrop = (z, siteId, cat) => {
    z.addEventListener('click', () => BO.uploadDocs(siteId, cat));
    z.addEventListener('dragover', e => { e.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', e => { e.preventDefault(); z.classList.remove('over'); if (e.dataTransfer.files.length) BO.uploadDocs(siteId, cat, e.dataTransfer.files); });
  };

  /** composant pour la fiche chantier */
  BO.docsSite = (body, siteId) => {
    const docs = VX.S.documents.filter(d => d.siteId === siteId);
    body.innerHTML = `<div class="g g3" style="grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:16px">${CATS.map(c => { const n = docs.filter(d => d.cat === c).length; return `<div class="card pad" data-cat="${c}" style="cursor:pointer;padding:14px"><div class="row"><span class="ki" style="width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--tq-soft);color:var(--tq-dd)">${UI.icon(CAT_IC[c], 17)}</span><span class="sp"></span><b style="font-size:18px">${n}</b></div><div class="b mt" style="margin-top:8px">${c}</div></div>`; }).join('')}</div>
      <div class="dropzone mb" data-dz>${BO.xi('upload', 20)}<div>Glissez des fichiers ici ou cliquez pour téléverser</div></div><div data-t></div>`;
    docTable(body.querySelector('[data-t]'), docs.slice().sort((a, b) => b.date.localeCompare(a.date)), false);
    bindDrop(body.querySelector('[data-dz]'), siteId);
    body.querySelectorAll('[data-cat]').forEach(c => c.addEventListener('click', () => { st.site = siteId; st.cat = c.dataset.cat; APP.open('documents'); }));
  };

  function render(el, p) {
    const S = VX.S;
    if (p.id && VX.site(p.id)) { st.site = p.id; st.cat = ''; p.id = null; }
    let rows = S.documents.slice();
    if (st.site) rows = rows.filter(d => d.siteId === st.site);
    if (st.cat) rows = rows.filter(d => d.cat === st.cat);
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(d => (d.name + ' ' + d.cat + ' ' + BO.siteName(d.siteId)).toLowerCase().includes(q)); }
    const sites = S.sites;
    const tree = `<a data-s="" data-c="" class="${!st.site && !st.cat ? 'on' : ''}">${UI.icon('folder', 17)}Tous les documents<em>${S.documents.length}</em></a>` + sites.map(s => {
      const ds = S.documents.filter(d => d.siteId === s.id), open = st.site === s.id;
      return `<a data-s="${s.id}" data-c="" class="${open && !st.cat ? 'on' : ''}"><i class="dot-s" style="background:${s.color}"></i>${esc(s.id === 'hq' ? 'Siège' : s.name)}<em>${ds.length}</em></a>` + (open ? `<div class="sub">${CATS.map(c => `<a data-s="${s.id}" data-c="${c}" class="${st.cat === c ? 'on' : ''}">${UI.icon(CAT_IC[c], 15)}${c}<em>${ds.filter(d => d.cat === c).length}</em></a>`).join('')}</div>` : '');
    }).join('');
    const size = S.documents.reduce((a, d) => { const m = /([\d,]+)\s*(Mo|Ko)/.exec(d.size || ''); return a + (m ? parseFloat(m[1].replace(',', '.')) * (m[2] === 'Mo' ? 1 : 1 / 1024) : 0); }, 0);
    el.innerHTML = `<div class="bo-page">${BO.head('Documents', `GED par chantier · ${S.documents.length} fichiers · ${BO.num(size, 1)} Mo`, `<button class="btn pri" data-up>${BO.xi('upload', 16)}Téléverser</button>`)}
      <div class="g" style="grid-template-columns:260px minmax(0,1fr)">
        <div class="card pad" style="align-self:start;padding:12px"><div class="doc-tree">${tree}</div></div>
        <div style="min-width:0">
          <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="Rechercher un plan, un PV, un permis…" value="${esc(st.q)}">${UI.icon('search')}</div>
            ${BO.seg('cat', [['', 'Tous']].concat(CATS.map(c => [c, c])), st.cat)}<span class="sp"></span><span class="muted sm-t">${rows.length} fichier${rows.length > 1 ? 's' : ''}</span></div>
          <div class="dropzone mb" data-dz>${BO.xi('upload', 20)}<div>Déposez vos fichiers ici${st.site ? ' — ' + esc(BO.siteName(st.site)) : ''}${st.cat ? ' / ' + esc(st.cat) : ''}</div></div>
          <div data-t></div>
        </div></div></div>`;
    docTable(el.querySelector('[data-t]'), rows);
    el.querySelector('.doc-tree').addEventListener('click', e => { const a = e.target.closest('a[data-s]'); if (!a) return; st.site = a.dataset.s; st.cat = a.dataset.c; APP.refresh(); });
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    BO.bindSearch(el, v => st.q = v);
    el.querySelector('[data-up]').addEventListener('click', () => BO.uploadDocs(st.site, st.cat));
    bindDrop(el.querySelector('[data-dz]'), st.site, st.cat);
  }
  APP.register({ id: 'documents', label: 'Documents', icon: 'folder', group: 'Chantiers', order: 12, render });
})();

</script>
<script>
/* ==========================================================================
   BO · Planning des équipes (semaine) — chantiers × jours / employés × jours
   Données ajoutées : VX.S.plan = { 'YYYY-MM-DD': { empId: siteId } } (jours futurs)
                      VX.S.absences = [{ id, empId, type, from, to, note, status }]
   ========================================================================== */
(function () {
  const U = VX.util, { esc, today, addDays, diffDays } = U;
  const st = { view: 'sites', week: 0, site: '', role: '', office: false };
  const ABS_TYPES = ['Vacances', 'Maladie', 'Accident', 'Formation', 'Service militaire', 'Congé spécial'];
  const OVER = 46;     // h / semaine : seuil d'alerte (CN : max 50 h)

  const absOn = (empId, d) => (VX.S.absences || []).find(a => a.empId === empId && a.status !== 'Refusée' && a.from <= d && a.to >= d);
  /** site effectif d'un employé à une date ('ABS' si absent) */
  BO.effSite = (e, d) => {
    const t0 = today();
    if (d === t0) return e.status === 'absent' ? 'ABS' : e.siteId;
    if (absOn(e.id, d) && (absOn(e.id, d).status === 'Validée' || d > t0)) return 'ABS';
    if (d < t0) { const ts = VX.S.timesheets.find(t => t.empId === e.id && t.date === d); return ts ? ts.siteId : null; }
    return ((VX.S.plan || {})[d] || {})[e.id] || e.siteId;
  };
  /** synchronise le statut du jour avec les absences validées */
  BO.syncAbsence = empId => {
    const e = VX.emp(empId), a = absOn(empId, today()); if (!e) return;
    if (a && a.status === 'Validée' && e.status !== 'absent') { if (e.taskId) VX.unassign(empId); e.status = 'absent'; e.absence = a.type + ' (jusqu’au ' + U.fmtDate(a.to) + ')'; VX.log(e.name + ' absent·e : ' + a.type, 'note', e.siteId); }
    else if (!(a && a.status === 'Validée') && e.status === 'absent') { e.status = 'present'; e.absence = ''; VX.log(e.name + ' de retour', 'note', e.siteId); }
    VX.save(); VX.emit('absence', { empId });
  };
  BO.absenceForm = (pre = {}, id) => {
    const a = id ? VX.S.absences.find(x => x.id === id) : null;
    BO.formModal({
      title: a ? 'Modifier l’absence' : 'Nouvelle absence',
      fields: [
        { k: 'empId', label: 'Collaborateur', type: 'select', opts: BO.optEmps(), req: true, full: true },
        { k: 'type', label: 'Type', type: 'select', opts: ABS_TYPES },
        { k: 'status', label: 'Statut', type: 'select', opts: ['Demandée', 'Validée', 'Refusée'] },
        { k: 'from', label: 'Du', type: 'date', req: true },
        { k: 'to', label: 'Au (inclus)', type: 'date', req: true, validate: (v, all) => all.from && v < all.from ? 'Date de fin avant le début' : '' },
        { k: 'note', label: 'Remarque', full: true, ph: 'ex. certificat médical reçu' },
      ],
      values: a || Object.assign({ type: 'Vacances', status: 'Validée', from: today(), to: today() }, pre),
      danger: a ? { title: 'Supprimer l’absence ?', text: 'L’absence sera retirée du planning.', run: () => { VX.remove('absences', a.id, 'absence'); BO.syncAbsence(a.empId); UI.toast('Absence supprimée', '', 'ok'); } } : null,
      onSubmit: v => {
        const o = Object.assign({ id: a ? a.id : U.uid('ab') }, v);
        VX.upsert('absences', o, 'absence'); BO.syncAbsence(v.empId);
        UI.toast('Absence enregistrée', BO.empName(v.empId) + ' · ' + v.type + ' du ' + U.fmtDate(v.from) + ' au ' + U.fmtDate(v.to), 'ok', 'calendar');
      },
    });
  };
  /** envoyer quelqu'un sur un chantier aujourd'hui : choix de la tâche puis VX.assign / VX.moveTo */
  BO.sendTo = (empId, siteId) => {
    const e = VX.emp(empId); if (!e) return;
    if (e.status === 'absent') { UI.toast('Absent·e', e.name + ' est absent·e aujourd’hui.', 'warn'); return; }
    const open = siteId === 'hq' ? [] : VX.siteTasks(siteId).filter(t => t.status !== 'done');
    const done = () => UI.toast('Affectation du jour', e.name + ' → ' + BO.siteName(siteId), 'ok', 'check');
    if (!open.length) { VX.moveTo(empId, siteId); done(); return; }
    UI.modal({
      title: 'Sur quelle tâche ? <small class="muted" style="font-size:14px;font-weight:600">· ' + esc(e.name) + ' → ' + esc(BO.siteName(siteId)) + '</small>',
      body: `<div class="mini-list">${open.map(t => `<div data-tk="${t.id}" style="cursor:pointer">${UI.statusChip(t.status)}<div style="flex:1"><b>${esc(t.title)}</b><div class="xs-t muted">CFC ${esc(t.cfc)} · ${t.assignees.length ? t.assignees.length + ' pers.' : '<span class="bad-t">personne</span>'}</div></div><span class="btn sm">Choisir</span></div>`).join('')}<div data-tk="" style="cursor:pointer"><span class="chip grey">Sans tâche</span><div style="flex:1" class="muted">Juste l’envoyer sur le chantier</div><span class="btn sm">Choisir</span></div></div>`,
      onMount: (m, close) => m.addEventListener('click', ev => { const r = ev.target.closest('[data-tk]'); if (!r) return; close(); if (r.dataset.tk) { if (VX.assign(empId, r.dataset.tk)) done(); } else { VX.moveTo(empId, siteId); done(); } }),
    });
  };
  /** planifier un jour futur */
  function planDay(empId, d, siteId) {
    const S = VX.S, e = VX.emp(empId);
    if (d < today()) { UI.toast('Jour passé', 'On ne modifie pas le planning d’un jour écoulé.', 'warn'); return; }
    if (siteId === 'ABS') { BO.absenceForm({ empId, from: d, to: d }); return; }
    if (d === today()) { if (siteId !== e.siteId) BO.sendTo(empId, siteId); return; }
    if (absOn(empId, d)) { UI.toast('Absence prévue', e.name + ' est en ' + absOn(empId, d).type.toLowerCase() + ' ce jour-là.', 'warn'); return; }
    S.plan[d] = S.plan[d] || {};
    if (siteId === e.siteId) delete S.plan[d][empId]; else S.plan[d][empId] = siteId;
    VX.log(e.name + ' planifié·e ' + U.fmtDate(d) + ' → ' + BO.siteName(siteId), 'assign', siteId); VX.save(); VX.emit('plan', { empId, date: d, siteId });
    UI.toast('Planning mis à jour', e.name + ' · ' + BO.dayName(d) + ' ' + U.fmtDate(d) + ' → ' + BO.siteName(siteId), 'ok', 'calendar');
  }
  const weekHours = (e, days) => {
    const S = VX.S, t0 = today(); let h = 0;
    days.forEach(d => { if (d < t0) h += S.timesheets.filter(t => t.empId === e.id && t.date === d).reduce((a, t) => a + t.hours, 0); else if (BO.effSite(e, d) !== 'ABS') h += VX.S.tasks.some(t => t.priority === 'haute' && t.status === 'doing' && t.assignees.includes(e.id)) ? 9 : 8.5; });
    return h;
  };
  const prevHours = e => { const ws = addDays(U.weekStart(today()), -7); return VX.S.timesheets.filter(t => t.empId === e.id && t.date >= ws && t.date < addDays(ws, 7)).reduce((a, t) => a + t.hours, 0); };
  BO.overloaded = () => VX.S.employees.filter(BO.isField).map(e => { const ws = U.weekStart(today()), days = Array.from({ length: 5 }, (_, i) => addDays(ws, i)); return { e, wk: weekHours(e, days), prev: prevHours(e) }; }).filter(x => x.wk > OVER || x.prev > OVER);

  function render(el, p) {
    const S = VX.S, t0 = today();
    if (p.id && VX.task(p.id)) { const id = p.id; p.id = null; setTimeout(() => BO.taskDrawer(id), 50); }
    if (p.id && VX.emp(p.id)) { st.view = 'emps'; st.site = ''; st.role = VX.emp(p.id).role; p.id = null; }
    const ws = addDays(U.weekStart(t0), st.week * 7), days = Array.from({ length: 5 }, (_, i) => addDays(ws, i));
    const people = S.employees.filter(e => st.office || BO.isField(e));
    const sites = BO.activeSites();
    const over = BO.overloaded();
    const unstaffed = S.tasks.filter(t => t.siteId !== 'hq' && t.status !== 'done' && !t.assignees.length && diffDays(t0, t.start) <= 7);
    const absWeek = (S.absences || []).filter(a => a.status !== 'Refusée' && a.to >= days[0] && a.from <= days[4]);
    const pending = (S.absences || []).filter(a => a.status === 'Demandée');
    const pool = S.employees.filter(e => e.siteId === 'hq' && BO.isField(e) && e.status === 'present');
    const dayHdr = d => `<th class="${d === t0 ? 'today' : ''}">${esc(BO.dayName(d))} ${U.parse(d).getDate()}<small>${d === t0 ? 'Aujourd’hui' : U.fmtDate(d, { month: 'long' })}</small></th>`;

    el.innerHTML = `<div class="bo-page">${BO.head('Planning des équipes', `Semaine du ${U.fmtDate(days[0], { day: 'numeric', month: 'long' })} au ${U.fmtDate(days[4], { day: 'numeric', month: 'long', year: 'numeric' })} · glissez une personne vers un autre chantier ou un autre jour`,
      `<div class="seg"><button data-wk="-1">${BO.xi('arrowL', 15)}</button><button data-wk="0" class="${st.week === 0 ? 'on' : ''}">Cette semaine</button><button data-wk="1">${BO.xi('arrowR', 15)}</button></div><button class="btn" data-abs>${UI.icon('calendar', 16)}Nouvelle absence</button><button class="btn pri" data-map="site:hq">${UI.icon('map', 16)}Voir sur la carte</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Personnel terrain', v: S.employees.filter(BO.isField).length, s: `${S.employees.filter(e => BO.isField(e) && e.status === 'present').length} présents aujourd’hui`, icon: 'helmet' })}
        ${BO.kpi({ lb: 'Disponibles (pool)', v: pool.length, s: pool.map(e => esc(e.first)).join(', ') || 'personne au dépôt', icon: 'users', cls: pool.length ? 'green' : '' })}
        ${BO.kpi({ lb: 'Absences semaine', v: absWeek.length, s: pending.length ? `<span class="chip amber" style="height:20px">${pending.length} demande${pending.length > 1 ? 's' : ''} à valider</span>` : 'aucune demande en attente', icon: 'calendar', cls: pending.length ? 'amber' : '' })}
        ${BO.kpi({ lb: 'Risque de surcharge', v: over.length, s: `> ${OVER} h/semaine (S ou S-1)`, icon: 'flame', cls: over.length ? 'red' : 'green' })}
        ${BO.kpi({ lb: 'Tâches sans équipe', v: unstaffed.length, s: 'démarrant sous 7 jours', icon: 'alert', cls: unstaffed.length ? 'amber' : 'green' })}
      </div>
      <div class="toolbar">${BO.seg('view', [['sites', UI.icon('crane', 15) + 'Par chantier'], ['emps', UI.icon('users', 15) + 'Par employé']], st.view)}
        ${st.view === 'emps' ? `<select class="inp" data-f="site">${BO.opts(BO.optSites(true), st.site, 'Tous les chantiers')}</select><select class="inp" data-f="role">${BO.opts(BO.optRoles().filter(([k]) => st.office || !VX.ROLES[k].hq), st.role, 'Tous les métiers')}</select>` : ''}
        <label class="chk" style="padding:4px 8px"><input type="checkbox" data-office ${st.office ? 'checked' : ''}> Inclure le bureau</label>
        <span class="sp"></span><span class="legend"><span><i style="background:var(--violet)"></i>Changement planifié</span><span><i style="background:var(--amber)"></i>Surcharge</span><span><i style="background:var(--red)"></i>Absence</span></span></div>
      <div class="plan" data-plan></div>
        <div class="g g3 mt">
          <div class="card"><div class="card-h"><h3>${UI.icon('alert', 18)}Tâches sans équipe</h3></div>${unstaffed.length ? `<div class="mini-list" style="padding:0 16px 8px">${unstaffed.map(t => `<div><i class="dot-s" style="background:${VX.site(t.siteId).color}"></i><div style="flex:1;min-width:0;cursor:pointer" data-open-task="${t.id}"><b class="sm-t">${esc(t.title)}</b><div class="xs-t muted">${esc(VX.site(t.siteId).code)} · début ${BO.inDays(t.start)}</div></div><button class="btn sm pri" data-staff="${t.id}">Affecter</button></div>`).join('')}</div>` : BO.empty('check', 'Toutes les tâches ont une équipe', '', '', true)}</div>
          <div class="card"><div class="card-h"><h3>${UI.icon('flame', 18)}Surcharge</h3></div>${over.length ? `<div class="mini-list" style="padding:0 16px 8px">${over.map(x => `<div>${UI.avatar(x.e, 28)}<div style="flex:1;cursor:pointer" data-open-emp="${x.e.id}"><b class="sm-t">${esc(x.e.name)}</b><div class="xs-t muted">S-1 : <b class="${x.prev > OVER ? 'bad-t' : ''}">${BO.num(x.prev, 1)} h</b> · prévu : <b class="${x.wk > OVER ? 'bad-t' : ''}">${BO.num(x.wk, 1)} h</b></div></div></div>`).join('')}</div><div class="xs-t muted" style="padding:0 16px 14px">Pensez à compenser les heures supplémentaires (CN : max. 50 h/semaine).</div>` : BO.empty('check', 'Aucune surcharge', '', '', true)}</div>
          <div class="card"><div class="card-h"><h3>${UI.icon('calendar', 18)}Absences</h3><button class="btn sm" data-abs>${UI.icon('plus', 14)}</button></div>${(S.absences || []).filter(a => a.to >= addDays(t0, -7)).length ? `<div class="mini-list" style="padding:0 16px 8px">${(S.absences || []).filter(a => a.to >= addDays(t0, -7)).sort((a, b) => a.from.localeCompare(b.from)).map(a => { const e = VX.emp(a.empId); return e ? `<div>${UI.avatar(e, 28)}<div style="flex:1;min-width:0;cursor:pointer" data-ab="${a.id}"><b class="sm-t">${esc(e.name)}</b><div class="xs-t muted">${esc(a.type)} · ${U.fmtDate(a.from)} → ${U.fmtDate(a.to)}</div></div>${a.status === 'Demandée' ? `<button class="btn sm pri" data-okab="${a.id}">Valider</button><button class="icon-btn" title="Refuser" data-noab="${a.id}">${UI.icon('x', 15)}</button>` : `<span class="chip ${a.status === 'Validée' ? 'green' : 'red'}">${esc(a.status)}</span>`}</div>` : ''; }).join('')}</div>` : BO.empty('calendar', 'Aucune absence', '', '', true)}</div>
        </div></div>`;

    const host = el.querySelector('[data-plan]');
    if (st.view === 'sites') {
      const rows = sites.map(s => ({ id: s.id, s })).concat([{ id: 'hq', s: VX.site('hq') }, { id: 'ABS' }]);
      host.innerHTML = `<table><thead><tr><th>Chantier</th>${days.map(dayHdr).join('')}</tr></thead><tbody>${rows.map(r => {
        const label = r.id === 'ABS' ? `<div class="row"><span class="sc-ic" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--red-soft);color:var(--red)">${UI.icon('user', 16)}</span><div><b>Absents</b><div class="xs-t muted">déposer = créer une absence</div></div></div>`
          : `<div class="row" data-open="sites:${r.id}" style="cursor:pointer"><span class="sc-ic" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:${r.s.color}">${UI.icon((VX.SITE_TYPES[r.s.type] || {}).icon || 'building', 16)}</span><div style="min-width:0"><b class="sm-t">${esc(r.id === 'hq' ? 'Dépôt · disponibles' : r.s.name)}</b><div class="xs-t muted">${esc(r.id === 'hq' ? 'Siège Crissier' : r.s.code + ' · ' + VX.siteTasks(r.id).filter(t => t.status === 'doing').length + ' tâches en cours')}</div></div></div>`;
        return `<tr><td class="rh">${label}</td>${days.map(d => {
          const ppl = people.filter(e => BO.effSite(e, d) === r.id);
          const past = d < t0, need = r.id !== 'hq' && r.id !== 'ABS' ? VX.siteTasks(r.id).filter(t => t.status === 'doing' || (t.status === 'todo' && t.start <= d)).length : 0;
          return `<td class="${d === t0 ? 'today' : ''} ${past ? 'past' : ''}" data-cell="${r.id}|${d}"><div class="cnt">${ppl.length} pers.${need && ppl.length < need ? ` <span class="bad-t">· ${need} tâches</span>` : ''}</div>${ppl.map(e => {
            const chg = d > t0 && ((S.plan[d] || {})[e.id]), ov = over.some(x => x.e.id === e.id);
            return `<div class="pchip ${r.id === 'ABS' ? 'abs' : ''} ${chg ? 'chg' : ''} ${ov && r.id !== 'ABS' ? 'ov' : ''}" ${!past && r.id !== 'ABS' ? 'draggable="true"' : ''} data-emp="${e.id}" data-day="${d}" title="${esc(e.name + ' – ' + VX.roleLabel(e.role))}">${UI.avatar(e, 22)}<span>${esc(e.first)} <small>${esc(VX.roleLabel(e.role).split(/[ ·]/)[0])}</small></span></div>`;
          }).join('')}</td>`;
        }).join('')}</tr>`;
      }).join('')}</tbody></table>`;
    } else {
      let ppl = people.slice();
      if (st.site) ppl = ppl.filter(e => e.siteId === st.site || e.homeSiteId === st.site);
      if (st.role) ppl = ppl.filter(e => e.role === st.role);
      ppl.sort((a, b) => (a.siteId === 'hq') - (b.siteId === 'hq') || a.siteId.localeCompare(b.siteId) || a.last.localeCompare(b.last));
      host.innerHTML = `<table><thead><tr><th>Collaborateur</th>${days.map(dayHdr).join('')}<th style="text-align:right">Heures</th></tr></thead><tbody>${ppl.length ? ppl.map(e => {
        const h = weekHours(e, days), ov = h > OVER;
        return `<tr><td class="rh">${BO.empCell(e)}</td>${days.map(d => {
          const sid = BO.effSite(e, d), s = sid && sid !== 'ABS' ? VX.site(sid) : null, chg = d > t0 && (S.plan[d] || {})[e.id];
          const cell = sid === 'ABS' ? `<div class="scell abs">${esc((absOn(e.id, d) || {}).type || 'Absent')}</div>` : s ? `<div class="scell ${s.id === 'hq' ? 'hq' : ''} ${chg ? 'chg' : ''}" style="${s.id === 'hq' ? '' : 'background:' + s.color}" data-pick="${e.id}|${d}" title="${esc(s.name)}">${esc(s.id === 'hq' ? 'Dépôt' : s.code)}</div>` : '<div class="scell hq" style="opacity:.5">—</div>';
          return `<td class="${d === t0 ? 'today' : ''} ${d < t0 ? 'past' : ''}">${cell}</td>`;
        }).join('')}<td style="text-align:right;white-space:nowrap"><b class="${ov ? 'bad-t' : ''}">${BO.num(h, 1)} h</b>${ov ? '<div class="xs-t bad-t b">surcharge</div>' : ''}</td></tr>`;
      }).join('') : `<tr><td colspan="7">${BO.empty('users', 'Personne ne correspond aux filtres', '', '', true)}</td></tr>`}</tbody></table>`;
    }

    // --- glisser-déposer (vue chantiers) ---
    let drag = null;
    host.querySelectorAll('.pchip[draggable]').forEach(c => {
      c.addEventListener('dragstart', e => { drag = { emp: c.dataset.emp, day: c.dataset.day }; BO.dragging = true; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', c.dataset.emp); c.style.opacity = .4; });
      c.addEventListener('dragend', () => { BO.dragging = false; c.style.opacity = ''; host.querySelectorAll('.drop').forEach(x => x.classList.remove('drop')); });
    });
    host.querySelectorAll('[data-cell]').forEach(td => {
      const [sid, d] = td.dataset.cell.split('|'); if (d < t0) return;
      td.addEventListener('dragover', e => { e.preventDefault(); td.classList.add('drop'); });
      td.addEventListener('dragleave', e => { if (!td.contains(e.relatedTarget)) td.classList.remove('drop'); });
      td.addEventListener('drop', e => { e.preventDefault(); td.classList.remove('drop'); BO.dragging = false; if (!drag) return; const cur = BO.effSite(VX.emp(drag.emp), d); if (cur === sid) return; planDay(drag.emp, d, sid); drag = null; });
    });
    host.querySelectorAll('.pchip').forEach(c => c.addEventListener('dblclick', () => BO.empDrawer(c.dataset.emp)));
    // --- clic cellule (vue employés) ---
    host.querySelectorAll('[data-pick]').forEach(c => c.addEventListener('click', () => {
      const [eid, d] = c.dataset.pick.split('|'), e = VX.emp(eid);
      if (d < t0) { UI.toast('Jour passé', 'Consultez le pointage pour les jours écoulés.', 'info'); return; }
      UI.modal({ title: esc(e.name) + ' · ' + esc(BO.dayName(d)) + ' ' + U.fmtDate(d), body: `<div class="mini-list">${VX.S.sites.filter(s => s.status !== 'Terminé').map(s => `<div data-s="${s.id}" style="cursor:pointer"><i class="dot-s" style="background:${s.color};width:12px;height:12px"></i><div style="flex:1"><b>${esc(s.id === 'hq' ? 'Dépôt / disponible' : s.name)}</b><div class="xs-t muted">${esc(s.city)}</div></div>${BO.effSite(e, d) === s.id ? '<span class="chip">Actuel</span>' : '<span class="btn sm">Choisir</span>'}</div>`).join('')}<div data-s="ABS" style="cursor:pointer"><i class="dot-s" style="background:var(--red);width:12px;height:12px"></i><div style="flex:1"><b>Absence…</b></div><span class="btn sm">Saisir</span></div></div>`,
        onMount: (m, close) => m.addEventListener('click', ev => { const r = ev.target.closest('[data-s]'); if (!r) return; close(); if (BO.effSite(e, d) !== r.dataset.s) planDay(eid, d, r.dataset.s); }) });
    }));

    el.querySelectorAll('[data-wk]').forEach(b => b.addEventListener('click', () => { const v = +b.dataset.wk; st.week = v === 0 ? 0 : st.week + v; APP.refresh(); }));
    BO.bindSeg(el, (n, v) => { if (n === 'view') { st.view = v; APP.refresh(); } });
    el.querySelectorAll('[data-f]').forEach(s => s.addEventListener('change', () => { st[s.dataset.f] = s.value; APP.refresh(); }));
    el.querySelector('[data-office]').addEventListener('change', e => { st.office = e.target.checked; APP.refresh(); });
    el.querySelectorAll('[data-abs]').forEach(b => b.addEventListener('click', () => BO.absenceForm()));
    el.querySelectorAll('[data-ab]').forEach(b => b.addEventListener('click', () => BO.absenceForm({}, b.dataset.ab)));
    el.querySelectorAll('[data-okab]').forEach(b => b.addEventListener('click', () => { const a = S.absences.find(x => x.id === b.dataset.okab); VX.upsert('absences', { id: a.id, status: 'Validée' }, 'absence'); BO.syncAbsence(a.empId); UI.toast('Absence validée', BO.empName(a.empId) + ' · ' + a.type, 'ok', 'check'); }));
    el.querySelectorAll('[data-noab]').forEach(b => b.addEventListener('click', () => { const a = S.absences.find(x => x.id === b.dataset.noab); VX.upsert('absences', { id: a.id, status: 'Refusée' }, 'absence'); UI.toast('Absence refusée', BO.empName(a.empId), 'warn'); }));
    el.querySelectorAll('[data-staff]').forEach(b => b.addEventListener('click', () => { const t = VX.task(b.dataset.staff); BO.pickEmployee({ siteId: t.siteId, taskId: t.id, onPick: id => { if (VX.assign(id, t.id)) UI.toast('Affecté·e', BO.empName(id) + ' → ' + t.title, 'ok', 'check'); } }); }));
  }
  APP.register({ id: 'planning', label: 'Planning équipes', icon: 'calendar', group: 'Équipes', order: 20, render, badge: () => (VX.S.absences || []).filter(a => a.status === 'Demandée').length });
})();

</script>
<script>
/* ==========================================================================
   BO · Employés : annuaire, fiche (tiroir), certificats, édition
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, today, addDays, diffDays } = U;
  const st = { q: '', role: '', site: '', status: 'all', tbl: { sort: 'name', dir: 'asc' } };
  const CERT_SUGG = ['SUVA premiers secours', 'Permis grutier cat. A', 'Permis grutier cat. B', 'Permis grue mobile', 'Permis machiniste M1–M3', 'Travail en hauteur', 'Plateforme élévatrice (IPAF)', 'Cariste (chariot élévateur)', 'Amiante – sensibilisation', 'Signalisation de chantier', 'Brevet contremaître', 'Chef de chantier ES', 'Élingage et levage'];
  const certState = c => { if (!c.exp) return { cls: 'grey', l: 'Permanent' }; const d = diffDays(today(), c.exp); return d < 0 ? { cls: 'red', l: 'Expiré', d } : d < 30 ? { cls: 'red', l: 'Expire ' + BO.inDays(c.exp), d } : d < 90 ? { cls: 'amber', l: 'Expire ' + BO.inDays(c.exp), d } : { cls: 'green', l: 'Valide', d }; };
  BO.certState = certState;
  const certsSoon = () => { const out = []; VX.S.employees.forEach(e => (e.certs || []).forEach(c => { if (c.exp && diffDays(today(), c.exp) < 90) out.push({ e, c, d: diffDays(today(), c.exp) }); })); return out.sort((a, b) => a.d - b.d); };

  BO.renewCert = (empId, name) => {
    const e = VX.emp(empId), c = (e.certs || []).find(x => x.n === name) || { n: name };
    BO.formModal({
      title: 'Renouveler – ' + c.n, intro: `<div class="row">${UI.avatar(e, 36)}<div><b>${esc(e.name)}</b><div class="xs-t muted">Échéance actuelle : ${c.exp ? BO.date(c.exp) : '—'}</div></div></div>`,
      fields: [{ k: 'exp', label: 'Nouvelle date d’échéance', type: 'date', req: true, validate: v => v <= today() ? 'Doit être dans le futur' : '' }, { k: 'course', label: 'Cours / organisme', ph: 'ex. SUVA, Centre de formation Le Day' }],
      values: { exp: addDays(today(), 3 * 365), course: '' },
      submit: 'Enregistrer le renouvellement',
      onSubmit: v => { const certs = (e.certs || []).map(x => x.n === c.n ? Object.assign({}, x, { exp: v.exp, course: v.course }) : x); VX.upsert('employees', { id: e.id, certs }, 'employee'); VX.log('Certificat renouvelé : ' + e.name + ' – ' + c.n, 'note', e.siteId); VX.save(); UI.toast('Certificat renouvelé', c.n + ' · jusqu’au ' + U.fmtDate(v.exp), 'ok', 'shield'); },
    });
  };
  const addCert = empId => {
    const e = VX.emp(empId);
    BO.formModal({ title: 'Ajouter un certificat', fields: [{ k: 'n', label: 'Certificat / permis', req: true, full: true, ph: 'ex. Travail en hauteur' }, { k: 'exp', label: 'Échéance (vide = permanent)', type: 'date' }],
      onMount: el => { const i = el.querySelector('[name=n]'); i.setAttribute('list', 'cert-sugg'); i.insertAdjacentHTML('afterend', `<datalist id="cert-sugg">${CERT_SUGG.map(s => `<option value="${esc(s)}">`).join('')}</datalist>`); },
      onSubmit: v => { if ((e.certs || []).some(c => c.n === v.n)) { UI.toast('Déjà présent', 'Utilisez « Renouveler ».', 'warn'); return false; } VX.upsert('employees', { id: e.id, certs: (e.certs || []).concat([{ n: v.n, exp: v.exp || null }]) }, 'employee'); UI.toast('Certificat ajouté', e.name + ' · ' + v.n, 'ok', 'shield'); } });
  };

  BO.empForm = id => {
    const e = id ? VX.emp(id) : null;
    const fields = [
      { k: 'first', label: 'Prénom', req: true }, { k: 'last', label: 'Nom', req: true },
      { k: 'role', label: 'Métier', type: 'select', opts: BO.optRoles(), req: true }, { k: 'title', label: 'Intitulé de poste', ph: 'ex. Maçon CFC' },
      { k: 'homeSiteId', label: 'Chantier / lieu de rattachement', type: 'select', opts: BO.optSites(true), req: true }, { k: 'hire', label: 'Date d’entrée', type: 'date', req: true },
      { k: 'phone', label: 'Mobile', type: 'tel', req: true, ph: '+41 79 …' }, { k: 'email', label: 'E-mail', type: 'email', req: true },
      { k: 'salary', label: 'Salaire mensuel brut (CHF)', type: 'number', min: 3000, max: 30000, step: 50, req: true }, { k: 'hoursWeek', label: 'Heures contractuelles / sem.', type: 'number', min: 10, max: 50, step: .5, req: true },
    ];
    BO.formModal({
      title: e ? 'Modifier ' + e.name : 'Nouveau collaborateur', fields, wide: false,
      values: e || { role: 'macon', homeSiteId: 'hq', hire: today(), salary: 5900, hoursWeek: 41.5 },
      onMount: el => { if (!e) { const f = el.querySelector('[name=first]'), l = el.querySelector('[name=last]'), m = el.querySelector('[name=email]'); const upd = () => { if (!m.dataset.t) m.value = ((f.value[0] || '') + '.' + l.value).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z.]/g, '') + '@vanteo.ch'; }; f.oninput = l.oninput = upd; m.oninput = () => m.dataset.t = 1; } },
      onSubmit: v => {
        const base = { name: v.first + ' ' + v.last, initials: (v.first[0] + v.last[0]).toUpperCase(), color: VX.ROLES[v.role].color };
        if (e) {
          VX.upsert('employees', Object.assign({ id: e.id }, v, base), 'employee');
          UI.toast('Fiche mise à jour', base.name, 'ok', 'check');
        } else {
          const ne = Object.assign({ id: U.uid('e'), siteId: v.homeSiteId, taskId: null, status: 'present', certs: [], skills: [], badgeIn: VX.ROLES[v.role].hq ? 7 * 60 + 50 : 6 * 60 + 55 }, v, base);
          VX.upsert('employees', ne, 'employee:new');
          VX.S.company.staff = VX.S.employees.length;
          VX.log('Nouveau collaborateur : ' + ne.name + ' (' + VX.roleLabel(ne.role) + ')', 'assign', ne.siteId); VX.save();
          UI.toast('Bienvenue ' + ne.first + ' !', ne.name + ' rejoint l’équipe', 'ok', 'users');
          setTimeout(() => BO.empDrawer(ne.id), 200);
        }
      },
    });
  };

  /* ---------------- frise de la journée (VX.dayPlan) ---------------- */
  const SEG = { work: ['#0fb5ab', 'Travail'], office: ['#3fb6a8', 'Bureau'], meeting: ['#7b61d9', 'Réunion'], travel: ['#e8930c', 'Trajet'], pause: ['#b6c4c2', 'Pause'], lunch: ['#cfdcda', 'Repas'] };
  const dayStrip = e => {
    const segs = VX.dayPlan(e).filter(s => s.kind !== 'off'); if (!segs.length) return BO.empty('user', 'Absent·e aujourd’hui', e.absence || '', '', true);
    const a = 5 * 60, b = 20 * 60, w = b - a, now = new Date(), nm = now.getHours() * 60 + now.getMinutes();
    return `<div style="position:relative;height:30px;border-radius:9px;background:#f1f6f5;overflow:hidden">${segs.map(s => `<div title="${SEG[s.kind] ? SEG[s.kind][1] : s.kind} ${U.fmtTime(s.from)}–${U.fmtTime(s.to)}${s.siteId ? ' · ' + esc(BO.siteName(s.siteId)) : ''}" style="position:absolute;top:0;bottom:0;left:${(s.from - a) / w * 100}%;width:${(s.to - s.from) / w * 100}%;background:${(SEG[s.kind] || ['#ddd'])[0]};border-right:1px solid #fff"></div>`).join('')}${nm > a && nm < b ? `<div style="position:absolute;top:0;bottom:0;left:${(nm - a) / w * 100}%;width:2px;background:var(--ink)"></div>` : ''}</div>
      <div class="row xs-t muted" style="justify-content:space-between;margin-top:4px"><span>05:00</span><span>08:00</span><span>11:00</span><span>14:00</span><span>17:00</span><span>20:00</span></div>
      <div class="legend mt" style="margin-top:6px">${Object.entries(SEG).filter(([k]) => segs.some(s => s.kind === k)).map(([, [c, l]]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}<span class="muted">· badge ${U.fmtTime(e.badgeIn)}</span></div>`;
  };

  /* ---------------- tiroir employé ---------------- */
  BO.empDrawer = id => {
    let showSal = false;
    BO.drawer({
      head: () => { const e = VX.emp(id); return e ? UI.avatar(e, 54) : ''; },
      title: () => { const e = VX.emp(id); return e ? esc(e.name) : null; },
      sub: () => { const e = VX.emp(id); return `<span class="tag" style="background:${e.color}22;color:var(--ink)">${esc(VX.roleLabel(e.role))}</span>${e.status === 'absent' ? '<span class="chip red">Absent·e</span>' : '<span class="chip green">Présent·e</span>'}<span>${esc(e.title || '')}</span>`; },
      render: () => {
        const S = VX.S, e = VX.emp(id), t = e.taskId ? VX.task(e.taskId) : null;
        const ws = U.weekStart(today()), days = Array.from({ length: 5 }, (_, i) => addDays(ws, i));
        const hrs = days.map(d => S.timesheets.filter(x => x.empId === id && x.date === d).reduce((a, x) => a + x.hours, 0)), tot = hrs.reduce((a, b) => a + b, 0);
        const prev = S.timesheets.filter(x => x.empId === id && x.date >= addDays(ws, -7) && x.date < ws).reduce((a, x) => a + x.hours, 0);
        const abs = (S.absences || []).filter(a => a.empId === id).sort((a, b) => b.from.localeCompare(a.from));
        const yrs = diffDays(e.hire, today()) / 365.25;
        return `<div class="dsec"><h4>Affectation du jour</h4>
            <div class="card pad" style="box-shadow:inset 0 0 0 1px var(--line);padding:13px 15px"><div class="row">${BO.pillSite(e.siteId)}${e.homeSiteId !== e.siteId ? `<span class="xs-t muted">(rattaché·e à ${esc(BO.siteName(e.homeSiteId))})</span>` : ''}</div>
            <div class="mt" style="margin-top:10px">${t ? `<div class="row" style="cursor:pointer" data-open-task="${t.id}">${UI.statusChip(t.status)}<b style="flex:1">${esc(t.title)}</b><span class="xs-t muted">${Math.round(t.progress * 100)}%</span></div>` : '<span class="muted sm-t">Aucune tâche affectée</span>'}</div>
            <div class="row wrap mt" style="margin-top:12px"><button class="btn sm pri" data-re>${BO.xi('swap', 14)}Réaffecter</button>${t ? '<button class="btn sm" data-un>Retirer de la tâche</button>' : ''}${e.siteId !== 'hq' && BO.isField(e) ? '<button class="btn sm" data-depot>Renvoyer au dépôt</button>' : ''}${BO.mapBtn('employee', id)}</div></div></div>
          <div class="dsec"><h4>Journée type aujourd’hui</h4>${dayStrip(e)}</div>
          <div class="dsec"><h4>Heures de la semaine <span class="r xs-t">S-1 : ${BO.num(prev, 1)} h</span></h4>
            <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:84px">${hrs.map((h, i) => `<div style="text-align:center"><div style="height:${Math.max(3, h / 11 * 56)}px;border-radius:7px;background:${h > 9.5 ? 'var(--amber)' : days[i] === today() ? 'var(--tq-l)' : 'var(--tq)'};margin:0 6px"></div><div class="xs-t b" style="margin-top:4px">${h ? BO.num(h, 1) : '–'}</div><div class="xs-t muted">${esc(BO.dayName(days[i]))}</div></div>`).join('')}</div>
            <div class="row sm-t mt"><span class="muted">Total</span><b>${BO.num(tot, 1)} h</b><span class="sp"></span><span class="muted">Contrat</span><b>${BO.num(e.hoursWeek, 1)} h</b></div></div>
          <div class="dsec"><h4>Certificats & permis <span class="r"><button class="btn sm" data-addc>${UI.icon('plus', 13)}Ajouter</button></span></h4>${(e.certs || []).length ? `<div class="mini-list">${e.certs.map(c => { const s = certState(c); return `<div>${UI.icon('shield', 17)}<div style="flex:1"><b class="sm-t">${esc(c.n)}</b><div class="xs-t muted">${c.exp ? 'Échéance ' + BO.date(c.exp) : 'Sans échéance'}</div></div><span class="chip ${s.cls}">${esc(s.l)}</span>${c.exp ? `<button class="btn sm" data-renew="${esc(c.n)}">Renouveler</button>` : ''}</div>`; }).join('')}</div>` : '<div class="muted sm-t">Aucun certificat enregistré.</div>'}</div>
          <div class="dsec"><h4>Contact</h4><dl class="kv"><dt>Mobile</dt><dd><a class="lnk" href="tel:${esc(e.phone.replace(/\s/g, ''))}">${esc(e.phone)}</a></dd><dt>E-mail</dt><dd><a class="lnk" href="mailto:${esc(e.email)}">${esc(e.email)}</a></dd><dt>Badge habituel</dt><dd>${U.fmtTime(e.badgeIn)}</dd></dl></div>
          <div class="dsec"><h4>Contrat</h4><dl class="kv"><dt>Entrée</dt><dd>${BO.date(e.hire)} <span class="muted">(${BO.num(yrs, 1)} ans)</span></dd><dt>Salaire mensuel</dt><dd><span class="${showSal ? '' : 'blur'}" data-sal title="Cliquer pour afficher">${chf(e.salary)} × 13</span></dd><dt>Taux de facturation</dt><dd>${VX.ROLES[e.role].rate ? chf(VX.ROLES[e.role].rate) + ' / h' : '—'}</dd><dt>Horaire contractuel</dt><dd>${BO.num(e.hoursWeek, 1)} h / semaine</dd></dl></div>
          <div class="dsec"><h4>Absences <span class="r"><button class="btn sm" data-abs>${UI.icon('plus', 13)}Saisir</button></span></h4>${abs.length ? `<div class="mini-list">${abs.map(a => `<div style="cursor:pointer" data-ab="${a.id}">${UI.icon('calendar', 16)}<div style="flex:1"><b class="sm-t">${esc(a.type)}</b><div class="xs-t muted">${U.fmtDate(a.from)} → ${U.fmtDate(a.to)}${a.note ? ' · ' + esc(a.note) : ''}</div></div><span class="chip ${a.status === 'Validée' ? 'green' : a.status === 'Refusée' ? 'red' : 'amber'}">${esc(a.status)}</span></div>`).join('')}</div>` : '<div class="muted sm-t">Aucune absence enregistrée.</div>'}</div>`;
      },
      foot: () => `<button class="btn" data-edit>${UI.icon('edit', 15)}Modifier la fiche</button><a class="btn" href="tel:${esc((VX.emp(id) || { phone: '' }).phone.replace(/\s/g, ''))}">${UI.icon('phone', 15)}Appeler</a><span class="sp"></span>${BO.mapBtn('employee', id, 'Voir sur la carte', 'pri')}`,
      onMount: (d, close, rer) => {
        const e = VX.emp(id); if (!e) return;
        const q = s => d.querySelector(s);
        q('[data-re]').onclick = () => BO.reassign(id);
        if (q('[data-un]')) q('[data-un]').onclick = () => { VX.unassign(id); UI.toast('Retiré·e de la tâche', e.name, 'ok'); BO.now(); };
        if (q('[data-depot]')) q('[data-depot]').onclick = () => { VX.moveTo(id, 'hq'); UI.toast('Retour au dépôt', e.name + ' est disponible', 'ok', 'check'); BO.now(); };
        q('[data-sal]').onclick = () => { showSal = !showSal; q('[data-sal]').classList.toggle('blur', !showSal); };
        q('[data-addc]').onclick = () => addCert(id);
        d.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => BO.renewCert(id, b.dataset.renew));
        q('[data-abs]').onclick = () => BO.absenceForm({ empId: id });
        d.querySelectorAll('[data-ab]').forEach(b => b.onclick = () => BO.absenceForm({}, b.dataset.ab));
        q('[data-edit]').onclick = () => BO.empForm(id);
      },
    });
  };

  function render(el, p) {
    const S = VX.S;
    if (p.id && VX.emp(p.id)) { const id = p.id; p.id = null; setTimeout(() => BO.empDrawer(id), 30); }
    const all = S.employees;
    let rows = all.slice();
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(e => (e.name + ' ' + VX.roleLabel(e.role) + ' ' + (e.title || '') + ' ' + e.phone).toLowerCase().includes(q)); }
    if (st.role) rows = rows.filter(e => e.role === st.role);
    if (st.site) rows = rows.filter(e => e.siteId === st.site);
    if (st.status === 'present') rows = rows.filter(e => e.status === 'present');
    if (st.status === 'absent') rows = rows.filter(e => e.status === 'absent');
    if (st.status === 'dispo') rows = rows.filter(e => e.siteId === 'hq' && BO.isField(e) && e.status === 'present');
    const soon = certsSoon(), payroll = all.reduce((a, e) => a + e.salary, 0);
    const roles = Object.keys(VX.ROLES).map(r => [r, all.filter(e => e.role === r).length]).filter(x => x[1]).sort((a, b) => b[1] - a[1]);
    el.innerHTML = `<div class="bo-page">${BO.head('Employés', `${all.length} collaborateurs · ${all.filter(e => !BO.isField(e)).length} au bureau · ${all.filter(BO.isField).length} sur le terrain`, `<button class="btn" data-csv>${UI.icon('download', 16)}Export</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouveau collaborateur</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Effectif', v: all.length, s: `${all.filter(e => e.status === 'present').length} présents aujourd’hui`, icon: 'users', cls: 'hero' })}
        ${BO.kpi({ lb: 'Sur chantier', v: all.filter(e => e.siteId !== 'hq' && e.status === 'present').length, s: `${BO.activeSites().length} chantiers actifs`, icon: 'helmet' })}
        ${BO.kpi({ lb: 'Disponibles', v: all.filter(e => e.siteId === 'hq' && BO.isField(e) && e.status === 'present').length, s: 'personnel terrain au dépôt', icon: 'user', cls: 'green' })}
        ${BO.kpi({ lb: 'Absents', v: all.filter(e => e.status === 'absent').length, s: all.filter(e => e.status === 'absent').map(e => esc(e.first)).join(', ') || '—', icon: 'calendar', cls: 'amber' })}
        ${BO.kpi({ lb: 'Certificats à renouveler', v: soon.length, s: `${soon.filter(x => x.d < 0).length} expiré(s) · < 90 jours`, icon: 'shield', cls: soon.some(x => x.d < 30) ? 'red' : '' })}
        ${BO.kpi({ lb: 'Masse salariale', v: `<span class="blur" data-pay>${BO.num(payroll / 1000)} k</span>`, s: 'CHF brut / mois · cliquer pour afficher', icon: 'lock' })}
      </div>
      <div class="g g-main"><div style="min-width:0">
        <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="Nom, métier, téléphone…" value="${esc(st.q)}">${UI.icon('search')}</div>
          <select class="inp" data-f="role">${BO.opts(BO.optRoles(), st.role, 'Tous les métiers')}</select>
          <select class="inp" data-f="site">${BO.opts(BO.optSites(true), st.site, 'Tous les lieux')}</select>
          ${BO.seg('status', [['all', 'Tous'], ['present', 'Présents'], ['absent', 'Absents'], ['dispo', 'Disponibles']], st.status)}</div>
        <div data-t></div></div>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          <div class="card"><div class="card-h"><h3>${UI.icon('shield', 18)}Certificats à renouveler</h3></div>${soon.length ? `<div class="mini-list" style="padding:0 16px 8px">${soon.map(x => { const s = certState(x.c); return `<div>${UI.avatar(x.e, 28)}<div style="flex:1;min-width:0;cursor:pointer" data-open-emp="${x.e.id}"><b class="sm-t">${esc(x.e.name)}</b><div class="xs-t muted">${esc(x.c.n)}</div></div><span class="chip ${s.cls}" title="${BO.date(x.c.exp)}">${x.d < 0 ? 'Expiré' : x.d + ' j'}</span><button class="btn sm" data-renew="${x.e.id}|${esc(x.c.n)}">Renouveler</button></div>`; }).join('')}</div>` : BO.empty('check', 'Tout est à jour', '', '', true)}</div>
          <div class="card pad"><h2 class="sec">${UI.icon('chart', 18)}Répartition par métier</h2>${roles.map(([r, n]) => `<div class="row sm-t" style="margin:7px 0"><i class="dot-s" style="background:${VX.ROLES[r].color}"></i><span style="width:150px" class="b">${esc(VX.ROLES[r].label)}</span><div class="bar" style="flex:1"><i style="width:${n / roles[0][1] * 100}%;background:${VX.ROLES[r].color}"></i></div><b style="width:22px;text-align:right">${n}</b></div>`).join('')}</div>
        </div></div></div>`;
    BO.table(el.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: e => BO.empDrawer(e.id),
      cols: [
        { k: 'name', label: 'Collaborateur', get: e => e.last, render: e => BO.empCell(e) },
        { k: 'role', label: 'Métier', get: e => VX.roleLabel(e.role), render: e => `<span class="tag" style="background:${e.color}1f;color:var(--ink)">${esc(VX.roleLabel(e.role))}</span>` },
        { k: 'site', label: 'Lieu', get: e => BO.siteName(e.siteId), render: e => BO.pillSite(e.siteId) },
        { k: 'task', label: 'Tâche', get: e => e.taskId ? VX.task(e.taskId).title : '', render: e => e.taskId && VX.task(e.taskId) ? `<span class="sm-t lnk" data-open-task="${e.taskId}">${esc(VX.task(e.taskId).title)}</span>` : '<span class="muted">—</span>' },
        { k: 'status', label: 'Statut', render: e => e.status === 'absent' ? `<span class="chip red" title="${esc(e.absence || '')}">Absent·e</span>` : e.siteId === 'hq' && BO.isField(e) ? '<span class="chip green">Disponible</span>' : '<span class="chip">Présent·e</span>' },
        { k: 'certs', label: 'Certificats', get: e => Math.min(999, ...(e.certs || []).map(c => c.exp ? diffDays(today(), c.exp) : 999)), render: e => { if (!(e.certs || []).length) return '<span class="muted">—</span>'; const w = (e.certs || []).map(certState).sort((a, b) => (a.d ?? 999) - (b.d ?? 999))[0]; return `<span class="chip ${w.cls}">${e.certs.length} · ${esc(w.l === 'Valide' || w.l === 'Permanent' ? 'OK' : w.l)}</span>`; } },
        { k: 'phone', label: 'Mobile', render: e => `<span class="sm-t nowrap">${esc(e.phone)}</span>` },
        { k: 'm', label: '', nosort: true, render: e => `<button class="icon-btn" title="Voir sur la carte" data-map="employee:${e.id}">${UI.icon('map', 16)}</button>` },
      ],
    });
    BO.bindSearch(el, v => st.q = v);
    el.querySelectorAll('[data-f]').forEach(s => s.addEventListener('change', () => { st[s.dataset.f] = s.value; APP.refresh(); }));
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-new]').addEventListener('click', () => BO.empForm());
    el.querySelector('[data-pay]').addEventListener('click', e => e.target.classList.toggle('blur'));
    el.querySelectorAll('[data-renew]').forEach(b => b.addEventListener('click', () => { const [id, n] = b.dataset.renew.split('|'); BO.renewCert(id, n); }));
    el.querySelector('[data-csv]').addEventListener('click', () => { BO.download('employes-vanteo-' + today() + '.csv', BO.csv([['Nom', 'Prénom', 'Métier', 'Poste', 'Lieu', 'Statut', 'Mobile', 'E-mail', 'Entrée']].concat(rows.map(e => [e.last, e.first, VX.roleLabel(e.role), e.title || '', BO.siteName(e.siteId), e.status === 'absent' ? 'Absent' : 'Présent', e.phone, e.email, e.hire]))), 'text/csv;charset=utf-8'); UI.toast('Export prêt', rows.length + ' collaborateurs', 'ok', 'download'); });
  }
  APP.register({ id: 'staff', label: 'Employés', icon: 'users', group: 'Équipes', order: 21, render, badge: () => certsSoon().filter(x => x.d < 30).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Pointage & heures : semaine par employé / chantier / tâche,
   validation, heures supplémentaires, imputation aux tâches, export CSV
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, addDays, diffDays } = U;
  const st = { week: null, view: 'emp', site: '', role: '', pending: false, q: '', sel: new Set(), tbl: { sort: 'name', dir: 'asc' } };
  const BASE = e => VX.ROLES[e.role].hq ? 42 : 41.5;                     // CN secteur principal construction ≈ 41,5 h
  const rate = e => VX.ROLES[e.role].rate || 70;

  const weekOf = () => {
    if (st.week == null) { const ws = U.weekStart(today()); st.week = VX.S.timesheets.some(t => t.date >= ws && t.date < today()) ? 0 : -1; }
    const ws = addDays(U.weekStart(today()), st.week * 7);
    return { ws, days: Array.from({ length: 5 }, (_, i) => addDays(ws, i)), sat: addDays(ws, 5) };
  };

  /** saisie / correction d'heures — impute la différence à la tâche */
  BO.hoursForm = ({ empId, date, taskId, id } = {}) => {
    const S = VX.S, ex = id ? S.timesheets.find(t => t.id === id) : (empId && date ? S.timesheets.find(t => t.empId === empId && t.date === date) : null);
    const e0 = VX.emp(ex ? ex.empId : empId);
    const taskOpts = sid => VX.S.tasks.filter(t => t.siteId === sid && (t.status !== 'done' || (ex && t.id === ex.taskId))).map(t => [t.id, t.title]);
    const sid0 = ex ? ex.siteId : (taskId ? VX.task(taskId).siteId : e0 ? e0.siteId : 'hq');
    const fields = [
      { k: 'empId', label: 'Collaborateur', type: 'select', opts: BO.optEmps(), req: true, full: true },
      { k: 'date', label: 'Date', type: 'date', req: true, validate: v => v > today() ? 'Pas de pointage dans le futur' : '' },
      { k: 'hours', label: 'Heures', type: 'number', min: 0.25, max: 14, step: 0.25, req: true, help: 'Pause de midi déduite' },
      { k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(true), req: true },
      { k: 'taskId', label: 'Tâche imputée', type: 'select', opts: taskOpts(sid0), empty: '— aucune —' },
      { k: 'note', label: 'Commentaire', full: true, ph: 'ex. heures de nuit bétonnage' },
      { k: 'validated', label: 'Validé par le chef de chantier', type: 'checkbox', full: true },
    ];
    BO.formModal({
      title: ex ? 'Corriger le pointage' : 'Saisir des heures', fields,
      values: ex ? Object.assign({}, ex) : { empId: e0 ? e0.id : '', date: date || today(), hours: 8.5, siteId: sid0, taskId: taskId || (e0 && e0.siteId === sid0 ? e0.taskId : '') || '', validated: false },
      onMount: el => { const s = el.querySelector('[name=siteId]'), t = el.querySelector('[name=taskId]'), em = el.querySelector('[name=empId]');
        s.addEventListener('change', () => { t.innerHTML = BO.opts(taskOpts(s.value), '', '— aucune —'); });
        em.addEventListener('change', () => { const e = VX.emp(em.value); if (e && !ex) { s.value = e.siteId; t.innerHTML = BO.opts(taskOpts(e.siteId), e.taskId, '— aucune —'); } }); },
      danger: ex ? { title: 'Supprimer ce pointage ?', text: BO.h(ex.hours) + ' le ' + BO.date(ex.date) + ' seront retirées.', run: () => { VX.remove('timesheets', ex.id, 'timesheet'); UI.toast('Pointage supprimé', '', 'ok'); } } : null,
      onSubmit: v => {
        const dup = !ex && S.timesheets.find(t => t.empId === v.empId && t.date === v.date && t.taskId === (v.taskId || null) && t.siteId === v.siteId);
        const base = ex || dup;
        const prevH = base ? base.hours : 0, prevTask = base ? base.taskId : null;
        const o = { id: base ? base.id : U.uid('h'), empId: v.empId, date: v.date, hours: dup && !ex ? dup.hours + v.hours : v.hours, siteId: v.siteId, taskId: v.taskId || null, validated: !!v.validated, note: v.note || '' };
        VX.upsert('timesheets', o, 'timesheet');
        if (o.taskId) { const delta = o.taskId === prevTask ? o.hours - prevH : o.hours; if (delta > 0) VX.addTaskProgress(o.taskId, delta); }
        UI.toast('Heures enregistrées', BO.empName(v.empId) + ' · ' + BO.h(o.hours) + ' le ' + U.fmtDate(v.date), 'ok', 'clock');
      },
    });
  };

  function prefillToday() {
    const S = VX.S, t0 = today(), d = U.parse(t0).getDay();
    if (d === 0 || d === 6) { UI.toast('Week-end', 'Pas de pré-remplissage le week-end.', 'info'); return; }
    const todo = S.employees.filter(e => e.status === 'present' && !S.timesheets.some(t => t.empId === e.id && t.date === t0));
    if (!todo.length) { UI.toast('Déjà fait', 'Tout le monde a des heures pour aujourd’hui.', 'info'); return; }
    BO.confirm('Pré-remplir la journée ?', `<b>${todo.length} collaborateurs</b> présents n’ont pas encore d’heures aujourd’hui. On crée un pointage standard (8,5 h terrain / 8,4 h bureau) sur leur chantier et leur tâche actuels, <b>à valider</b> ensuite. Les heures alimentent l’avancement des tâches.`, 'Pré-remplir', () => {
      const perTask = {};
      todo.forEach(e => { const h = BO.isField(e) ? 8.5 : 8.4; S.timesheets.push({ id: U.uid('h'), empId: e.id, date: t0, hours: h, siteId: e.siteId, taskId: e.taskId, validated: false }); if (e.taskId) perTask[e.taskId] = (perTask[e.taskId] || 0) + h; });
      VX.log('Pointage du jour pré-rempli (' + todo.length + ' pers.)', 'note'); VX.save(); VX.emit('timesheet', { bulk: true });
      Object.entries(perTask).forEach(([tid, h]) => VX.addTaskProgress(tid, h));
      UI.toast('Journée pré-remplie', todo.length + ' pointages créés · à valider', 'ok', 'clock');
    });
  }
  function validate(ids, label) {
    const S = VX.S; let n = 0;
    S.timesheets.forEach(t => { if (ids.has(t.id) && !t.validated) { t.validated = true; n++; } });
    if (!n) { UI.toast('Rien à valider', 'Toutes les heures sélectionnées sont déjà validées.', 'info'); return; }
    VX.log(n + ' pointages validés' + (label ? ' – ' + label : ''), 'done'); VX.save(); VX.emit('timesheet', { validated: n });
    st.sel.clear(); UI.toast('Heures validées', n + ' saisies validées', 'ok', 'check');
  }

  function render(el, p) {
    const S = VX.S, t0 = today(), { ws, days, sat } = weekOf();
    const all = S.timesheets.filter(t => t.date >= ws && t.date <= addDays(ws, 6));
    let emps = S.employees.slice();
    if (st.site) emps = emps.filter(e => e.siteId === st.site || all.some(t => t.empId === e.id && t.siteId === st.site));
    if (st.role) emps = emps.filter(e => e.role === st.role);
    if (st.q) { const q = st.q.toLowerCase(); emps = emps.filter(e => e.name.toLowerCase().includes(q)); }
    const entriesOf = id => all.filter(t => t.empId === id && (!st.site || t.siteId === st.site));
    if (st.pending) emps = emps.filter(e => entriesOf(e.id).some(t => !t.validated));
    const tot = all.reduce((a, t) => a + t.hours, 0), val = all.filter(t => t.validated).reduce((a, t) => a + t.hours, 0);
    const ot = S.employees.reduce((a, e) => a + Math.max(0, all.filter(t => t.empId === e.id).reduce((x, t) => x + t.hours, 0) - BASE(e)), 0);
    const cost = all.reduce((a, t) => { const e = VX.emp(t.empId); return a + t.hours * (e ? rate(e) : 70); }, 0);
    const missing = []; days.filter(d => d < t0).forEach(d => S.employees.forEach(e => { if (e.status === 'present' && !S.timesheets.some(t => t.empId === e.id && t.date === d) && !(S.absences || []).some(a => a.empId === e.id && a.status === 'Validée' && a.from <= d && a.to >= d)) missing.push([e, d]); }));
    const pend = all.filter(t => !t.validated);
    const isCur = st.week === 0;
