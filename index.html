    el.innerHTML = `<div class="bo-page">${BO.head('Pointage & heures', `Semaine ${weekNo(ws)} · du ${U.fmtDate(days[0], { day: 'numeric', month: 'long' })} au ${U.fmtDate(days[4], { day: 'numeric', month: 'long' })} · base CN 41,5 h terrain / 42 h bureau`,
      `<div class="seg"><button data-wk="-1">${BO.xi('arrowL', 15)}</button><button data-wk="0" class="${isCur ? 'on' : ''}">Cette semaine</button><button data-wk="1" ${st.week >= 0 ? 'disabled style="opacity:.4"' : ''}>${BO.xi('arrowR', 15)}</button></div>
       <button class="btn" data-csv>${UI.icon('download', 16)}Export CSV</button>${isCur ? `<button class="btn" data-prefill>${BO.icon('sparkles', 16)}Pré-remplir aujourd’hui</button>` : ''}<button class="btn" data-add>${UI.icon('plus', 16)}Saisir</button><button class="btn pri" data-valall ${pend.length ? '' : 'disabled'}>${UI.icon('check', 16)}Valider la semaine${pend.length ? ' (' + pend.length + ')' : ''}</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Heures pointées', v: BO.num(tot, 1) + '<small>h</small>', s: `${new Set(all.map(t => t.empId)).size} collaborateurs`, icon: 'clock', cls: 'hero' })}
        ${BO.kpi({ lb: 'Validées', v: tot ? BO.pct(val / tot) : '—', s: `${pend.length} saisie${pend.length > 1 ? 's' : ''} en attente`, icon: 'check', cls: pend.length ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Heures supplémentaires', v: BO.num(ot, 1) + '<small>h</small>', s: 'au-delà de l’horaire de base', icon: 'flame', cls: ot > 40 ? 'red' : '' })}
        ${BO.kpi({ lb: 'Coût main-d’œuvre', v: chfK(cost), s: 'heures × taux interne', icon: 'coins' })}
        ${BO.kpi({ lb: 'Saisies manquantes', v: missing.length, s: missing.length ? 'jours écoulés sans pointage' : 'aucun oubli', icon: 'alert', cls: missing.length ? 'amber' : 'green' })}
      </div>
      <div class="toolbar">${BO.seg('view', [['emp', UI.icon('users', 15) + 'Par employé'], ['site', UI.icon('crane', 15) + 'Par chantier'], ['task', BO.xi('list', 15) + 'Par tâche']], st.view)}
        ${st.view === 'emp' ? `<div class="srch"><input class="inp" data-q placeholder="Collaborateur…" value="${esc(st.q)}" style="min-width:180px">${UI.icon('search')}</div><select class="inp" data-f="site">${BO.opts(BO.optSites(true), st.site, 'Tous les chantiers')}</select><select class="inp" data-f="role">${BO.opts(BO.optRoles(), st.role, 'Tous les métiers')}</select><label class="chk" style="padding:4px 8px"><input type="checkbox" data-pend ${st.pending ? 'checked' : ''}> À valider seulement</label>` : ''}
        <span class="sp"></span>${st.view === 'emp' && st.sel.size ? `<button class="btn sm pri" data-valsel>${UI.icon('check', 14)}Valider la sélection (${st.sel.size})</button>` : ''}<span class="legend"><span><i style="background:var(--green-soft);border:1px solid #167a41"></i>Validé</span><span><i style="background:var(--amber-soft);border:1px solid #a96200"></i>À valider</span></span></div>
      <div data-body></div></div>`;
    const body = el.querySelector('[data-body]');

    if (st.view === 'emp') {
      const dayH = (id, d) => { const es = entriesOf(id).filter(t => t.date === d); return { h: es.reduce((a, t) => a + t.hours, 0), v: es.length && es.every(t => t.validated), n: es.length }; };
      const satH = id => entriesOf(id).filter(t => t.date === sat).reduce((a, t) => a + t.hours, 0);
      const cols = [
        { k: 'sel', label: `<input type="checkbox" data-all style="width:16px;height:16px;accent-color:var(--tq)">`, nosort: true, w: '36px', render: e => entriesOf(e.id).some(t => !t.validated) ? `<input type="checkbox" data-sel="${e.id}" ${st.sel.has(e.id) ? 'checked' : ''} style="width:16px;height:16px;accent-color:var(--tq)">` : '' },
        { k: 'name', label: 'Collaborateur', get: e => e.last, render: e => BO.empCell(e, VX.roleLabel(e.role) + ' · ' + (e.siteId === 'hq' ? 'Siège' : VX.site(e.siteId).code)) },
        ...days.map((d, i) => ({ k: 'd' + i, label: `${esc(BO.dayName(d))} ${U.parse(d).getDate()}`, num: true, get: e => dayH(e.id, d).h, render: e => { const x = dayH(e.id, d); const abs = (S.absences || []).find(a => a.empId === e.id && a.status === 'Validée' && a.from <= d && a.to >= d); return x.n ? `<span class="hcell ${x.v ? 'val' : 'pend'} ${x.h > 10 ? 'ot' : ''}" data-cell="${e.id}|${d}" title="${x.n > 1 ? x.n + ' saisies' : ''}">${BO.num(x.h, x.h % 1 ? 2 : 0)}</span>` : abs ? `<span class="hcell none" title="${esc(abs.type)}">${esc(abs.type.slice(0, 3))}.</span>` : d > t0 ? '<span class="hcell none">·</span>' : `<span class="hcell none" data-cell="${e.id}|${d}" title="Saisir">${d < t0 && e.status === 'present' ? '<b class="warn-t">+</b>' : '+'}</span>`; } })),
        { k: 'tot', label: 'Total', num: true, get: e => entriesOf(e.id).reduce((a, t) => a + t.hours, 0), render: e => { const h = entriesOf(e.id).reduce((a, t) => a + t.hours, 0); const s = satH(e.id); return `<b>${BO.num(h, 1)}</b>${s ? `<div class="t2">dont sam. ${BO.num(s, 1)}</div>` : ''}`; } },
        { k: 'ot', label: 'H. sup.', num: true, get: e => entriesOf(e.id).reduce((a, t) => a + t.hours, 0) - BASE(e), render: e => { const o = entriesOf(e.id).reduce((a, t) => a + t.hours, 0) - BASE(e); return o > 0 ? `<b class="${o > 5 ? 'bad-t' : 'warn-t'}">+${BO.num(o, 1)}</b>` : '<span class="muted">—</span>'; } },
        { k: 'st', label: 'Statut', get: e => entriesOf(e.id).some(t => !t.validated) ? 0 : 1, render: e => { const es = entriesOf(e.id); return !es.length ? '<span class="chip grey">Aucune saisie</span>' : es.every(t => t.validated) ? '<span class="chip green">Validé</span>' : `<button class="btn sm" data-val="${e.id}">${UI.icon('check', 13)}Valider</button>`; } },
      ];
      BO.table(body, { rows: emps, state: st.tbl, cols, cls: 'compact', foot: rows => `<td></td><td>Total (${rows.length})</td>${days.map(d => `<td class="num">${BO.num(rows.reduce((a, e) => a + dayH(e.id, d).h, 0), 1)}</td>`).join('')}<td class="num">${BO.num(rows.reduce((a, e) => a + entriesOf(e.id).reduce((x, t) => x + t.hours, 0), 0), 1)}</td><td></td><td></td>` });
      body.querySelectorAll('[data-cell]').forEach(c => c.addEventListener('click', () => { const [e, d] = c.dataset.cell.split('|'); BO.hoursForm({ empId: e, date: d }); }));
      body.querySelectorAll('[data-val]').forEach(b => b.addEventListener('click', () => validate(new Set(entriesOf(b.dataset.val).map(t => t.id)), BO.empName(b.dataset.val))));
      body.querySelectorAll('[data-sel]').forEach(c => c.addEventListener('change', () => { c.checked ? st.sel.add(c.dataset.sel) : st.sel.delete(c.dataset.sel); APP.refresh(); }));
      const ca = body.querySelector('[data-all]'); if (ca) { ca.checked = st.sel.size > 0 && emps.filter(e => entriesOf(e.id).some(t => !t.validated)).every(e => st.sel.has(e.id)); ca.addEventListener('change', () => { emps.forEach(e => { if (entriesOf(e.id).some(t => !t.validated)) ca.checked ? st.sel.add(e.id) : st.sel.delete(e.id); }); APP.refresh(); }); }
    } else if (st.view === 'site') {
      const sites = S.sites.filter(s => all.some(t => t.siteId === s.id) || BO.activeSites().includes(s));
      const sh = (sid, d) => all.filter(t => t.siteId === sid && (!d || t.date === d));
      BO.table(body, {
        rows: sites, state: {}, onRow: s => { st.view = 'emp'; st.site = s.id; APP.refresh(); },
        cols: [
          { k: 'name', label: 'Chantier', render: s => `<div class="who"><span class="sc-ic" style="width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;background:${s.color}">${UI.icon((VX.SITE_TYPES[s.type] || {}).icon || 'building', 16)}</span><div><div class="t1">${esc(s.id === 'hq' ? 'Siège / dépôt' : s.name)}</div><div class="t2">${new Set(sh(s.id).map(t => t.empId)).size} personnes</div></div></div>` },
          ...days.map((d, i) => ({ k: 'd' + i, label: `${esc(BO.dayName(d))} ${U.parse(d).getDate()}`, num: true, get: s => sh(s.id, d).reduce((a, t) => a + t.hours, 0), render: s => { const h = sh(s.id, d).reduce((a, t) => a + t.hours, 0); return h ? `<b>${BO.num(h, 1)}</b><div class="t2">${new Set(sh(s.id, d).map(t => t.empId)).size} pers.</div>` : '<span class="muted">—</span>'; } })),
          { k: 'tot', label: 'Total h', num: true, get: s => sh(s.id).reduce((a, t) => a + t.hours, 0), render: s => `<b>${BO.num(sh(s.id).reduce((a, t) => a + t.hours, 0), 1)}</b>` },
          { k: 'cost', label: 'Coût M.O.', num: true, get: s => sh(s.id).reduce((a, t) => a + t.hours * rate(VX.emp(t.empId) || { role: 'macon' }), 0), render: s => chf(sh(s.id).reduce((a, t) => a + t.hours * rate(VX.emp(t.empId) || { role: 'macon' }), 0)) },
          { k: 'pend', label: 'À valider', num: true, get: s => sh(s.id).filter(t => !t.validated).length, render: s => { const n = sh(s.id).filter(t => !t.validated).length; return n ? `<button class="btn sm" data-vs="${s.id}">${UI.icon('check', 13)}Valider ${n}</button>` : '<span class="chip green">OK</span>'; } },
        ],
        foot: rows => `<td>Total</td>${days.map(d => `<td class="num">${BO.num(all.filter(t => t.date === d).reduce((a, t) => a + t.hours, 0), 1)}</td>`).join('')}<td class="num">${BO.num(tot, 1)}</td><td class="num">${chf(cost)}</td><td></td>`,
      });
      body.querySelectorAll('[data-vs]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); validate(new Set(sh(b.dataset.vs).map(t => t.id)), BO.siteName(b.dataset.vs)); }));
    } else {
      const tasks = S.tasks.filter(t => t.status !== 'done' || all.some(x => x.taskId === t.id));
      const wh = id => all.filter(x => x.taskId === id).reduce((a, x) => a + x.hours, 0);
      BO.table(body, {
        rows: tasks, state: { sort: 'wk', dir: 'desc' }, onRow: t => BO.taskDrawer(t.id),
        cols: [
          { k: 'title', label: 'Tâche', render: t => `<div class="t1">${esc(t.title)}</div><div class="t2">CFC ${esc(t.cfc)}</div>` },
          { k: 'site', label: 'Chantier', get: t => BO.siteName(t.siteId), render: t => BO.pillSite(t.siteId) },
          { k: 'status', label: 'Statut', render: t => UI.statusChip(t.status) },
          { k: 'wk', label: 'Semaine', num: true, get: t => wh(t.id), render: t => wh(t.id) ? `<b>${BO.num(wh(t.id), 1)} h</b>` : '<span class="muted">—</span>' },
          { k: 'doneH', label: 'Réalisé / prévu', num: true, render: t => `${BO.num(t.doneH)} / ${BO.num(t.plannedH)} h` },
          { k: 'progress', label: 'Avancement', render: t => BO.prog(t.progress, t.doneH > t.plannedH * .9 && t.status !== 'done' ? 'amber' : '') },
          { k: 'a', label: '', nosort: true, render: t => t.status !== 'done' ? `<button class="btn sm" data-imp="${t.id}">${UI.icon('plus', 13)}Imputer</button>` : '' },
        ],
      });
      body.querySelectorAll('[data-imp]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); const t = VX.task(b.dataset.imp); BO.hoursForm({ empId: t.assignees[0], taskId: t.id, date: t0 }); }));
    }

    el.querySelectorAll('[data-wk]').forEach(b => b.addEventListener('click', () => { const v = +b.dataset.wk; st.week = v === 0 ? 0 : Math.min(0, st.week + v); st.sel.clear(); APP.refresh(); }));
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    BO.bindSearch(el, v => st.q = v);
    el.querySelectorAll('[data-f]').forEach(s => s.addEventListener('change', () => { st[s.dataset.f] = s.value; APP.refresh(); }));
    const pc = el.querySelector('[data-pend]'); if (pc) pc.addEventListener('change', () => { st.pending = pc.checked; APP.refresh(); });
    el.querySelector('[data-add]').addEventListener('click', () => BO.hoursForm({ date: t0 }));
    const pf = el.querySelector('[data-prefill]'); if (pf) pf.addEventListener('click', prefillToday);
    el.querySelector('[data-valall]').addEventListener('click', () => BO.confirm('Valider la semaine ?', `${pend.length} saisies (${BO.num(pend.reduce((a, t) => a + t.hours, 0), 1)} h) seront validées et transmises aux salaires.`, 'Valider tout', () => validate(new Set(pend.map(t => t.id)), 'semaine ' + weekNo(ws))));
    const vs = el.querySelector('[data-valsel]'); if (vs) vs.addEventListener('click', () => validate(new Set(all.filter(t => st.sel.has(t.empId)).map(t => t.id)), 'sélection'));
    el.querySelector('[data-csv]').addEventListener('click', () => {
      const rows = all.slice().sort((a, b) => a.date.localeCompare(b.date) || BO.empName(a.empId).localeCompare(BO.empName(b.empId)));
      BO.download(`pointage-S${weekNo(ws)}-${ws}.csv`, BO.csv([['Date', 'Collaborateur', 'Métier', 'Chantier', 'Code', 'Tâche', 'CFC', 'Heures', 'Validé', 'Commentaire']].concat(rows.map(t => { const e = VX.emp(t.empId) || {}, s = VX.site(t.siteId) || {}, k = t.taskId ? VX.task(t.taskId) : null; return [t.date, e.name, VX.roleLabel(e.role), s.name, s.code, k ? k.title : '', k ? k.cfc : '', String(t.hours).replace('.', ','), t.validated ? 'oui' : 'non', t.note || '']; }))), 'text/csv;charset=utf-8');
      UI.toast('Export CSV prêt', rows.length + ' lignes · semaine ' + weekNo(ws), 'ok', 'download');
    });
  }
  const weekNo = s => { const d = U.parse(s); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); };
  APP.register({ id: 'timesheets', label: 'Pointage & heures', icon: 'clock', group: 'Équipes', order: 22, render, badge: () => VX.S.timesheets.filter(t => !t.validated && t.date < today()).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Clients / maîtres d'ouvrage : liste + fiche 360°
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, diffDays } = U;
  const st = { q: '', type: '', tbl: { sort: 'ca', dir: 'desc' } };
  const TYPES = ['Public', 'Coopérative', 'Privé', 'Investisseur', 'Fondation', 'Entreprise', 'Régie / gérance'];
  const TYPE_COL = { Public: 'blue', Coopérative: 'violet', Privé: 'grey', Investisseur: 'amber', Fondation: 'green', Entreprise: '', 'Régie / gérance': 'grey' };

  const stats = c => {
    const S = VX.S, inv = S.invoices.filter(i => i.clientId === c.id), sites = S.sites.filter(s => s.clientId === c.id);
    const ca = inv.reduce((a, i) => a + (i.ht || 0), 0) + sites.reduce((a, s) => a + (s.billedHist || 0), 0);
    const open = inv.filter(i => i.status !== 'Payée').reduce((a, i) => a + i.amount - (i.paid || 0), 0);
    const late = inv.filter(i => i.status === 'En retard').reduce((a, i) => a + i.amount - (i.paid || 0), 0);
    const quotes = S.quotes.filter(q => q.clientId === c.id), deals = S.deals.filter(d => d.clientId === c.id);
    const lastNote = (c.notes || []).reduce((m, n) => Math.max(m, n.at), 0);
    return { inv, sites, ca, open, late, quotes, deals, lastNote };
  };

  BO.clientForm = (id, after) => {
    const c = id ? VX.client(id) : null;
    BO.formModal({
      title: c ? 'Modifier le client' : 'Nouveau client',
      fields: [
        { k: 'name', label: 'Raison sociale / nom', req: true, full: true }, { k: 'type', label: 'Type', type: 'select', opts: TYPES }, { k: 'city', label: 'Localité', req: true },
        { k: 'contact', label: 'Interlocuteur', req: true }, { k: 'role', label: 'Fonction' }, { k: 'email', label: 'E-mail', type: 'email', req: true }, { k: 'phone', label: 'Téléphone', type: 'tel', req: true },
        { k: 'address', label: 'Adresse', full: true, ph: 'Rue, NPA localité' }, { k: 'ide', label: 'N° IDE', ph: 'CHE-…' }, { k: 'terms', label: 'Délai de paiement (jours)', type: 'number', min: 0, max: 120, step: 1 },
      ],
      values: c || { type: 'Privé', terms: 30 },
      onSubmit: v => {
        if (c) { VX.upsert('clients', Object.assign({ id: c.id }, v), 'clients'); UI.toast('Client mis à jour', v.name, 'ok', 'check'); }
        else { const nc = Object.assign({ id: U.uid('c'), since: new Date().getFullYear(), notes: [] }, v); VX.upsert('clients', nc, 'clients'); VX.log('Nouveau client : ' + nc.name, 'note'); VX.save(); UI.toast('Client créé', nc.name, 'ok', 'user'); if (after) after(nc); else APP.open('clients', { id: nc.id }); }
      },
    });
  };

  function renderList(el) {
    const S = VX.S;
    let rows = S.clients.slice();
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(c => (c.name + ' ' + c.contact + ' ' + c.city).toLowerCase().includes(q)); }
    if (st.type) rows = rows.filter(c => c.type === st.type);
    const all = S.clients.map(c => [c, stats(c)]);
    el.innerHTML = `<div class="bo-page">${BO.head('Clients & maîtres d’ouvrage', `${S.clients.length} clients · publics, coopératives, privés, investisseurs`, `<button class="btn" data-csv>${UI.icon('download', 16)}Export</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouveau client</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'CA facturé cumulé', v: chfK(all.reduce((a, [, s]) => a + s.ca, 0)), s: 'HT, chantiers en cours', icon: 'invoice', cls: 'hero' })}
        ${BO.kpi({ lb: 'Solde ouvert', v: chfK(all.reduce((a, [, s]) => a + s.open, 0)), s: 'factures non encaissées (TTC)', icon: 'coins' })}
        ${BO.kpi({ lb: 'Dont en retard', v: chfK(all.reduce((a, [, s]) => a + s.late, 0)), s: all.filter(([, s]) => s.late).map(([c]) => esc(c.name.split(' ')[0])).join(', ') || 'aucun retard', icon: 'alert', cls: all.some(([, s]) => s.late) ? 'red' : 'green', go: 'invoices' })}
        ${BO.kpi({ lb: 'Clients actifs', v: all.filter(([, s]) => s.sites.some(x => x.status !== 'Terminé') || s.quotes.some(q => /Envoy|Négo|Brouil/.test(q.status))).length, s: 'chantier ou offre en cours', icon: 'users' })}
      </div>
      <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="Nom, contact, localité…" value="${esc(st.q)}">${UI.icon('search')}</div>${BO.seg('type', [['', 'Tous']].concat(TYPES.filter(t => S.clients.some(c => c.type === t)).map(t => [t, t])), st.type)}</div>
      <div data-t></div></div>`;
    BO.table(el.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: c => APP.open('clients', { id: c.id }),
      cols: [
        { k: 'name', label: 'Client', render: c => `<div class="who"><span class="av" style="background:var(--tq-dd)">${esc(c.name.replace(/^(Commune|Famille|Garage|Fondation|Coopérative)( de| d’| d'|)\s*/i, '').slice(0, 2).toUpperCase())}</span><div><div class="t1">${esc(c.name)}</div><div class="t2">${esc(c.city)} · client depuis ${esc(c.since)}</div></div></div>` },
        { k: 'type', label: 'Type', render: c => `<span class="chip ${TYPE_COL[c.type] || ''}">${esc(c.type)}</span>` },
        { k: 'contact', label: 'Interlocuteur', render: c => `<div class="t1">${esc(c.contact)}</div><div class="t2">${esc(c.role || '')}</div>` },
        { k: 'sites', label: 'Chantiers', num: true, get: c => stats(c).sites.length, render: c => stats(c).sites.length || '<span class="muted">—</span>' },
        { k: 'quotes', label: 'Offres ouvertes', num: true, get: c => stats(c).quotes.filter(q => /Envoy|Négo|Brouil/.test(q.status)).length, render: c => stats(c).quotes.filter(q => /Envoy|Négo|Brouil/.test(q.status)).length || '<span class="muted">—</span>' },
        { k: 'ca', label: 'CA facturé HT', num: true, get: c => stats(c).ca, render: c => `<b>${chfK(stats(c).ca)}</b>` },
        { k: 'open', label: 'Solde ouvert', num: true, get: c => stats(c).open, render: c => { const s = stats(c); return s.open ? `<span class="${s.late ? 'bad-t b' : ''}">${chf(s.open)}</span>` : '<span class="muted">—</span>'; } },
      ],
    });
    BO.bindSearch(el, v => st.q = v);
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-new]').addEventListener('click', () => BO.clientForm());
    el.querySelector('[data-csv]').addEventListener('click', () => { BO.download('clients-vanteo.csv', BO.csv([['Client', 'Type', 'Localité', 'Contact', 'Fonction', 'E-mail', 'Téléphone', 'CA facturé HT', 'Solde ouvert']].concat(rows.map(c => { const s = stats(c); return [c.name, c.type, c.city, c.contact, c.role, c.email, c.phone, Math.round(s.ca), Math.round(s.open)]; }))), 'text/csv;charset=utf-8'); UI.toast('Export prêt', rows.length + ' clients', 'ok', 'download'); });
  }

  function renderDetail(el, p) {
    const c = VX.client(p.id), s = stats(c), S = VX.S;
    const days = s.lastNote ? Math.floor((Date.now() - s.lastNote) / 864e5) : null;
    el.innerHTML = `<div class="bo-page">${BO.head(`<span class="av" style="width:46px;height:46px;border-radius:14px;font-size:17px;background:var(--tq-dd)">${esc(c.name.slice(0, 2).toUpperCase())}</span>${esc(c.name)} <span class="chip ${TYPE_COL[c.type] || ''}">${esc(c.type)}</span>`, `${esc(c.city)} · client depuis ${esc(c.since)}${c.ide ? ' · IDE ' + esc(c.ide) : ''}`,
      `<button class="btn" data-edit>${UI.icon('edit', 16)}Modifier</button><button class="btn" data-deal>${UI.icon('target', 16)}Opportunité</button><button class="btn pri" data-quote>${UI.icon('quote', 16)}Nouvelle offre</button>`, BO.crumb([['Clients', 'clients'], [c.name]]))}
      <div class="kpis">
        ${BO.kpi({ lb: 'CA facturé', v: chfK(s.ca), s: 'HT cumulé', icon: 'invoice', cls: 'hero' })}
        ${BO.kpi({ lb: 'Solde ouvert', v: chfK(s.open), s: s.late ? `<span class="bad-t b">${chf(s.late)} en retard</span>` : 'aucun retard', icon: 'coins', cls: s.late ? 'red' : '' })}
        ${BO.kpi({ lb: 'Chantiers', v: s.sites.length, s: s.sites.filter(x => x.status !== 'Terminé').length + ' en cours', icon: 'crane' })}
        ${BO.kpi({ lb: 'Offres', v: s.quotes.length, s: chfK(s.quotes.filter(q => /Envoy|Négo/.test(q.status)).reduce((a, q) => a + BO.quoteTotals(q).ht, 0)) + ' en attente de réponse', icon: 'quote' })}
      </div>
      <div class="g g-main"><div style="min-width:0;display:flex;flex-direction:column;gap:16px">
        ${s.sites.length ? `<div><h2 class="sec">${UI.icon('crane', 18)}Chantiers</h2><div class="site-grid">${s.sites.map(BO.siteCard).join('')}</div></div>` : ''}
        <div class="card"><div class="card-h"><h3>${UI.icon('quote', 18)}Offres</h3></div><div data-q style="padding:0 6px 6px"></div></div>
        <div class="card"><div class="card-h"><h3>${UI.icon('invoice', 18)}Factures</h3></div><div data-i style="padding:0 6px 6px"></div></div>
      </div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
        <div class="card pad"><h2 class="sec">${UI.icon('user', 18)}Interlocuteur</h2><div class="row"><span class="av" style="width:42px;height:42px;background:#6c8a88">${esc(c.contact.split(' ').map(x => x[0]).join('').slice(-2))}</span><div><b>${esc(c.contact)}</b><div class="sm-t muted">${esc(c.role || '')}</div></div></div>
          <dl class="kv mt"><dt>E-mail</dt><dd><a class="lnk" href="mailto:${esc(c.email)}">${esc(c.email)}</a></dd><dt>Téléphone</dt><dd><a class="lnk" href="tel:${esc(c.phone.replace(/\s/g, ''))}">${esc(c.phone)}</a></dd>${c.address ? `<dt>Adresse</dt><dd>${esc(c.address)}</dd>` : ''}<dt>Paiement</dt><dd>${esc(c.terms || 30)} jours net</dd></dl></div>
        ${days == null || days > 30 ? `<div class="form-note warn">${BO.icon('bell', 17)}<div><b>${days == null ? 'Aucun échange consigné' : 'Aucun contact depuis ' + days + ' jours'}</b><br>Un appel de suivi entretient la relation. <a class="lnk" data-call>Consigner un appel</a></div></div>` : ''}
        <div class="card pad"><h2 class="sec">${UI.icon('edit', 18)}Notes & échanges</h2><textarea class="inp" data-note rows="3" placeholder="Compte rendu d’appel, de séance…"></textarea><div class="row mt" style="margin-top:8px"><span class="sp"></span><button class="btn sm pri" data-addnote>${UI.icon('plus', 13)}Ajouter</button></div>
          <div class="mini-list mt">${(c.notes || []).slice().sort((a, b) => b.at - a.at).map(n => `<div style="align-items:flex-start">${UI.avatar(VX.emp(n.by), 26)}<div style="flex:1"><div class="sm-t" style="line-height:1.45">${esc(n.text)}</div><div class="xs-t muted">${esc(BO.empName(n.by))} · ${BO.ago(n.at)}</div></div></div>`).join('') || '<div class="muted sm-t">Pas encore de note.</div>'}</div></div>
        <div class="card pad"><h2 class="sec">${UI.icon('target', 18)}Opportunités</h2>${s.deals.length ? `<div class="mini-list">${s.deals.map(d => `<div style="cursor:pointer" data-open="pipeline:${d.id}"><div style="flex:1"><b class="sm-t">${esc(d.title)}</b><div class="xs-t muted">${esc(d.stage)} · prochaine action ${BO.inDays(d.next)}</div></div><b class="sm-t">${chfK(d.amount)}</b></div>`).join('')}</div>` : '<div class="muted sm-t">Aucune opportunité.</div>'}</div>
      </div></div></div>`;
    BO.table(el.querySelector('[data-q]'), { cls: 'compact', rows: s.quotes, state: { sort: 'date', dir: 'desc' }, onRow: q => APP.open('quotes', { id: q.id }), empty: BO.empty('quote', 'Aucune offre', '', '', true), cols: [
      { k: 'no', label: 'N°', render: q => `<span class="code b">${esc(q.no)}</span>` }, { k: 'title', label: 'Objet', render: q => esc(q.title) }, { k: 'date', label: 'Date', render: q => BO.dateS(q.date) },
      { k: 'ht', label: 'HT', num: true, get: q => BO.quoteTotals(q).ht, render: q => chf(BO.quoteTotals(q).ht) }, { k: 'status', label: 'Statut', render: q => UI.statusChip(q.status) }] });
    BO.table(el.querySelector('[data-i]'), { cls: 'compact', rows: s.inv, state: { sort: 'date', dir: 'desc' }, onRow: i => APP.open('invoices', { id: i.id }), empty: BO.empty('invoice', 'Aucune facture', '', '', true), cols: [
      { k: 'no', label: 'N°', render: i => `<span class="code b">${esc(i.no)}</span>` }, { k: 'label', label: 'Libellé', render: i => esc(i.label) }, { k: 'due', label: 'Échéance', render: i => BO.dateS(i.due) },
      { k: 'amount', label: 'TTC', num: true, render: i => chf(i.amount) }, { k: 'rest', label: 'Reste', num: true, get: i => i.amount - (i.paid || 0), render: i => i.amount - (i.paid || 0) ? chf(i.amount - (i.paid || 0)) : '—' }, { k: 'status', label: 'Statut', render: i => UI.statusChip(i.status) }] });
    const addNote = text => { VX.upsert('clients', { id: c.id, notes: (c.notes || []).concat([{ at: Date.now(), by: VX.S.meId, text }]) }, 'clients'); UI.toast('Note ajoutée', c.name, 'ok', 'edit'); };
    el.querySelector('[data-addnote]').addEventListener('click', () => { const t = el.querySelector('[data-note]').value.trim(); if (!t) { UI.toast('Note vide', 'Écrivez quelques mots avant d’ajouter.', 'warn'); return; } el.querySelector('[data-note]').value = ''; el.querySelector('[data-note]').blur(); addNote(t); });
    const call = el.querySelector('[data-call]'); if (call) call.addEventListener('click', () => BO.formModal({ title: 'Consigner un appel – ' + c.contact, fields: [{ k: 'text', label: 'Compte rendu', type: 'textarea', req: true, full: true, v: I18N.t('Appel de suivi : point sur la satisfaction et les projets à venir.') + ' ' }], onSubmit: v => addNote('📞 ' + v.text) }));
    el.querySelector('[data-edit]').addEventListener('click', () => BO.clientForm(c.id));
    el.querySelector('[data-quote]').addEventListener('click', () => BO.newQuote({ clientId: c.id, title: 'Offre ' + c.name }));
    el.querySelector('[data-deal]').addEventListener('click', () => BO.dealForm(null, { clientId: c.id }));
  }

  function render(el, p) { if (p.id && VX.client(p.id)) renderDetail(el, p); else renderList(el); }
  APP.register({ id: 'clients', label: 'Clients', icon: 'building', group: 'Commercial & finance', order: 30, render });
})();
