        { k: 'contact', label: 'Agence / contact', req: true }, { k: 'phone', label: 'Téléphone', type: 'tel', req: true }, { k: 'email', label: 'E-mail commandes', type: 'email' },
        { k: 'terms', label: 'Délai de paiement (jours)', type: 'number', min: 0, max: 120, req: true }, { k: 'rating', label: 'Évaluation (1–5)', type: 'number', min: 1, max: 5, step: .1, req: true },
        { k: 'notes', label: 'Notes (qualité, ponctualité, conditions)', type: 'textarea', full: true, rows: 3 },
      ],
      values: f || { kind: 'Fournisseur', terms: 30, rating: 4 },
      onSubmit: v => { VX.upsert('suppliers', Object.assign({ id: f ? f.id : U.uid('f') }, v), 'suppliers'); UI.toast(f ? 'Fiche mise à jour' : 'Fournisseur ajouté', v.name, 'ok', 'check'); },
    });
  };

  function orders(body) {
    const S = VX.S, t0 = today();
    let rows = S.orders.slice();
    if (st.f === 'open') rows = rows.filter(o => o.status !== 'Livrée' && o.status !== 'Annulée');
    if (st.f === 'late') rows = rows.filter(isLate);
    if (st.f === 'today') rows = rows.filter(o => o.delivery === t0);
    if (st.f === 'done') rows = rows.filter(o => o.status === 'Livrée');
    if (st.site) rows = rows.filter(o => o.siteId === st.site);
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(o => (o.no + ' ' + o.label + ' ' + (VX.supplier(o.supplierId) || {}).name).toLowerCase().includes(q)); }
    body.innerHTML = `<div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="N°, article, fournisseur…" value="${esc(st.q)}">${UI.icon('search')}</div>${BO.seg('f', [['open', 'Ouvertes', S.orders.filter(o => o.status !== 'Livrée' && o.status !== 'Annulée').length], ['today', 'Aujourd’hui', S.orders.filter(o => o.delivery === t0).length], ['late', 'En retard', S.orders.filter(isLate).length], ['done', 'Livrées'], ['all', 'Toutes']], st.f)}<select class="inp" data-site>${BO.opts(BO.optSites(true), st.site, 'Tous les chantiers')}</select></div><div data-t></div>`;
    BO.table(body.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: o => BO.orderForm(o.id), rowCls: o => isLate(o) ? '' : '',
      empty: BO.empty('truck', 'Aucune commande', 'Rien ne correspond à ce filtre.', '', true),
      cols: [
        { k: 'no', label: 'N°', render: o => `<span class="code b">${esc(o.no)}</span>` },
        { k: 'label', label: 'Commande', render: o => `<div class="t1">${esc(o.label)}</div><div class="t2">${esc((VX.supplier(o.supplierId) || {}).name || '')}</div>` },
        { k: 'site', label: 'Chantier', get: o => BO.siteName(o.siteId), render: o => BO.pillSite(o.siteId) },
        { k: 'delivery', label: 'Livraison', render: o => `<span class="${isLate(o) ? 'bad-t b' : o.delivery === t0 ? 'tq-t b' : ''}">${o.delivery === t0 ? 'Aujourd’hui' : BO.dateS(o.delivery)}</span>${o.slot && o.slot !== '—' ? ` <span class="tag">${esc(o.slot)}</span>` : ''}${o.delayMin && o.status === 'En retard' ? `<div class="t2 bad-t">+${o.delayMin} min</div>` : ''}` },
        { k: 'amount', label: 'Montant', num: true, render: o => chf(o.amount) },
        { k: 'status', label: 'Statut', render: o => UI.statusChip(isLate(o) && o.status !== 'En retard' ? 'En retard' : o.status) + (o.reminders ? ` <span class="tag" title="Relances">${UI.icon('mail', 12)}&nbsp;${o.reminders}</span>` : '') },
        { k: 'a', label: '', nosort: true, render: o => o.status === 'Livrée' || o.status === 'Annulée' ? '' : `<div class="row" style="gap:4px;justify-content:flex-end">${isLate(o) || o.delivery <= addDays(t0, 1) ? `<button class="btn sm" data-rem="${o.id}">Relancer</button>` : ''}${o.status === 'Demandée' ? `<button class="btn sm" data-conf="${o.id}">Confirmée</button>` : ''}<button class="btn sm pri" data-rcv="${o.id}">${UI.icon('check', 13)}Reçue</button></div>` },
      ],
      foot: r => `<td colspan="4">${r.length} commandes</td><td class="num">${chf(r.reduce((a, o) => a + o.amount, 0))}</td><td colspan="2"></td>`,
      after: h => {
        h.querySelectorAll('[data-rem]').forEach(b => b.onclick = () => BO.supplierReminder(b.dataset.rem));
        h.querySelectorAll('[data-rcv]').forEach(b => b.onclick = () => BO.receiveOrder(b.dataset.rcv));
        h.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => { VX.upsert('orders', { id: b.dataset.conf, status: 'Confirmée' }, 'orders'); UI.toast('Commande confirmée', '', 'ok', 'check'); });
      },
    });
    BO.bindSearch(body, v => st.q = v);
    body.querySelector('[data-site]').addEventListener('change', e => { st.site = e.target.value; APP.refresh(); });
  }
  function suppliers(body) {
    const S = VX.S, y = String(new Date().getFullYear());
    body.innerHTML = `<div class="toolbar"><span class="muted sm-t">${S.suppliers.length} partenaires · triés par volume d’achats</span><span class="sp"></span><button class="btn pri" data-newf>${UI.icon('plus', 16)}Ajouter</button></div>
      <div class="g g3">${S.suppliers.map(f => [f, S.orders.filter(o => o.supplierId === f.id)]).sort((a, b) => b[1].reduce((x, o) => x + o.amount, 0) - a[1].reduce((x, o) => x + o.amount, 0)).map(([f, os]) => {
        const open = os.filter(o => o.status !== 'Livrée' && o.status !== 'Annulée'), late = os.filter(isLate);
        return `<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="align-items:flex-start"><span class="sc-ic" style="width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:${f.kind === 'Sous-traitant' ? 'var(--violet-soft)' : 'var(--tq-soft)'};color:${f.kind === 'Sous-traitant' ? 'var(--violet)' : 'var(--tq-dd)'}">${UI.icon(f.kind === 'Sous-traitant' ? 'helmet' : 'box', 19)}</span><div style="flex:1;min-width:0"><b>${esc(f.name)}</b><div class="xs-t muted">${esc(f.cat)}</div></div><span class="chip ${f.kind === 'Sous-traitant' ? 'violet' : ''}">${esc(f.kind)}</span></div>
          <div class="row sm-t"><span data-rate="${f.id}" style="cursor:pointer" title="Évaluer">${BO.stars(f.rating)}</span><b>${BO.num(f.rating, 1)}</b><span class="sp"></span><span class="muted">Paiement ${f.terms} j</span></div>
          <div class="row sm-t"><span class="muted">${esc(f.contact)}</span><span class="sp"></span><a class="lnk" href="tel:${esc((f.phone || '').replace(/\s/g, ''))}">${esc(f.phone)}</a></div>
          <div class="row sm-t" style="padding-top:10px;border-top:1px solid var(--line)"><span>Volume <b>${chfK(os.filter(o => o.date.startsWith(y)).reduce((a, o) => a + o.amount, 0))}</b></span><span class="sp"></span>${open.length ? `<span class="chip">${open.length} ouverte${open.length > 1 ? 's' : ''}</span>` : ''}${late.length ? `<span class="chip red">${late.length} en retard</span>` : ''}</div>
          <div class="row"><button class="btn sm" data-ef="${f.id}">${UI.icon('edit', 13)}Fiche</button><span class="sp"></span><button class="btn sm pri" data-of="${f.id}">${UI.icon('plus', 13)}Commander</button></div></div>`;
      }).join('')}</div>`;
    body.querySelector('[data-newf]').onclick = () => supplierForm();
    body.querySelectorAll('[data-ef]').forEach(b => b.onclick = () => supplierForm(b.dataset.ef));
    body.querySelectorAll('[data-of]').forEach(b => b.onclick = () => BO.orderForm(null, { supplierId: b.dataset.of }));
    body.querySelectorAll('[data-rate]').forEach(b => b.onclick = () => { const f = VX.supplier(b.dataset.rate); BO.formModal({ title: 'Évaluer ' + f.name, fields: [{ k: 'q', label: 'Qualité', type: 'number', min: 1, max: 5, step: 1, req: true }, { k: 'p', label: 'Ponctualité', type: 'number', min: 1, max: 5, step: 1, req: true }, { k: 'c', label: 'Prix / conditions', type: 'number', min: 1, max: 5, step: 1, req: true }], values: { q: Math.round(f.rating), p: Math.round(f.rating), c: Math.round(f.rating) }, submit: 'Enregistrer l’évaluation', onSubmit: v => { const r = Math.round(((v.q + v.p + v.c) / 3 * .6 + f.rating * .4) * 10) / 10; VX.upsert('suppliers', { id: f.id, rating: r }, 'suppliers'); UI.toast('Évaluation enregistrée', f.name + ' · ' + BO.num(r, 1) + ' / 5', 'ok', 'check'); } }); });
  }
  function deliveries(body) {
    const S = VX.S, t0 = today(), days = Array.from({ length: 7 }, (_, i) => addDays(t0, i));
    const lateOld = S.orders.filter(o => isLate(o) && o.delivery < t0);
    body.innerHTML = `${lateOld.length ? `<div class="form-note red mb">${BO.icon('alert', 17)}<div>${lateOld.length} livraison${lateOld.length > 1 ? 's' : ''} non reçue${lateOld.length > 1 ? 's' : ''} des jours précédents : ${lateOld.map(o => esc(o.no)).join(', ')}</div></div>` : ''}
      <div class="g" style="grid-template-columns:repeat(7,minmax(150px,1fr));overflow-x:auto;gap:10px">${days.map(d => { const os = S.orders.filter(o => o.delivery === d && o.status !== 'Annulée').sort((a, b) => (a.slot || '').localeCompare(b.slot || '')); return `<div class="kcol" style="min-height:300px"><div class="kcol-h">${esc(BO.dayName(d))} ${U.parse(d).getDate()}${d === t0 ? ' <span class="chip" style="height:20px">Auj.</span>' : ''}<span class="n">${os.length}</span></div>${os.length ? os.map(o => { const s = VX.site(o.siteId) || {}; return `<div class="kcard" style="cursor:pointer;border-left-color:${s.color || '#ccc'}" data-o="${o.id}"><div class="row wrap xs-t b" style="gap:5px"><span class="tag">${esc(o.slot || '—')}</span>${UI.statusChip(isLate(o) ? 'En retard' : o.status)}</div><div class="kt" style="margin-top:6px;font-size:12.5px">${esc(o.label)}</div><div class="km">${esc(s.code || '')} · ${esc((VX.supplier(o.supplierId) || {}).name || '')}</div></div>`; }).join('') : '<div class="kempty">—</div>'}</div>`; }).join('')}</div>`;
    body.querySelectorAll('[data-o]').forEach(c => c.onclick = () => BO.orderForm(c.dataset.o));
  }

  function render(el, p) {
    const S = VX.S, t0 = today();
    if (p.id && S.orders.find(o => o.id === p.id)) { const id = p.id; p.id = null; st.tab = 'orders'; setTimeout(() => BO.orderForm(id), 30); }
    if (p.tab) st.tab = p.tab;
    const open = S.orders.filter(o => o.status !== 'Livrée' && o.status !== 'Annulée'), late = S.orders.filter(isLate);
    el.innerHTML = `<div class="bo-page">${BO.head('Achats & livraisons', 'Commandes de matériaux, sous-traitance, créneaux de livraison sur les chantiers', `<button class="btn pri" data-new>${UI.icon('plus', 16)}Nouvelle commande</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Commandes ouvertes', v: open.length, s: chfK(open.reduce((a, o) => a + o.amount, 0)) + ' engagés', icon: 'box', cls: 'hero' })}
        ${BO.kpi({ lb: 'Livraisons aujourd’hui', v: S.orders.filter(o => o.delivery === t0).length, s: S.orders.filter(o => o.delivery === t0).map(o => esc((VX.site(o.siteId) || {}).code || '') + ' ' + esc(o.slot)).join(' · ') || 'aucune', icon: 'truck' })}
        ${BO.kpi({ lb: 'En retard', v: late.length, s: late.map(o => esc((VX.supplier(o.supplierId) || {}).name || '')).join(', ') || 'tout est à l’heure', icon: 'alert', cls: late.length ? 'red' : 'green' })}
        ${BO.kpi({ lb: 'Achats 30 jours', v: chfK(S.orders.filter(o => diffDays(o.date, t0) <= 30).reduce((a, o) => a + o.amount, 0)), s: `${S.suppliers.length} fournisseurs & sous-traitants`, icon: 'coins' })}
      </div>
      ${BO.tabs([['orders', 'Commandes', open.length], ['deliveries', 'Livraisons 7 jours'], ['suppliers', 'Fournisseurs & sous-traitants', S.suppliers.length]], st.tab)}
      <div data-body></div></div>`;
    ({ orders, suppliers, deliveries })[st.tab](el.querySelector('[data-body]'));
    BO.bindTabs(el, t => { st.tab = t; p.tab = null; APP.refresh(); });
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-new]').addEventListener('click', () => BO.orderForm());
  }
  APP.register({ id: 'purchasing', label: 'Achats & livraisons', icon: 'truck', group: 'Logistique', order: 40, render, badge: () => VX.S.orders.filter(isLate).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Parc machines : localisation, services, coûts par chantier, déplacements
   Données ajoutées : VX.S.maintenance = [{ id, eqId, date, type, note, cost, by }]
   ========================================================================== */
(function () {
  const U = VX.util, { esc, chf, chfK, today, addDays, diffDays } = U;
  const st = { type: '', site: '', status: '', q: '', tbl: { sort: 'nextService', dir: 'asc' } };
  const TYPE_IC = { Grue: 'crane', Pelle: 'excavator', Dumper: 'truck', Pompe: 'flame', Nacelle: 'layers', Compacteur: 'road', Camion: 'truck', Véhicule: 'truck', Coffrage: 'grid' };
  const svcState = m => { if (!m.nextService) return { cls: 'grey', l: 'Sans échéance', d: 9999 }; const d = diffDays(today(), m.nextService); return d < 0 ? { cls: 'red', l: 'Dépassé de ' + (-d) + ' j', d } : d <= 14 ? { cls: 'amber', l: d === 0 ? 'Aujourd’hui' : 'Dans ' + d + ' j', d } : { cls: 'green', l: BO.dateS(m.nextService), d }; };

  BO.serviceForm = id => {
    const m = VX.S.equipment.find(x => x.id === id);
    BO.formModal({
      title: 'Service / entretien – ' + m.name,
      fields: [
        { k: 'type', label: 'Intervention', type: 'select', opts: ['Service 250 h', 'Service 500 h', 'Contrôle périodique SUVA', 'Expertise annuelle', 'Réparation', 'Pneus / chenilles', 'Service km'] },
        { k: 'date', label: 'Date', type: 'date', req: true, validate: v => v > today() ? 'Pas dans le futur' : '' },
        { k: 'by', label: 'Réalisé par', type: 'select', opts: ['Atelier Vanteo', 'Liebherr Service', 'Avesco (Caterpillar)', 'Wacker Neuson', 'Mercedes Trucks Crissier', 'Haulotte Service'] },
        { k: 'cost', label: 'Coût (CHF)', type: 'number', min: 0, step: 10, req: true },
        { k: 'hours', label: m.km != null ? 'Kilométrage relevé' : 'Compteur (heures)', type: 'number', min: 0, step: 1 },
        { k: 'next', label: 'Prochain service', type: 'date', req: true, validate: v => v <= today() ? 'Doit être dans le futur' : '' },
        { k: 'note', label: 'Travaux effectués', type: 'textarea', full: true, rows: 3, ph: 'Vidange, filtres, graissage, contrôle câbles…' },
      ],
      values: { type: m.type === 'Grue' ? 'Contrôle périodique SUVA' : m.km != null ? 'Service km' : 'Service 500 h', date: today(), by: 'Atelier Vanteo', cost: m.type === 'Grue' ? 1850 : 1200, hours: m.km != null ? m.km : m.hours, next: addDays(today(), m.type === 'Grue' ? 90 : 120) },
      submit: 'Enregistrer l’entretien',
      onSubmit: v => {
        VX.S.maintenance.unshift({ id: U.uid('mt'), eqId: m.id, date: v.date, type: v.type, note: v.note, cost: v.cost, by: v.by });
        const upd = { id: m.id, nextService: v.next, status: m.siteId === 'hq' ? 'Disponible' : 'En service' };
        if (v.hours != null) upd[m.km != null ? 'km' : 'hours'] = v.hours;
        VX.upsert('equipment', upd, 'equipment');
        VX.log('Entretien ' + v.type + ' : ' + m.name, 'machine', m.siteId); VX.save();
        UI.toast('Entretien enregistré', m.name + ' · prochain le ' + U.fmtDate(v.next), 'ok', 'wrench');
      },
    });
  };
  BO.moveEquipment = id => {
    const m = VX.S.equipment.find(x => x.id === id);
    BO.pickSite({ title: 'Déplacer ' + m.name, withTask: false, exclude: m.siteId, onPick: sid => {
      const from = m.siteId;
      VX.upsert('equipment', { id: m.id, siteId: sid, status: m.status === 'En révision' ? 'En révision' : sid === 'hq' ? 'Disponible' : 'En service' }, 'equipment');
      VX.log(m.name + ' transférée : ' + BO.siteName(from) + ' → ' + BO.siteName(sid), 'machine', sid); VX.save();
      VX.emit('equipment:move', { id: m.id, fromSite: from, toSite: sid });
      UI.toast('Machine déplacée', m.name + ' → ' + BO.siteName(sid), 'ok', 'excavator');
    } });
  };
  const eqForm = id => {
    const m = id ? VX.S.equipment.find(x => x.id === id) : null;
    BO.formModal({
      title: m ? 'Modifier ' + m.name : 'Nouvelle machine',
      fields: [
        { k: 'name', label: 'Désignation', req: true, full: true, ph: 'ex. Mini-pelle Kubota KX057' },
        { k: 'type', label: 'Catégorie', type: 'select', opts: Object.keys(TYPE_IC) }, { k: 'plate', label: 'Plaque / n° série', ph: 'VD 12 345' },
        { k: 'siteId', label: 'Emplacement', type: 'select', opts: BO.optSites(true) }, { k: 'status', label: 'Statut', type: 'select', opts: ['Disponible', 'En service', 'En révision', 'Hors service'] },
        { k: 'hours', label: 'Compteur (h)', type: 'number', min: 0, step: 1 }, { k: 'dayRate', label: 'Tarif interne / jour (CHF)', type: 'number', min: 0, step: 5, req: true },
        { k: 'nextService', label: 'Prochain service', type: 'date' },
      ],
      values: m || { type: 'Pelle', siteId: 'hq', status: 'Disponible', hours: 0, dayRate: 400, nextService: addDays(today(), 180) },
      onSubmit: v => { const o = Object.assign({ id: m ? m.id : U.uid('m'), log: [] }, m || {}, v); VX.upsert('equipment', o, 'equipment'); UI.toast(m ? 'Machine mise à jour' : 'Machine ajoutée au parc', v.name, 'ok', 'excavator'); },
    });
  };
  const eqDrawer = id => BO.drawer({
    head: () => { const m = VX.S.equipment.find(x => x.id === id); return m ? `<span class="sc-ic" style="width:50px;height:50px;border-radius:15px;display:grid;place-items:center;background:var(--tq-soft);color:var(--tq-dd)">${UI.icon(TYPE_IC[m.type] || 'excavator', 26)}</span>` : ''; },
    title: () => { const m = VX.S.equipment.find(x => x.id === id); return m ? esc(m.name) : null; },
    sub: () => { const m = VX.S.equipment.find(x => x.id === id); return `${UI.statusChip(m.status)} <span>${esc(m.type)} · ${esc(m.plate)}</span>`; },
    render: () => {
      const m = VX.S.equipment.find(x => x.id === id), sv = svcState(m), logs = VX.S.maintenance.filter(x => x.eqId === id).sort((a, b) => b.date.localeCompare(a.date));
      const cost = logs.reduce((a, x) => a + (x.cost || 0), 0);
      return `<div class="dsec"><h4>Localisation</h4><div class="row">${BO.pillSite(m.siteId)}<span class="sp"></span><button class="btn sm pri" data-mv>${BO.xi('swap', 14)}Déplacer</button>${BO.mapBtn('site', m.siteId, '')}</div></div>
        <div class="dsec"><h4>Entretien</h4><div class="row"><span class="chip ${sv.cls}">${UI.icon('wrench', 13)} ${esc(sv.l)}</span><span class="muted sm-t">${m.nextService ? 'prochain service ' + BO.date(m.nextService) : ''}</span><span class="sp"></span><button class="btn sm" data-svc>${UI.icon('check', 13)}Service effectué</button></div></div>
        <div class="dsec"><h4>Caractéristiques</h4><dl class="kv"><dt>${m.km != null ? 'Kilométrage' : 'Compteur'}</dt><dd>${m.km != null ? BO.num(m.km) + ' km' : BO.num(m.hours || 0) + ' h'}</dd><dt>Tarif interne</dt><dd>${chf(m.dayRate)} / jour · ≈ ${chf(m.dayRate * 21)} / mois</dd><dt>Plaque / série</dt><dd>${esc(m.plate)}</dd><dt>Coûts d’entretien</dt><dd>${chf(cost)} (historique)</dd></dl></div>
        <div class="dsec"><h4>Carnet d’entretien</h4>${logs.length ? `<div class="mini-list">${logs.map(x => `<div style="align-items:flex-start">${UI.icon('wrench', 16)}<div style="flex:1"><b class="sm-t">${esc(x.type)}</b><div class="xs-t muted">${BO.date(x.date)} · ${esc(x.by || '')}${x.note ? ' · ' + esc(x.note) : ''}</div></div><b class="sm-t">${chf(x.cost || 0)}</b></div>`).join('')}</div>` : '<div class="muted sm-t">Aucune intervention enregistrée.</div>'}</div>`;
    },
    foot: () => `<button class="btn" data-ed>${UI.icon('edit', 15)}Modifier</button><span class="sp"></span><button class="btn" data-hs>Mettre hors service</button>`,
    onMount: d => {
      const m = VX.S.equipment.find(x => x.id === id); if (!m) return;
      d.querySelector('[data-mv]').onclick = () => BO.moveEquipment(id);
      d.querySelector('[data-svc]').onclick = () => BO.serviceForm(id);
      d.querySelector('[data-ed]').onclick = () => eqForm(id);
      const hs = d.querySelector('[data-hs]'); hs.textContent = m.status === 'Hors service' ? 'Remettre en service' : 'Mettre hors service';
      hs.onclick = () => { const ns = m.status === 'Hors service' ? (m.siteId === 'hq' ? 'Disponible' : 'En service') : 'Hors service'; VX.upsert('equipment', { id, status: ns }, 'equipment'); UI.toast('Statut modifié', m.name + ' → ' + ns, ns === 'Hors service' ? 'warn' : 'ok'); };
    },
  });

  function render(el, p) {
    const S = VX.S;
    if (p.id && S.equipment.find(m => m.id === p.id)) { const id = p.id; p.id = null; setTimeout(() => eqDrawer(id), 30); }
    let rows = S.equipment.slice();
    if (st.type) rows = rows.filter(m => m.type === st.type);
    if (st.site) rows = rows.filter(m => m.siteId === st.site);
    if (st.status) rows = rows.filter(m => m.status === st.status);
    if (st.q) { const q = st.q.toLowerCase(); rows = rows.filter(m => (m.name + ' ' + m.plate + ' ' + m.type).toLowerCase().includes(q)); }
    const onSite = S.equipment.filter(m => m.siteId !== 'hq'), dueSoon = S.equipment.filter(m => m.nextService && diffDays(today(), m.nextService) <= 14);
    const daily = onSite.reduce((a, m) => a + m.dayRate, 0);
    const bySite = BO.activeSites().map(s => [s, S.equipment.filter(m => m.siteId === s.id)]).filter(x => x[1].length);
    const maxSite = Math.max(1, ...bySite.map(([, ms]) => ms.reduce((a, m) => a + m.dayRate, 0)));
    el.innerHTML = `<div class="bo-page">${BO.head('Parc machines', `${S.equipment.length} engins et équipements · ${onSite.length} sur les chantiers`, `<button class="btn" data-map="site:hq">${UI.icon('map', 16)}Voir sur la carte</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Nouvelle machine</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Machines', v: S.equipment.length, s: `${S.equipment.filter(m => m.status === 'En service').length} en service · ${S.equipment.filter(m => m.status === 'Disponible').length} disponibles`, icon: 'excavator', cls: 'hero' })}
        ${BO.kpi({ lb: 'Taux d’utilisation', v: BO.pct(onSite.length / (S.equipment.length || 1)), s: 'machines affectées à un chantier', icon: 'chart' })}
        ${BO.kpi({ lb: 'Services ≤ 14 jours', v: dueSoon.length, s: `${S.equipment.filter(m => m.nextService && diffDays(today(), m.nextService) < 0).length} dépassé(s)`, icon: 'wrench', cls: dueSoon.some(m => diffDays(today(), m.nextService) < 0) ? 'red' : dueSoon.length ? 'amber' : 'green' })}
        ${BO.kpi({ lb: 'Coût machines / jour', v: chfK(daily), s: '≈ ' + chfK(daily * 21) + ' / mois imputés aux chantiers', icon: 'coins' })}
      </div>
      <div class="g g-main"><div style="min-width:0">
        <div class="toolbar"><div class="srch"><input class="inp" data-q placeholder="Machine, plaque…" value="${esc(st.q)}">${UI.icon('search')}</div>
          <select class="inp" data-f="type">${BO.opts([...new Set(S.equipment.map(m => m.type))], st.type, 'Toutes catégories')}</select>
          <select class="inp" data-f="site">${BO.opts(BO.optSites(true), st.site, 'Tous les emplacements')}</select>
          <select class="inp" data-f="status">${BO.opts(['Disponible', 'En service', 'En révision', 'Hors service'], st.status, 'Tous statuts')}</select></div>
        <div data-t></div></div>
        <div style="display:flex;flex-direction:column;gap:16px;min-width:0">
          <div class="card pad"><h2 class="sec">${UI.icon('coins', 18)}Coût par chantier</h2>${bySite.map(([s, ms]) => { const c = ms.reduce((a, m) => a + m.dayRate, 0); return `<div style="margin:10px 0"><div class="row sm-t"><i class="dot-s" style="background:${s.color}"></i><b style="flex:1">${esc(s.name)}</b><span class="tnum">${chf(c)} / j</span></div><div class="bar" style="margin-top:5px"><i style="width:${c / maxSite * 100}%;background:${s.color}"></i></div><div class="xs-t muted" style="margin-top:3px">${ms.map(m => esc(m.name.split(' ').slice(0, 2).join(' '))).join(' · ')}</div></div>`; }).join('') || '<div class="muted sm-t">Aucune machine sur chantier.</div>'}</div>
          <div class="card"><div class="card-h"><h3>${UI.icon('wrench', 18)}Derniers entretiens</h3></div><div class="mini-list" style="padding:0 16px 10px">${S.maintenance.slice().sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6).map(x => { const m = S.equipment.find(e => e.id === x.eqId) || {}; return `<div style="cursor:pointer" data-eq="${x.eqId}">${UI.icon('wrench', 15)}<div style="flex:1;min-width:0"><b class="sm-t">${esc(m.name || '')}</b><div class="xs-t muted">${esc(x.type)} · ${BO.dateS(x.date)}</div></div><span class="sm-t">${chf(x.cost || 0)}</span></div>`; }).join('')}</div></div>
        </div></div></div>`;
    BO.table(el.querySelector('[data-t]'), {
      rows, state: st.tbl, onRow: m => eqDrawer(m.id),
      cols: [
        { k: 'name', label: 'Machine', render: m => `<div class="who"><span class="sc-ic" style="width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--tq-soft);color:var(--tq-dd)">${UI.icon(TYPE_IC[m.type] || 'excavator', 18)}</span><div><div class="t1">${esc(m.name)}</div><div class="t2">${esc(m.type)} · ${esc(m.plate)}</div></div></div>` },
        { k: 'site', label: 'Emplacement', get: m => BO.siteName(m.siteId), render: m => BO.pillSite(m.siteId) },
        { k: 'status', label: 'Statut', render: m => UI.statusChip(m.status) },
        { k: 'hours', label: 'Compteur', num: true, get: m => m.km != null ? m.km / 10 : m.hours, render: m => m.km != null ? BO.num(m.km) + ' km' : m.hours ? BO.num(m.hours) + ' h' : '—' },
        { k: 'nextService', label: 'Prochain service', get: m => svcState(m).d, render: m => { const s = svcState(m); return `<span class="chip ${s.cls}">${esc(s.l)}</span>`; } },
        { k: 'dayRate', label: 'Tarif / j', num: true, render: m => chf(m.dayRate) },
        { k: 'a', label: '', nosort: true, render: m => `<div class="row" style="gap:4px;justify-content:flex-end"><button class="btn sm" data-mv="${m.id}">${BO.xi('swap', 13)}Déplacer</button>${svcState(m).d <= 14 ? `<button class="btn sm" data-svc="${m.id}">Service</button>` : ''}</div>` },
      ],
      after: h => { h.querySelectorAll('[data-mv]').forEach(b => b.onclick = () => BO.moveEquipment(b.dataset.mv)); h.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => BO.serviceForm(b.dataset.svc)); },
    });
    BO.bindSearch(el, v => st.q = v);
    el.querySelectorAll('[data-f]').forEach(s => s.addEventListener('change', () => { st[s.dataset.f] = s.value; APP.refresh(); }));
    el.querySelector('[data-new]').addEventListener('click', () => eqForm());
    el.querySelectorAll('[data-eq]').forEach(b => b.addEventListener('click', () => eqDrawer(b.dataset.eq)));
  }
  APP.register({ id: 'equipment', label: 'Parc machines', icon: 'excavator', group: 'Logistique', order: 41, render, badge: () => VX.S.equipment.filter(m => m.nextService && diffDays(today(), m.nextService) < 0).length });
})();

</script>
<script>
/* ==========================================================================
   BO · Sécurité (SUVA) : incidents, mesures, quart d'heure sécurité, jours sans accident
   Données ajoutées : VX.S.toolbox = [{ id, siteId, date, topic, items:[{t,ok}], attendees, by, note }]
   ========================================================================== */
(function () {
  const U = VX.util, { esc, today, addDays, diffDays } = U;
  const st = { tab: 'incidents', f: 'open', site: '', tbl: { sort: 'date', dir: 'desc' } };
  const TYPES = ['Accident', 'Accident bénin', 'Presque-accident', 'Non-conformité EPI', 'Dommage matériel', 'Observation positive'];
  const SEV = { Basse: '#1f9d55', Moyenne: '#e8930c', Haute: '#e5484d', Critique: '#7a1d20' };
  const ISTATUS = ['Ouvert', 'Mesures prises', 'Clos'];
  const CHECK = ['Port des EPI (casque, chaussures, gilet, lunettes)', 'Protections de rive et trémies balisées', 'Échafaudages contrôlés et étiquetés', 'Harnais et points d’ancrage pour travaux en hauteur', 'Circulation engins / piétons séparée', 'Zones de levage balisées, élingues contrôlées', 'Trousse de premiers secours et numéros d’urgence affichés', 'Produits dangereux stockés (fiches de données de sécurité)', 'Ordre et propreté du chantier', 'Fouilles > 1,5 m blindées ou talutées'];
  const TOPICS = ['Chutes de hauteur', 'Engins de chantier et angles morts', 'Levage et élingage', 'Tranchées et fouilles', 'EPI : le bon équipement', 'Bruit et vibrations', 'Chaleur, UV et hydratation', 'Poussière de quartz', 'Les 10 règles vitales SUVA'];
  const tbDraft = {};

  BO.daysWithoutAccident = siteId => {
    const S = VX.S, inc = S.incidents.filter(x => (!siteId || x.siteId === siteId) && /^Accident/.test(x.type)).sort((a, b) => b.date.localeCompare(a.date))[0];
    if (inc) return diffDays(inc.date, today());
    const s = siteId ? VX.site(siteId) : null;
    return s && s.start ? Math.max(0, diffDays(s.start, today())) : 365;
  };
  BO.incidentForm = ({ siteId, id } = {}) => {
    const x = id ? VX.S.incidents.find(i => i.id === id) : null;
    BO.formModal({
      title: x ? 'Incident – ' + x.type : 'Déclarer un événement sécurité',
      fields: [
        { k: 'siteId', label: 'Chantier', type: 'select', opts: BO.optSites(true), req: true },
        { k: 'date', label: 'Date', type: 'date', req: true, validate: v => v > today() ? 'Pas dans le futur' : '' },
        { k: 'type', label: 'Type', type: 'select', opts: TYPES }, { k: 'severity', label: 'Gravité', type: 'select', opts: Object.keys(SEV) },
        { k: 'label', label: 'Description', req: true, full: true, ph: 'Que s’est-il passé ? Où ? Qui était concerné ?' },
        { k: 'by', label: 'Déclaré par', type: 'select', opts: BO.optEmps() }, { k: 'status', label: 'Statut', type: 'select', opts: ISTATUS },
        { k: 'action', label: 'Mesures immédiates / correctives', type: 'textarea', full: true, rows: 3, ph: 'ex. zone balisée, entretien sécurité, remplacement EPI…' },
        { k: 'lostDays', label: 'Jours d’arrêt (si accident)', type: 'number', min: 0, max: 365, step: 1 },
        { k: 'suva', label: 'Déclaration d’accident SUVA à transmettre', type: 'checkbox', full: true },
      ],
      values: x || { siteId: siteId || BO.activeSites()[0].id, date: today(), type: 'Presque-accident', severity: 'Moyenne', status: 'Ouvert', by: (VX.site(siteId) || {}).foremanId || VX.S.meId, lostDays: 0 },
      onMount: el => { const t = el.querySelector('[name=type]'), sv = el.querySelector('[name=suva]'); t.addEventListener('change', () => { if (/^Accident/.test(t.value)) sv.checked = true; }); },
      danger: x ? { title: 'Supprimer l’incident ?', text: 'L’incident sera retiré du registre.', run: () => { VX.remove('incidents', x.id, 'incident'); UI.toast('Incident supprimé', '', 'ok'); } } : null,
      submit: x ? 'Enregistrer' : 'Déclarer',
      onSubmit: v => {
        const o = Object.assign({ id: x ? x.id : U.uid('x') }, v);
        VX.upsert('incidents', o, 'incident');
        if (!x) { VX.log('Sécurité : ' + v.type + ' – ' + v.label, 'safety', v.siteId); VX.save(); VX.emit('safety', { id: o.id, siteId: v.siteId }); }
        UI.toast(x ? 'Incident mis à jour' : 'Événement déclaré', v.type + ' · ' + BO.siteName(v.siteId), v.severity === 'Haute' || v.severity === 'Critique' ? 'warn' : 'ok', 'shield');
      },
    });
  };
  const setStatus = (id, s) => { const x = VX.S.incidents.find(i => i.id === id); if (s === 'Clos' && !x.action) { BO.incidentForm({ id }); UI.toast('Mesures manquantes', 'Décrivez les mesures prises avant de clore.', 'warn'); return; } VX.upsert('incidents', { id, status: s }, 'incident'); VX.log('Incident ' + s.toLowerCase() + ' : ' + x.label, 'safety', x.siteId); VX.save(); UI.toast('Statut : ' + s, x.label, 'ok', 'shield'); };
  const incTable = (host, rows, showSite = true) => BO.table(host, {
    rows, state: st.tbl, onRow: x => BO.incidentForm({ id: x.id }),
    empty: BO.empty('shield', 'Aucun incident', 'Rien à signaler — bravo aux équipes.', '', true),
    cols: [
      { k: 'date', label: 'Date', render: x => `${BO.dateS(x.date)}<div class="t2">${BO.inDays(x.date)}</div>` },
      ...(showSite ? [{ k: 'site', label: 'Chantier', get: x => BO.siteName(x.siteId), render: x => BO.pillSite(x.siteId) }] : []),
      { k: 'type', label: 'Type / description', render: x => `<div class="t1">${esc(x.type)}</div><div class="t2">${esc(x.label)}</div>` },
      { k: 'severity', label: 'Gravité', get: x => Object.keys(SEV).indexOf(x.severity), render: x => `<span class="sev"><i style="background:${SEV[x.severity] || '#999'}"></i>${esc(x.severity)}</span>` },
      { k: 'action', label: 'Mesures', nosort: true, render: x => x.action ? `<span class="sm-t">${esc(x.action)}</span>` : '<span class="warn-t sm-t b">À définir</span>' },
      { k: 'by', label: 'Déclaré par', get: x => BO.empName(x.by), render: x => { const e = VX.emp(x.by); return e ? `<span class="row" style="gap:6px" data-open-emp="${e.id}">${UI.avatar(e, 22)}<span class="sm-t">${esc(e.first)}</span></span>` : '—'; } },
      { k: 'status', label: 'Statut', render: x => UI.statusChip(x.status) + (x.suva ? ' <span class="tag">SUVA</span>' : '') },
      { k: 'a', label: '', nosort: true, render: x => x.status === 'Clos' ? '' : `<div class="row" style="gap:4px;justify-content:flex-end">${x.status === 'Ouvert' ? `<button class="btn sm" data-st="${x.id}|Mesures prises">Mesures prises</button>` : ''}<button class="btn sm pri" data-st="${x.id}|Clos">Clore</button></div>` },
    ],
    after: h => h.querySelectorAll('[data-st]').forEach(b => b.onclick = () => { const [id, s] = b.dataset.st.split('|'); setStatus(id, s); }),
  });
  const toolboxCard = s => {
    const S = VX.S, ws = U.weekStart(today()), done = S.toolbox.filter(t => t.siteId === s.id && t.date >= ws);
    const d = tbDraft[s.id] || (tbDraft[s.id] = { topic: TOPICS[(U.hash(s.id + ws) % TOPICS.length)], items: CHECK.map(t => ({ t, ok: false })), attendees: VX.siteStaff(s.id).filter(e => e.status === 'present').length });
    const n = d.items.filter(i => i.ok).length;
    return `<div class="card pad" data-tb="${s.id}"><div class="row" style="margin-bottom:10px"><i class="dot-s" style="background:${s.color};width:12px;height:12px"></i><b style="flex:1">${esc(s.name)}</b>${done.length ? `<span class="chip green">${UI.icon('check', 12)} Fait le ${BO.dateS(done[0].date)}</span>` : '<span class="chip amber">À tenir cette semaine</span>'}</div>
      <div class="fgrid" style="gap:10px;margin-bottom:8px"><div class="field"><label>Thème</label><select class="inp sm" data-topic>${BO.opts(TOPICS, d.topic)}</select></div><div class="field"><label>Participants</label><input class="inp sm" type="number" min="1" max="99" data-att value="${d.attendees}"></div></div>
      <div class="check-list">${d.items.map((it, i) => `<label><input type="checkbox" data-ck="${i}" ${it.ok ? 'checked' : ''}>${esc(it.t)}</label>`).join('')}</div>
      <div class="row mt"><div class="bar" style="flex:1"><i style="width:${n / CHECK.length * 100}%"></i></div><b class="sm-t">${n}/${CHECK.length}</b><button class="btn sm pri" data-save>${UI.icon('check', 13)}Enregistrer</button></div></div>`;
  };
  const bindToolbox = host => host.querySelectorAll('[data-tb]').forEach(c => {
    const sid = c.dataset.tb, d = tbDraft[sid];
    c.querySelector('[data-topic]').onchange = e => d.topic = e.target.value;
    c.querySelector('[data-att]').oninput = e => d.attendees = +e.target.value || 0;
    c.querySelectorAll('[data-ck]').forEach(k => k.onchange = () => { d.items[+k.dataset.ck].ok = k.checked; const n = d.items.filter(i => i.ok).length; c.querySelector('.bar i').style.width = n / CHECK.length * 100 + '%'; c.querySelector('.row.mt b').textContent = n + '/' + CHECK.length; });
    c.querySelector('[data-save]').onclick = () => {
      const n = d.items.filter(i => i.ok).length;
      if (!d.attendees) { UI.toast('Participants manquants', 'Indiquez le nombre de participants.', 'warn'); return; }
      if (n < CHECK.length * .6) { UI.toast('Check-list incomplète', 'Contrôlez au moins 6 points avant d’enregistrer.', 'warn'); return; }
      const s = VX.site(sid);
      VX.S.toolbox.unshift({ id: U.uid('tb'), siteId: sid, date: today(), topic: d.topic, items: d.items.map(i => Object.assign({}, i)), attendees: d.attendees, by: s.foremanId || VX.S.meId });
      VX.log('Quart d’heure sécurité « ' + d.topic + ' » – ' + s.name + ' (' + d.attendees + ' pers.)', 'safety', sid); VX.save(); VX.emit('toolbox', { siteId: sid });
      delete tbDraft[sid];
      const ko = d.items.filter(i => !i.ok);
      UI.toast('Quart d’heure enregistré', s.name + (ko.length ? ' · ' + ko.length + ' point(s) à corriger' : ' · tout est conforme'), ko.length ? 'warn' : 'ok', 'shield');
      if (ko.length) setTimeout(() => BO.confirm('Créer une non-conformité ?', `${ko.length} point(s) non conforme(s) sur ${esc(s.name)} :<br>• ${ko.map(i => esc(i.t)).join('<br>• ')}`, 'Déclarer', () => { VX.upsert('incidents', { id: U.uid('x'), siteId: sid, date: today(), type: 'Non-conformité EPI', severity: 'Moyenne', label: 'Check-list sécurité : ' + ko.map(i => i.t.split(' (')[0]).join(', '), by: s.foremanId, status: 'Ouvert', action: '' }, 'incident'); UI.toast('Non-conformité déclarée', s.name, 'warn', 'shield'); }), 400);
    };
  });

  BO.safetySite = (body, siteId) => {
    const S = VX.S, s = VX.site(siteId), inc = S.incidents.filter(x => x.siteId === siteId), d = BO.daysWithoutAccident(siteId);
    body.innerHTML = `<div class="g g-main"><div style="min-width:0"><div class="toolbar"><span class="muted sm-t">${inc.length} événement${inc.length > 1 ? 's' : ''} au registre</span><span class="sp"></span><button class="btn pri" data-new>${UI.icon('plus', 16)}Déclarer un événement</button></div><div data-t></div>
      <h2 class="sec mt2">${UI.icon('shield', 18)}Historique des quarts d’heure sécurité</h2><div class="card">${S.toolbox.filter(t => t.siteId === siteId).length ? `<div class="mini-list" style="padding:0 16px">${S.toolbox.filter(t => t.siteId === siteId).map(t => `<div>${UI.icon('check', 16)}<div style="flex:1"><b class="sm-t">${esc(t.topic)}</b><div class="xs-t muted">${BO.date(t.date)} · ${t.attendees} participants · ${t.items.filter(i => i.ok).length}/${t.items.length} points conformes</div></div></div>`).join('')}</div>` : BO.empty('shield', 'Aucun quart d’heure enregistré', '', '', true)}</div></div>
      <div style="display:flex;flex-direction:column;gap:16px;min-width:0"><div class="kpi ${d >= 30 ? 'green' : d >= 7 ? 'amber' : 'red'}"><div class="lb">Jours sans accident</div><div class="ki">${UI.icon('shield', 18)}</div><div class="v" style="font-size:40px">${d}</div><div class="s">${esc(s.name)}</div></div>${toolboxCard(s)}</div></div>`;
    incTable(body.querySelector('[data-t]'), inc, false);
    body.querySelector('[data-new]').onclick = () => BO.incidentForm({ siteId });
    bindToolbox(body);
  };

  function render(el, p) {
    const S = VX.S, t0 = today();
    if (p.id && S.incidents.find(x => x.id === p.id)) { const id = p.id; p.id = null; st.tab = 'incidents'; setTimeout(() => BO.incidentForm({ id }), 30); }
    if (p.tab) { st.tab = p.tab; p.tab = null; }
    const sites = BO.activeSites(), ws = U.weekStart(t0);
    const open = S.incidents.filter(x => x.status !== 'Clos'), near = S.incidents.filter(x => x.type === 'Presque-accident' && diffDays(x.date, t0) <= 30);
    const tbDone = sites.filter(s => S.toolbox.some(t => t.siteId === s.id && t.date >= ws)).length;
    let rows = S.incidents.slice();
    if (st.f === 'open') rows = rows.filter(x => x.status !== 'Clos');
    if (st.f === 'acc') rows = rows.filter(x => /^Accident/.test(x.type));
    if (st.site) rows = rows.filter(x => x.siteId === st.site);
    el.innerHTML = `<div class="bo-page">${BO.head('Sécurité & santé', 'Registre SUVA, mesures correctives, quart d’heure sécurité hebdomadaire', `<button class="btn" data-csv>${UI.icon('download', 16)}Registre CSV</button><button class="btn pri" data-new>${UI.icon('plus', 16)}Déclarer un événement</button>`)}
      <div class="kpis">
        ${BO.kpi({ lb: 'Jours sans accident', v: BO.daysWithoutAccident(), s: 'toute l’entreprise', icon: 'shield', cls: 'hero' })}
        ${BO.kpi({ lb: 'Événements ouverts', v: open.length, s: open.filter(x => x.severity === 'Haute' || x.severity === 'Critique').length + ' de gravité haute', icon: 'alert', cls: open.length ? 'red' : 'green' })}
        ${BO.kpi({ lb: 'Presque-accidents 30 j', v: near.length, s: 'signalements = culture sécurité', icon: 'eye', cls: 'amber' })}
        ${BO.kpi({ lb: 'Quarts d’heure sécurité', v: tbDone + '<small>/ ' + sites.length + '</small>', s: 'chantiers à jour cette semaine', icon: 'check', cls: tbDone < sites.length ? 'amber' : 'green' })}
      </div>
      <div class="g g${Math.min(5, sites.length)} mb" style="grid-template-columns:repeat(${sites.length},minmax(0,1fr))">${sites.map(s => { const d = BO.daysWithoutAccident(s.id), o = S.incidents.filter(x => x.siteId === s.id && x.status !== 'Clos').length; return `<div class="card pad" style="border-top:4px solid ${s.color};cursor:pointer" data-open="sites:${s.id}:safety"><div class="xs-t b muted" style="text-transform:uppercase;letter-spacing:.08em">${esc(s.code)} · ${esc(s.city)}</div><div class="dwa mt" style="margin-top:8px"><b class="${d < 7 ? 'bad-t' : d < 30 ? 'warn-t' : ''}">${d}</b><span class="sm-t muted">jours sans accident</span></div><div class="row sm-t mt" style="margin-top:8px">${o ? `<span class="chip red">${o} ouvert${o > 1 ? 's' : ''}</span>` : '<span class="chip green">RAS</span>'}${S.toolbox.some(t => t.siteId === s.id && t.date >= ws) ? `<span class="chip green">${UI.icon('check', 11)} ¼ h</span>` : '<span class="chip amber">¼ h à faire</span>'}</div></div>`; }).join('')}</div>
      ${BO.tabs([['incidents', 'Registre des événements', open.length, open.length ? 'red' : ''], ['toolbox', 'Quart d’heure sécurité', sites.length - tbDone || '']], st.tab)}
      <div data-body></div></div>`;
    const body = el.querySelector('[data-body]');
    if (st.tab === 'incidents') {
      body.innerHTML = `<div class="toolbar">${BO.seg('f', [['open', 'Ouverts', open.length], ['acc', 'Accidents'], ['all', 'Tous', S.incidents.length]], st.f)}<select class="inp" data-site>${BO.opts(BO.optSites(true), st.site, 'Tous les chantiers')}</select></div><div data-t></div>`;
      incTable(body.querySelector('[data-t]'), rows);
      body.querySelector('[data-site]').onchange = e => { st.site = e.target.value; APP.refresh(); };
    } else {
      body.innerHTML = `<div class="form-note mb">${BO.icon('shield', 17)}<div>Chaque semaine, le chef de chantier anime un quart d’heure sécurité et contrôle les points ci-dessous. Les points non conformes peuvent être déclarés en un clic.</div></div><div class="g g3">${sites.map(toolboxCard).join('')}</div>`;
      bindToolbox(body);
    }
    BO.bindTabs(el, t => { st.tab = t; APP.refresh(); });
    BO.bindSeg(el, (n, v) => { st[n] = v; APP.refresh(); });
    el.querySelector('[data-new]').onclick = () => BO.incidentForm({ siteId: st.site });
    el.querySelector('[data-csv]').onclick = () => { BO.download('registre-securite-' + t0 + '.csv', BO.csv([['Date', 'Chantier', 'Type', 'Gravité', 'Description', 'Déclaré par', 'Mesures', 'Statut', 'Jours d’arrêt', 'SUVA']].concat(S.incidents.map(x => [x.date, BO.siteName(x.siteId), x.type, x.severity, x.label, BO.empName(x.by), x.action || '', x.status, x.lostDays || 0, x.suva ? 'oui' : 'non']))), 'text/csv;charset=utf-8'); UI.toast('Registre exporté', S.incidents.length + ' événements', 'ok', 'download'); };
  }
  APP.register({ id: 'safety', label: 'Sécurité SUVA', icon: 'shield', group: 'Qualité & sécurité', order: 50, render, badge: () => VX.S.incidents.filter(x => x.status === 'Ouvert').length });
})();

</script>
<script>
/* ==========================================================================
   BO · Paramètres : entreprise, TVA, données (export / import / réinitialisation)
   ========================================================================== */
(function () {
  const U = VX.util, { esc, today } = U;
  const FIELDS = [
    ['name', 'Raison sociale'], ['ide', 'N° IDE'], ['address', 'Adresse'], ['phone', 'Téléphone'], ['email', 'E-mail'], ['iban', 'IBAN / QR-IBAN'], ['bank', 'Banque'],
  ];
  const ROLES_ACL = [
    ['Direction', 'Tout', 'Tout', 'Tout', 'Tout'], ['Conducteur·rice de travaux', 'Ses chantiers', 'Lecture + offres', 'Lecture', 'Ses équipes'],
    ['Chef de chantier', 'Son chantier', '—', '—', 'Pointage de son équipe'], ['Comptabilité & salaires', 'Lecture', 'Factures, paiements', 'Tout', 'Validation des heures'], ['Achats & logistique', 'Lecture', '—', 'Commandes', '—'],
  ];

  function render(el) {
    const S = VX.S, co = S.company;
    let size = 0; try { size = (localStorage.getItem(VX.KEY) || '').length; } catch (e) {}
    const counts = [['Chantiers', S.sites.length - 1], ['Employés', S.employees.length], ['Tâches', S.tasks.length], ['Clients', S.clients.length], ['Offres', S.quotes.length], ['Factures', S.invoices.length], ['Commandes', S.orders.length], ['Pointages', S.timesheets.length], ['Journal', S.journal.length], ['Documents', S.documents.length], ['Incidents', S.incidents.length], ['Machines', S.equipment.length]];
    el.innerHTML = `<div class="bo-page" style="max-width:1100px">${BO.head('Paramètres', 'Entreprise, fiscalité, droits d’accès et données de démonstration')}
      <div class="card pad" style="padding:6px 26px">
        <div class="set-sec"><div><h3>Entreprise</h3><p>Ces informations apparaissent sur les offres, les factures et la QR-facture. Enregistrement automatique.</p></div>
          <div class="fgrid">${FIELDS.map(([k, l]) => `<div class="field ${k === 'address' || k === 'name' ? 'full' : ''}"><label>${l}</label><input class="inp" data-co="${k}" value="${esc(co[k] || '')}"></div>`).join('')}</div></div>
        <div class="set-sec"><div><h3>TVA & arrondis</h3><p>Taux normal suisse en vigueur depuis le 1<sup>er</sup> janvier 2024. Les totaux TTC sont arrondis à 5 centimes.</p></div>
          <div class="fgrid"><div class="field"><label>Taux de TVA (%)</label><input class="inp" type="number" min="0" max="20" step="0.1" data-tva value="${BO.num(BO.tva() * 100, 1).replace(',', '.')}"></div><div class="field"><label>Méthode</label><select class="inp" data-co="tvaMethod">${BO.opts(['Taux effectifs (convenus)', 'Taux de la dette fiscale nette'], co.tvaMethod || 'Taux effectifs (convenus)')}</select></div>
          <div class="field"><label>Retenue de garantie (situations)</label><input class="inp" value="5 % (SIA 118)" disabled></div><div class="field"><label>Délai de paiement par défaut</label><input class="inp" value="30 jours net" disabled></div></div></div>
        <div class="set-sec"><div><h3>Rôles & accès</h3><p>Matrice des droits par profil (aperçu — l’authentification et les droits sont activés en production).</p></div>
          <div class="tbl-wrap" style="box-shadow:inset 0 0 0 1px var(--line)"><table class="tbl compact"><thead><tr><th>Profil</th><th>Chantiers</th><th>Commercial</th><th>Finance</th><th>Heures</th></tr></thead><tbody>${ROLES_ACL.map(r => `<tr>${r.map((c, i) => `<td class="${i ? 'sm-t' : 'b'}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>
        <div class="set-sec"><div><h3>Données</h3><p>Données de démonstration stockées dans ce navigateur (${BO.num(size / 1024, 1)} Ko). Partagées en direct avec la carte 3D.</p></div>
          <div><div class="g g4" style="gap:8px">${counts.map(([l, n]) => `<div class="note-box" style="padding:10px 12px"><b style="font-size:18px;color:var(--ink)">${n}</b><div class="xs-t">${l}</div></div>`).join('')}</div>
          <div class="row wrap mt"><button class="btn" data-export>${UI.icon('download', 16)}Exporter (JSON)</button><button class="btn" data-import>${BO.xi('upload', 16)}Importer…</button><span class="sp"></span><button class="btn dark" data-reset>${UI.icon('refresh', 16)}Réinitialiser la démo</button></div></div></div>
        <div class="set-sec"><div><h3>À propos</h3><p>Cockpit chantiers Vanteo — carte live + back-office.</p></div><div class="sm-t muted" style="line-height:1.6">Hébergement prévu en Suisse (nLPD), sauvegardes quotidiennes, journal des modifications.<br>Intégrations prévues : comptabilité (Abacus / Bexio), banque (camt.054 pour les paiements QR), simap.ch (appels d’offres publics), Outlook / Teams.</div></div>
      </div></div>`;
    el.querySelectorAll('[data-co]').forEach(i => i.addEventListener('change', () => {
      const k = i.dataset.co, v = i.value.trim();
      if ((k === 'name' || k === 'iban') && !v) { UI.toast('Champ obligatoire', 'Ce champ ne peut pas être vide.', 'warn'); i.value = co[k] || ''; return; }
      if (k === 'email' && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { UI.toast('E-mail invalide', '', 'warn'); return; }
      if (k === 'iban' && !/^CH\d{2}[\s\d]{15,}$/i.test(v.replace(/\s+/g, ' '))) { UI.toast('IBAN suisse attendu', 'Format CHxx xxxx …', 'warn'); return; }
      S.company[k] = v; VX.save(); VX.emit('company', { k }); UI.toast('Enregistré', 'Informations de l’entreprise mises à jour', 'ok', 'check'); i.blur();
    }));
    el.querySelector('[data-tva]').addEventListener('change', e => { const v = parseFloat(e.target.value); if (!(v >= 0 && v <= 20)) { UI.toast('Taux invalide', 'Entre 0 et 20 %', 'warn'); return; } S.company.tvaRate = Math.round(v * 10) / 1000; VX.save(); VX.emit('company', { k: 'tvaRate' }); UI.toast('TVA mise à jour', BO.tvaLbl() + ' appliqué aux offres et factures', 'ok', 'percent'); e.target.blur(); });
    el.querySelector('[data-export]').addEventListener('click', () => { BO.download('vanteo-donnees-' + today() + '.json', JSON.stringify(VX.S, null, 2), 'application/json'); UI.toast('Export prêt', 'Toutes les données au format JSON', 'ok', 'download'); });
    el.querySelector('[data-import]').addEventListener('click', () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d || d.v !== 1 || !Array.isArray(d.sites) || !Array.isArray(d.employees)) throw new Error('format'); BO.confirm('Importer ces données ?', `Le fichier <b>${esc(f.name)}</b> remplacera toutes les données actuelles (${d.sites.length - 1} chantiers, ${d.employees.length} employés). La page sera rechargée.`, 'Importer', () => { localStorage.setItem(VX.KEY, JSON.stringify(d)); location.reload(); }, true); } catch (e) { UI.toast('Fichier invalide', 'Ce n’est pas un export Vanteo.', 'err'); } }; r.readAsText(f); };
      inp.click();
    });
    el.querySelector('[data-reset]').addEventListener('click', () => BO.confirm('Réinitialiser la démo ?', 'Toutes les modifications (affectations, offres, factures, pointages…) seront effacées et les données d’origine restaurées, sur la carte comme dans le back-office.', 'Réinitialiser', () => { BO.closeDrawer(); VX.reset(); UI.toast('Démo réinitialisée', 'Données d’origine restaurées', 'ok', 'refresh'); APP.open('dashboard'); }, true));
  }
  APP.register({ id: 'settings', label: 'Paramètres', icon: 'settings', group: 'Administration', order: 90, render });
})();

</script>
